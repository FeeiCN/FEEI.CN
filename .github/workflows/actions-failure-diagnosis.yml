name: GitHub Actions 失败诊断

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 可选，指定失败运行编号；留空巡检全部 Actions 最近7天记录
        required: false
        type: string
      report_run_id:
        description: 可选，仅从指定诊断运行的成功调查产物重放交付，不调用模型；与 run_id 互斥
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: actions-failure-diagnosis
  cancel-in-progress: false

jobs:
  investigate:
    if: github.ref == 'refs/heads/main' && inputs.report_run_id == '' && (github.event_name == 'schedule' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify diagnosis and delivery
        run: python3 -m unittest discover -s scripts -p 'test_codex_actions_diagnosis.py'
      - name: Read all workflows and pending failed runs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
        run: python3 scripts/codex_actions_diagnosis.py prepare
      - name: Install Codex
        if: steps.prepare.outputs.ready == 'true'
        run: python3 scripts/codex_runner.py install
      - name: Verify read-only repository and research network
        if: steps.prepare.outputs.ready == 'true'
        env:
          AUTOMATION_PERMISSION_CONFIG: '{extends=":read-only", filesystem={":workspace_roots"={output="write"}}, network={enabled=true}}'
        run: python3 scripts/check_automation_permissions.py
      - name: Investigate failures with Codex
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 scripts/codex_actions_diagnosis.py execute
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outputs.ready == 'true'
        with:
          name: codex-actions-diagnosis-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            output/codex-actions-diagnosis/context.json
            output/codex-actions-diagnosis/result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Save Codex execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-execution-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-executions/*.json
          if-no-files-found: ignore
          retention-days: 30

  restore:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.report_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.validate.outputs.ready }}
      artifact_id: ${{ steps.validate.outputs.artifact-id }}
      source_run: ${{ steps.validate.outputs.source-run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate completed investigation and immutable artifact
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RUN_ID: ${{ inputs.report_run_id }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
        run: python3 scripts/codex_actions_diagnosis.py replay

  publish:
    needs: [investigate, restore]
    if: always() && !cancelled() && ((needs.investigate.result == 'success' && needs.investigate.outputs.ready == 'true') || (needs.restore.result == 'success' && needs.restore.outputs.ready == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: needs.investigate.outputs.ready == 'true'
        with:
          name: codex-actions-diagnosis-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: output/codex-actions-diagnosis
      - uses: actions/download-artifact@v4
        if: needs.restore.outputs.ready == 'true'
        with:
          artifact-ids: ${{ needs.restore.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ needs.restore.outputs.source_run }}
          github-token: ${{ github.token }}
          path: output/codex-actions-diagnosis
      - name: Validate and publish solutions
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_REPORT: ${{ needs.restore.outputs.ready }}
        run: python3 scripts/codex_actions_diagnosis.py publish
