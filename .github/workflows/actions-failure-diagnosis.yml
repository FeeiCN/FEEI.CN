name: GitHub Actions 失败诊断

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 可选，指定失败运行编号；留空巡检全部 Actions 最近7天记录
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: actions-failure-diagnosis
  cancel-in-progress: false

jobs:
  investigate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify diagnosis and delivery
        run: python3 -m unittest discover -s scripts -p 'test_codex_actions_diagnosis.py'
      - name: Read all workflows and pending failed runs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
        run: python3 scripts/codex_actions_diagnosis.py prepare
      - name: Install Codex
        if: steps.prepare.outputs.ready == 'true'
        run: npm install --global @openai/codex
      - name: Verify read-only repository and research network
        if: steps.prepare.outputs.ready == 'true'
        env:
          AUTOMATION_PERMISSION_CONFIG: '{extends=":read-only", filesystem={":workspace_roots"={output="write"}}, network={enabled=true}}'
        run: python3 scripts/check_automation_permissions.py
      - name: Investigate failures with Codex
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 scripts/codex_actions_diagnosis.py execute
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.ready == 'true'
        with:
          name: codex-actions-diagnosis-${{ github.run_id }}
          path: |
            output/codex-actions-diagnosis/context.json
            output/codex-actions-diagnosis/result.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: investigate
    if: needs.investigate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: codex-actions-diagnosis-${{ github.run_id }}
          path: output/codex-actions-diagnosis
      - name: Validate and publish solutions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/codex_actions_diagnosis.py publish
