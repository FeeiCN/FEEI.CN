name: AI 编程与研发提效

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 4"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-ai-coding-rd-efficiency
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_AI_CODING_RD_EFFICIENCY == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: ai-coding-rd-efficiency
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/SKILL/AI编程与研发提效.md
      delivery: issue
    secrets: inherit
