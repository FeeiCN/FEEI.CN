name: AI 安全前沿研究流水线

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-ai-security-frontier-research
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_AI_SECURITY_FRONTIER_RESEARCH == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: ai-security-frontier-research
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/定时任务/AI 安全前沿研究任务提示词.md
      delivery: issue
    secrets: inherit
