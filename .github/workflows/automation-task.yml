name: 自动任务执行器

on:
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
      prompt_source:
        required: true
        type: string
      delivery:
        required: true
        type: string
      personal_date:
        required: false
        default: ''
        type: string
      personal_issue:
        required: false
        default: ''
        type: string

      review_issue:
        description: 原壁纸 Issue 编号（由议题驱动器传入）
        required: false
        default: ''
        type: string
      review_comment:
        description: 本人重做请求的评论 ID
        required: false
        default: ''
        type: string
      review_request_digest:
        description: 本人请求的校验摘要
        required: false
        default: ''
        type: string

    outputs:
      prompt_source:
        description: Task prompt document
        value: ${{ jobs.execute.outputs.prompt_source }}

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        working-directory: feei.cn
    outputs:
      prompt_source: ${{ inputs.prompt_source }}
    env:
      TASK_ID: ${{ inputs.task_id }}
      TASK_PROMPT_SOURCE: ${{ inputs.prompt_source }}
      TASK_DELIVERY: ${{ inputs.delivery }}
      PERSONAL_DATE: ${{ inputs.personal_date }}
      PERSONAL_ISSUE: ${{ inputs.personal_issue }}
      REVIEW_ISSUE: ${{ inputs.review_issue }}
      REVIEW_COMMENT: ${{ inputs.review_comment }}
      REVIEW_REQUEST_DIGEST: ${{ inputs.review_request_digest }}
      AUTOMATION_PERMISSION_CONFIG: '{extends=":read-only", filesystem={":workspace_roots"={output="write"}}, network={enabled=true}}'
    steps:
      - uses: actions/checkout@v4
        with:
          path: feei.cn
          ref: main
          persist-credentials: false
          fetch-depth: 100
      - name: 开始任务状态
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ inputs.task_id || github.job }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install task dependencies
        run: python -m pip install PyYAML Pillow
      - name: 检查当前调度时效
        id: freshness
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/automation_schedule.py
      - name: Install executor
        if: ${{ steps.freshness.outputs.expired != 'true' }}
        run: |
          python3 scripts/codex_runner.py install
          codex --version

      - name: Install wallpaper fonts
        if: ${{ inputs.task_id == 'update-weight-wallpaper' && steps.freshness.outputs.expired != 'true' }}
        timeout-minutes: 5
        run: |
          python -m pip install matplotlib
          font_dir="$HOME/.local/share/fonts"
          font_file="$font_dir/NotoSansCJKsc-Regular.otf"
          mkdir -p "$font_dir"
          curl --fail --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' \
            --output "$font_file"
          test "$(git hash-object "$font_file")" = 'dc15562470b4f842321894787a0d066879ccff8b'
          fc-cache --force "$font_dir"
      - name: Verify fixed wallpaper renderer
        if: ${{ inputs.task_id == 'update-weight-wallpaper' && steps.freshness.outputs.expired != 'true' }}
        run: python3 -m unittest discover -s scripts -p test_render_weight_wallpaper.py
      - name: Check documented task configuration
        if: ${{ steps.freshness.outputs.expired != 'true' }}
        run: |
          python3 scripts/automation_tasks.py check
          python3 -m unittest discover -s scripts -p test_run_automation_task.py
      - name: Verify research network and repository protection
        if: ${{ steps.freshness.outputs.expired != 'true' }}
        run: python3 scripts/check_automation_permissions.py
      - name: Read documented prompt and previous results
        if: steps.freshness.outputs.expired != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/automation_tasks.py prepare --task "$TASK_ID"
      - name: 更新阶段：执行任务
        if: ${{ steps.freshness.outputs.expired != 'true' }}
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: running
      - name: Execute task
        if: ${{ steps.freshness.outputs.expired != 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PWD" = "$GITHUB_WORKSPACE/feei.cn"
          test "$(git rev-parse --show-toplevel)" = "$PWD"
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_BASE_URL"
          test -n "$OPENAI_MODEL"
          python3 scripts/run_automation_task.py
          git diff --quiet || { echo '执行器修改了受保护的仓库文件'; exit 1; }
          python3 - <<'PY'
          import subprocess
          names = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')
          if any(name and not name.startswith('output/') for name in names):
              raise SystemExit('执行器在 output/ 外新增了文件')
          PY
          test -s output/result.json
      - name: 更新阶段：验证结果
        if: ${{ inputs.task_id == 'update-weight-wallpaper' && steps.freshness.outputs.expired != 'true' }}
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: verifying
      - name: Render wallpaper with fixed template
        if: ${{ inputs.task_id == 'update-weight-wallpaper' && steps.freshness.outputs.expired != 'true' }}
        run: python3 scripts/automation_tasks.py render-wallpaper --task "$TASK_ID"
      - name: 更新阶段：交付结果
        if: ${{ inputs.task_id != 'update-weight-wallpaper' && steps.freshness.outputs.expired != 'true' }}
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: delivering
      - name: Validate and deliver result
        if: ${{ inputs.task_id != 'update-weight-wallpaper' && steps.freshness.outputs.expired != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/automation_tasks.py deliver --task "$TASK_ID"
      - name: Save public research result
        if: ${{ always() && inputs.task_id != 'update-weight-wallpaper' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.task_id }}-${{ github.run_id }}
          path: |
            feei.cn/output/report.md
            feei.cn/output/metadata.json
            feei.cn/output/schedule-check.json
            feei.cn/output/reading-content.json
            feei.cn/output/writing/goal.json
            feei.cn/output/writing/brief.json
            feei.cn/output/writing/draft-0.json
            feei.cn/output/writing/draft-0.md
            feei.cn/output/writing/draft-1.json
            feei.cn/output/writing/draft-1.md
            feei.cn/output/writing/draft-2.json
            feei.cn/output/writing/draft-2.md
            feei.cn/output/writing/review-0.json
            feei.cn/output/writing/review-1.json
            feei.cn/output/writing/review-2.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Transfer wallpaper to publisher
        if: ${{ inputs.task_id == 'update-weight-wallpaper' && steps.freshness.outputs.expired != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-delivery-${{ github.run_id }}
          path: |
            feei.cn/output/result.json
            feei.cn/output/metadata.json
            feei.cn/output/wallpaper.png
            feei.cn/output/wallpaper.svg
          if-no-files-found: error
          retention-days: 1
      - name: Save Codex execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-execution-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-executions/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: 完成任务状态
        if: always() && hashFiles('feei.cn/.github/actions/workflow-status/action.yml') != ''
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status == 'success' && steps.freshness.outputs.expired == 'true' && 'skipped' || job.status }}
          task: ${{ inputs.task_id || github.job }}
          result-file: feei.cn/output/metadata.json
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30
