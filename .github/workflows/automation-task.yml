name: 自动任务执行器

on:
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
      prompt_source:
        required: true
        type: string
      delivery:
        required: true
        type: string

      review_issue:
        description: 原壁纸 Issue 编号（由议题驱动器传入）
        required: false
        default: ''
        type: string
      review_comment:
        description: 本人重做请求的评论 ID
        required: false
        default: ''
        type: string
      review_request_digest:
        description: 本人请求的校验摘要
        required: false
        default: ''
        type: string

    outputs:
      prompt_source:
        description: Task prompt document
        value: ${{ jobs.execute.outputs.prompt_source }}

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: feei.cn
    outputs:
      prompt_source: ${{ inputs.prompt_source }}
    env:
      TASK_ID: ${{ inputs.task_id }}
      TASK_PROMPT_SOURCE: ${{ inputs.prompt_source }}
      TASK_DELIVERY: ${{ inputs.delivery }}
      REVIEW_ISSUE: ${{ inputs.review_issue }}
      REVIEW_COMMENT: ${{ inputs.review_comment }}
      REVIEW_REQUEST_DIGEST: ${{ inputs.review_request_digest }}
      AUTOMATION_PERMISSION_CONFIG: '{extends=":read-only", filesystem={":workspace_roots"={output="write"}}, network={enabled=true}}'
    steps:
      - uses: actions/checkout@v4
        with:
          path: feei.cn
          persist-credentials: false
          fetch-depth: 100
      - uses: actions/setup-node@v4
        if: ${{ inputs.task_id != 'diary-prompt-sync' }}
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install task dependencies
        run: python -m pip install PyYAML Pillow
      - name: Install executor
        if: ${{ inputs.task_id != 'diary-prompt-sync' }}
        run: |
          npm install --global @openai/codex
          codex --version

      - name: Install wallpaper fonts
        if: ${{ inputs.task_id == 'update-weight-wallpaper' }}
        timeout-minutes: 5
        run: |
          python -m pip install matplotlib
          font_dir="$HOME/.local/share/fonts"
          font_file="$font_dir/NotoSansCJKsc-Regular.otf"
          mkdir -p "$font_dir"
          curl --fail --location --retry 2 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' \
            --output "$font_file"
          test "$(git hash-object "$font_file")" = 'dc15562470b4f842321894787a0d066879ccff8b'
          fc-cache --force "$font_dir"
      - name: Check documented task configuration
        if: ${{ inputs.task_id != 'diary-prompt-sync' }}
        run: python3 scripts/automation_tasks.py check
      - name: Verify research network and repository protection
        if: ${{ inputs.task_id != 'diary-prompt-sync' }}
        run: python3 scripts/check_automation_permissions.py
      - name: Read documented prompt and previous results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/automation_tasks.py prepare --task "$TASK_ID"
      - name: Verify prompt synchronization without a model
        if: ${{ inputs.task_id == 'diary-prompt-sync' }}
        run: python3 scripts/automation_tasks.py verify-sync --task "$TASK_ID"
      - name: Execute task
        if: ${{ inputs.task_id != 'diary-prompt-sync' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PWD" = "$GITHUB_WORKSPACE/feei.cn"
          test "$(git rev-parse --show-toplevel)" = "$PWD"
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_BASE_URL"
          test -n "$OPENAI_MODEL"
          set +e
          codex exec --cd "$GITHUB_WORKSPACE/feei.cn" --ephemeral \
            --config 'default_permissions="automation"' \
            --config "permissions.automation=$AUTOMATION_PERMISSION_CONFIG" \
            --model "$OPENAI_MODEL" \
            --config 'model_provider="custom"' \
            --config 'model_providers.custom.name="AI Proxy"' \
            --config "model_providers.custom.base_url=\"${OPENAI_BASE_URL%/}\"" \
            --config 'model_providers.custom.wire_api="responses"' \
            --config 'model_providers.custom.env_key="OPENAI_API_KEY"' \
            --config 'model_reasoning_effort="high"' \
            --config 'web_search="live"' \
            --config 'shell_environment_policy.exclude=["OPENAI_*","GH_*","GITHUB_*","ACTIONS_*","AUTOMATION_*"]' \
            --output-schema output/schema.json \
            --output-last-message output/result.json \
            - < output/prompt.md > "$RUNNER_TEMP/automation.log" 2> "$RUNNER_TEMP/automation.err"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Codex 执行失败，退出码 $status"
            if [[ ! "$TASK_ID" =~ ^(personal-health-trend-research|update-weight-wallpaper|daily-personal-record)$ ]]; then
              tail -c 2500 "$RUNNER_TEMP/automation.err"
            fi
            exit "$status"
          fi
          git diff --quiet || { echo '执行器修改了受保护的仓库文件'; exit 1; }
          python3 - <<'PY'
          import subprocess
          names = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')
          if any(name and not name.startswith('output/') for name in names):
              raise SystemExit('执行器在 output/ 外新增了文件')
          PY
          test -s output/result.json
      - name: Render wallpaper with fixed template
        if: ${{ inputs.task_id == 'update-weight-wallpaper' }}
        run: python3 scripts/automation_tasks.py render-wallpaper --task "$TASK_ID"
      - name: Validate and deliver result
        if: ${{ inputs.task_id != 'update-weight-wallpaper' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/automation_tasks.py deliver --task "$TASK_ID"
      - name: Save public research result
        if: ${{ always() && inputs.task_id != 'update-weight-wallpaper' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.task_id }}-${{ github.run_id }}
          path: |
            feei.cn/output/report.md
            feei.cn/output/metadata.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Transfer wallpaper to publisher
        if: ${{ inputs.task_id == 'update-weight-wallpaper' }}
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-delivery-${{ github.run_id }}
          path: |
            feei.cn/output/result.json
            feei.cn/output/metadata.json
            feei.cn/output/wallpaper.png
            feei.cn/output/wallpaper.svg
          if-no-files-found: error
          retention-days: 1
