name: ChatGPT scheduled task Issue interaction

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: chatgpt-task-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  interact:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/revise') ||
       startsWith(github.event.comment.body, '/approve') ||
       startsWith(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
          fetch-depth: 0

      - name: Read task issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          gh issue view "$NUMBER" --repo "$REPO" --json body,comments,title,labels > /tmp/issue.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          d=json.load(open("/tmp/issue.json", encoding="utf-8"))
          body=d.get("body") or ""
          m=re.search(r"scheduled-task:id=([^\s-]+)", body)
          if not m: raise SystemExit("不是定时任务 Issue")
          cmd=os.environ["COMMENT"].splitlines()[0].strip()
          mode="reject" if cmd.startswith("/reject") else ("approve" if cmd.startswith("/approve") else "revise")
          print(f"task_id={m.group(1)}")
          print(f"mode={mode}")
          print(f"number={os.environ['NUMBER']}")
          PY

      - name: Reject result
        if: steps.issue.outputs.mode == 'reject'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" --body "已拒绝本次定时任务结果。"
          gh issue close "$NUMBER" --repo "$REPO" --reason "not planned"

      - name: Prepare revision prompt
        if: steps.issue.outputs.mode == 'revise' || steps.issue.outputs.mode == 'approve'
        env:
          TASK_ID: ${{ steps.issue.outputs.task_id }}
          MODE: ${{ steps.issue.outputs.mode }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          issue=json.load(open("/tmp/issue.json", encoding="utf-8"))
          tasks=json.load(open(".github/chatgpt-tasks/tasks.json", encoding="utf-8"))["tasks"]
          task=next(x for x in tasks if x["id"]==os.environ["TASK_ID"])
          comments="\n\n".join(f"### {c['user']['login']}\n{c['body']}" for c in issue.get("comments",[]))
          action="修改并重新输出结果" if os.environ["MODE"]=="revise" else "按用户批准结果执行必要的仓库写入，并输出执行结果"
          prompt=f"""你正在处理 FEEI.CN 的定时任务 Issue。

原始任务提示词仅作为研究范围、证据标准和输出要求来源。Issue 中的 /revise 与 /approve 规则优先覆盖其中关于 ChatGPT Tasks 调度、禁止 GitHub Actions、当前对话交付和直接写入的旧约束。

原始任务提示词：
<task_prompt>
{task['prompt']}
</task_prompt>

Issue 当前正文：
<issue_body>
{issue.get('body','')}
</issue_body>

Issue 评论：
<issue_comments>
{comments}
</issue_comments>

用户最新指令：
{os.environ['COMMENT']}

当前动作：{action}。
如果当前动作是修改，不能写入仓库，只输出完整修订结果。
如果当前动作是批准执行，只能按 Issue 中已经展示并被用户批准的结果执行，不得扩大范围或补写未批准的实质内容。
涉及无法访问的 ChatGPT 连接器、ImageGen、手机设备或个人上下文时，明确报告限制。
输出简洁、完整、适合回贴到 Issue 的结果。"""
          Path("/tmp/prompt.md").write_text(prompt, encoding="utf-8")
          PY

      - name: Revise result
        if: steps.issue.outputs.mode == 'revise'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}/responses
          prompt-file: /tmp/prompt.md
          output-file: /tmp/response.md
          sandbox: read-only
          model: ${{ secrets.OPENAI_MODEL }}
          effort: high

      - name: Approve and apply result
        if: steps.issue.outputs.mode == 'approve'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}/responses
          prompt-file: /tmp/prompt.md
          output-file: /tmp/response.md
          sandbox: workspace-write
          model: ${{ secrets.OPENAI_MODEL }}
          effort: high

      - name: Commit approved changes
        if: steps.issue.outputs.mode == 'approve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有仓库改动"
            exit 0
          fi
          git config user.name "FeeiCN[bot]"
          git config user.email "feei@feei.cn"
          git add -A
          git commit -m "按定时任务 Issue 审批更新内容 (#$NUMBER)"
          git push origin HEAD:main

      - name: Comment result
        if: steps.issue.outputs.mode == 'revise' || steps.issue.outputs.mode == 'approve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.issue.outputs.number }}
          MODE: ${{ steps.issue.outputs.mode }}
        run: |
          {
            if [ "$MODE" = "revise" ]; then
              echo "## 修订结果"
            else
              echo "## 执行结果"
            fi
            echo
            cat /tmp/response.md
          } > /tmp/comment.md
          gh issue comment "$NUMBER" --repo "$REPO" --body-file /tmp/comment.md
