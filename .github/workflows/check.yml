name: 网站严格检查

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # 北京时间 10:40，避开凌晨自动数据提交和 GitHub 整点拥堵。
    - cron: '40 2 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 开始任务状态
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: AI navigation and migration check
        env:
          AI_MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$AI_MIGRATION_BASE" ]; then
            # Scheduled/manual checks validate the current tree only. Comparing
            # origin/main with itself makes ordinary content edits look like
            # migration changes and incorrectly enforces historical snapshots.
            unset AI_MIGRATION_BASE
          else
            export AI_MIGRATION_BASE
          fi
          node scripts/test_ai_navigation.mjs

      - name: Install dependencies
        run: npm ci

      - name: Changed document check
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$DOCS_BASE" ]; then
            DOCS_BASE="$(git rev-parse origin/main)"
          fi
          npm run check:docs -- --base="$DOCS_BASE"

      - name: Verify shared workflow status
        run: node --test scripts/test_workflow_status.mjs
      - name: 更新阶段：验证结果
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: verifying
      - name: Type check
        run: npm run typecheck

      - name: Strict build check
        run: DOCUSAURUS_FASTER=true CI_STRICT=true npm run build
      - name: 完成任务状态
        if: always() && hashFiles('.github/actions/workflow-status/action.yml') != ''
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30
