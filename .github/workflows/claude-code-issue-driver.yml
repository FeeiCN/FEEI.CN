name: Claude Code issue driver

# 把 owner 的 GitHub issue 当作 Claude Code 的异步任务入口。
# 触发:issue/issue_comment 任一变化(由 owner 发起);或 workflow_dispatch 手动。
# 两段式:plan → 等 owner /approve → execute → 开 PR。
# 状态用 label(claude:planning/plan-ready/executing/done/failed/paused)。
# Marker 仅作评论定位 + 元信息,不参与状态判定。

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '指定 issue 编号'
        required: true
      dry_run:
        description: '只 decide,不调 claude'
        required: false
        default: 'false'

concurrency:
  group: claude-driver-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
  # 不再 cancel-in-progress:旧 run 自然结束。否则 owner 在 /plan 跑出后再发 /replan,
  # 旧 run 被中途杀,claude step 走 cancelled → 残留 claude:planning 锁,issue 卡死。
  # 现在 cleanup step 已覆盖 failure + cancelled,保留旧 run 让其贴出 plan 后再退出即可。

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 三道安全门:
    # 1. manual 路径直通
    # 2. event 路径必须 sender == owner(挡 bot + 外部协作者)
    # 3. issue_comment 不能是 PR 评论(GH 把 PR 当 issue,容易误触)
    # 4. issue_comment 不能是带 marker 的评论(防 driver 自递归)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.sender.login == github.repository_owner
        && (github.event_name != 'issue_comment' || !github.event.issue.pull_request)
        && (github.event_name != 'issue_comment' || !startsWith(github.event.comment.body, '<!-- claude-driver:'))
      )

    steps:
      # ─────────────────────────────────────
      # 1. 解析 issue 编号 + 决策 mode
      # ─────────────────────────────────────
      - name: Decide mode
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          MANUAL_ISSUE: ${{ github.event.inputs.issue_number }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys

          REPO, OWNER = os.environ["REPO"], os.environ["OWNER"]
          n = os.environ.get("EVENT_ISSUE") or os.environ.get("MANUAL_ISSUE")
          reason = ""
          if not n:
              reason = "no issue number in event"
              print("mode=skip"); print("number="); print(f"reason={reason}"); sys.exit(0)

          j = subprocess.check_output(
              ["gh","issue","view",n,"--repo",REPO,
               "--json","body,comments,labels,author,state,title"],
              text=True)
          with open("/tmp/issue.json", "w", encoding="utf-8") as f:
              f.write(j)
          d = json.loads(j)
          author_login = d["author"]["login"]

          if author_login != OWNER or d["state"] != "OPEN":
              if author_login != OWNER:
                  reason = f"issue author is not owner (author={author_login}, owner={OWNER}); /plan 等命令已被忽略"
              else:
                  reason = f"issue state is {d['state']}, not OPEN; /plan 等命令已被忽略"
              print("mode=skip"); print(f"number={n}"); print(f"reason={reason}")
              print(f"author={author_login}"); print(f"state={d['state']}")
              sys.exit(0)

          labels = {l["name"] for l in d["labels"]}
          # planning / executing / paused 锁住 driver(防并发覆盖);done / failed 不挡,
          # owner 可在已完成的 issue 上评论 /plan 重新激活(走"非 plan-ready"分支)。
          locked = labels & {"claude:paused","claude:executing","claude:planning"}
          if locked:
              reason = f"driver locked by label(s): {', '.join(sorted(locked))}; 请等待上次 /approve 流程结束"
              print("mode=skip"); print(f"number={n}"); print(f"reason={reason}")
              print(f"author={author_login}"); print(f"state={d['state']}")
              sys.exit(0)

          comments = d["comments"]
          last_claude = max(
              (c for c in comments if c["body"].startswith("<!-- claude-driver:")),
              key=lambda c: c["createdAt"], default=None)
          last_owner = max(
              (c for c in comments
               if c["author"]["login"] == OWNER
               and not c["body"].startswith("<!-- claude-driver:")),
              key=lambda c: c["createdAt"], default=None)

          def has(body, tok):
              # 认两种格式:`/plan`(独立一行) 或 `/plan 描述...`(行首 + 空格 + 描述)
              return any(
                  line.strip() == tok or line.strip().startswith(tok + ' ')
                  for line in body.splitlines()
              )

          # 命令驱动:仅当 owner 最新评论或 issue 标题含 /plan / /replan / /approve / /reject
          # 独立一行时 driver 才响应,其他情况(普通评论、issue 重开)一律 skip。
          mode = "skip"
          if not last_owner \
             and not has(d["title"], "/plan") \
             and not has(d["title"], "/approve") \
             and not has(d["title"], "/replan") \
             and not has(d["title"], "/reject"):
              reason = "no owner comment with /plan|/approve|/replan|/reject and title has no command"
          elif "claude:plan-ready" in labels:
              if not last_claude or (last_owner and last_owner["createdAt"] > last_claude["createdAt"]):
                  combined = ((last_owner["body"] if last_owner else "") + "\n" + d["title"])
                  if has(combined, "/reject"):
                      mode = "paused"
                  elif has(combined, "/replan"):
                      mode = "plan"
                  elif has(combined, "/approve"):
                      mode = "execute"
                  # /plan 在 plan-ready 状态下被忽略(已经 plan 过了,要先 /replan)
          else:
              if not last_claude or (last_owner and last_owner["createdAt"] > last_claude["createdAt"]):
                  combined = ((last_owner["body"] if last_owner else "") + "\n" + d["title"])
                  if has(combined, "/reject"):
                      mode = "paused"
                  elif has(combined, "/plan"):
                      mode = "plan"
                  # /approve / /replan 在非 plan-ready 状态被忽略(尚未 plan)

          print(f"mode={mode}")
          print(f"number={n}")
          print(f"author={author_login}")
          print(f"state={d['state']}")
          if reason:
              print(f"reason={reason}")
          print("issue-json-path=/tmp/issue.json")
          # 调试信息打到 stderr(stdout 被重定向到 $GITHUB_OUTPUT)
          print(f"[decide] issue=#{n} mode={mode} author={author_login} state={d['state']} "
                f"labels={sorted(labels)} reason={reason or '-'} "
                f"last_owner={last_owner['createdAt'] if last_owner else None} "
                f"last_claude={last_claude['createdAt'] if last_claude else None} "
                f"body_empty={not d['body'].strip()} comments={len(comments)} "
                f"title_has_plan={has(d['title'], '/plan')} title_has_approve={has(d['title'], '/approve')} "
                f"title_has_replan={has(d['title'], '/replan')} title_has_reject={has(d['title'], '/reject')}",
                file=sys.stderr)
          PY

      - name: Post skip diagnostic
        if: steps.decide.outputs.mode == 'skip' && steps.decide.outputs.reason != '' && steps.decide.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.decide.outputs.number }}
          AUTHOR: ${{ steps.decide.outputs.author }}
          STATE: ${{ steps.decide.outputs.state }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          # 1) step summary:mode=skip 且 reason 非空时,让 owner 一眼看到 decide 结果
          {
            echo "### Decide mode"
            echo
            echo '| field | value |'
            echo '| --- | --- |'
            echo "| issue | #${N} |"
            echo "| mode | \`skip\` |"
            echo "| author | \`${AUTHOR}\` |"
            echo "| state | \`${STATE}\` |"
            echo "| reason | ${REASON} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # 2) 仅在「明显是 owner 主动 /plan 但被外部因素拦截」时落评论,避免噪音
          # 触发条件:non-owner author / 非 OPEN 状态 / 锁定 label 残留
          case "${REASON}" in
            *"author is not owner"*|*"state is"*|*"driver locked by"*)
              {
                echo "<!-- claude-driver:diagnostic:skip -->"
                echo
                echo "## Claude Code driver 跳过了此次 \`/plan\`"
                echo
                echo "- issue: #${N}"
                echo "- author: \`${AUTHOR}\`"
                echo "- state: \`${STATE}\`"
                echo
                echo "**原因**: ${REASON}"
                echo
                echo "如需重新触发:"
                echo
                echo "- 若 issue 非 owner 创建,改在 owner 自建的 issue 上发 \`/plan\`"
                echo "- 若 issue 已关闭,重新打开后重发"
                echo "- 若 driver 被锁(\`claude:executing\` 等),等待上一次 \`/approve\` 流程结束后再发"
                echo
                echo "<!-- 本条评论由 driver 自动生成,无 Claude 调用 -->"
              } > /tmp/diag.md
              gh issue comment "$N" --repo "$REPO" --body-file /tmp/diag.md 2>/dev/null || true
              ;;
          esac

      - name: Ensure labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # driver 用到 6 个 claude:* label,仓库里可能一个都没有;
          # 已存在会报 "already exists",吞掉即可,保证后续 add 不会因 label 不存在失败。
          declare -A L=(
            [claude:planning]="fbc108"
            [claude:plan-ready]="0e8a16"
            [claude:executing]="fbca04"
            [claude:done]="0e8a16"
            [claude:failed]="d93f0b"
            [claude:paused]="cccccc"
          )
          for name in "${!L[@]}"; do
            gh label create "$name" --repo "$REPO" --color "${L[$name]}" \
              --description "Claude Code driver state" 2>/dev/null || true
          done

      - name: Apply paused label
        if: steps.decide.outputs.mode == 'paused'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.decide.outputs.number }}
        run: |
          for s in planning plan-ready executing done failed; do
            gh issue edit "$N" --repo "$REPO" --remove-label "claude:$s" 2>/dev/null || true
          done
          gh issue edit "$N" --repo "$REPO" --add-label claude:paused

      - name: Apply state label
        if: steps.decide.outputs.mode == 'plan' || steps.decide.outputs.mode == 'execute'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.decide.outputs.number }}
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          # 视觉信号:Claude 进入 plan 阶段立刻上 planning label(失败也方便定位);
          # execute 阶段实际上由 claude step 内部 add claude:executing(因为要等切分支),
          # 这里只对 plan 模式加 planning,execute 模式不做事。
          for s in planning plan-ready executing done failed; do
            gh issue edit "$N" --repo "$REPO" --remove-label "claude:$s" 2>/dev/null || true
          done
          if [ "$MODE" = "plan" ]; then
            gh issue edit "$N" --repo "$REPO" --add-label claude:planning 2>/dev/null || true
          fi

      # ─────────────────────────────────────
      # 2. 凭证 + setup(仅 plan/execute)
      # ─────────────────────────────────────
      - name: Check credentials
        id: creds
        if: steps.decide.outputs.mode == 'plan' || steps.decide.outputs.mode == 'execute'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          if [ -z "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "skip=no_credentials" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_AUTH_TOKEN 未配置,跳过 claude 执行"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.skip == 'no' && github.event.inputs.dry_run != 'true'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
          fetch-depth: 0

      - name: Setup Node
        if: steps.creds.outputs.skip == 'no' && github.event.inputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Cache global npm modules
        if: steps.creds.outputs.skip == 'no' && github.event.inputs.dry_run != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            $(npm root -g)
          # 不再把 workflow 文件 hash 进 key:workflow 改一次就 cold cache,3 次 /replan
          # 全付重装代价。npm 包本身不依赖 workflow 变化。
          key: claude-cli-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            claude-cli-${{ hashFiles('package-lock.json') }}-
            claude-cli-

      - name: Install dependencies
        if: steps.creds.outputs.skip == 'no' && github.event.inputs.dry_run != 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          npm ci

      # ─────────────────────────────────────
      # 3. 构造 prompt + 跑 Claude
      # ─────────────────────────────────────
      - name: Build prompt and run Claude
        id: claude
        if: (steps.decide.outputs.mode == 'plan' || steps.decide.outputs.mode == 'execute') && steps.creds.outputs.skip == 'no' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          N: ${{ steps.decide.outputs.number }}
          MODE: ${{ steps.decide.outputs.mode }}
          ISSUE_JSON: ${{ steps.decide.outputs.issue-json-path }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          BASE_SHA="$(git rev-parse origin/main)"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          # execute: 同步 main + 上 executing label 锁(不再切 agent/issue-N 分支)
          if [ "$MODE" = "execute" ]; then
            git fetch origin main
            git reset --hard origin/main
            git config user.name  "FeeiCN[bot]"
            git config user.email "feei@feei.cn"
            for s in planning plan-ready done failed; do
              gh issue edit "$N" --repo "$REPO" --remove-label "claude:$s" 2>/dev/null || true
            done
            gh issue edit "$N" --repo "$REPO" --add-label claude:executing
          fi

          # 构造 prompt
          python3 <<'PY' > /tmp/prompt.md
          import json, os, subprocess, pathlib, re

          N, REPO, MODE = os.environ["N"], os.environ["REPO"], os.environ["MODE"]
          d = json.loads(pathlib.Path(os.environ["ISSUE_JSON"]).read_text(encoding="utf-8"))

          # 完整读 CLAUDE.md:之前的 [:4000] 截断会让 plan 阶段看不到
          # "内容写作规范""PR 规范""GitHub Issue 处理流程"等后半段规则,
          # 导致 plan 阶段 Claude 拿到的工程规范残缺。当前 7KB,完整进 prompt 完全够。
          claude_md = pathlib.Path("CLAUDE.md").read_text(encoding="utf-8")
          recent = d["comments"][-20:]

          if MODE == "plan":
              role = (
                  f"你正在分析 GitHub issue #{N}。\n\n"
                  f"你的任务是根据:\n"
                  f"- Issue 正文与最近评论\n"
                  f"- CLAUDE.md\n"
                  f"- 必要时查看少量文件或检索互联网资料\n\n"
                  f"生成实施计划。\n\n"
                  f"完成后立即输出计划,禁止继续探索。\n\n"
                  f"计划应包括:\n"
                  f"1. 需求理解\n"
                  f"2. 影响的文件路径(明确列 `docs/.../*.md` 形式)\n"
                  f"3. 实施步骤\n"
                  f"4. 风险等级 (Low / Medium / High)\n"
                  f"5. 验证方式\n\n"
                  f"硬约束:\n"
                  f"- 工具调用总次数不超过 11 次(Read / Grep / Glob / WebFetch / WebSearch / 限定 Bash 合计)。\n"
                  f"- 优先复用 CLAUDE.md 中已有的目录结构与命名约定,不要再发起额外的探索性调用。\n"
                  f"- 一旦计划在内心完整,立即输出,不要再追加「进一步分析」类调用。\n\n"
                  f"## Plan metadata(必填,driver 会校验,缺则拒绝贴评论)\n"
                  f"计划末尾必须包含下面这一段,字段齐全,绝对路径,不要省略:\n"
                  f"\n"
                  f"```\n"
                  f"## Plan metadata\n"
                  f"- affected_files: [<绝对路径1>, <绝对路径2>, ...]\n"
                  f"- risk: Low|Medium|High\n"
                  f"- verification: [<可执行命令1>, <可执行命令2>, ...]\n"
                  f"```\n"
                  f"\n"
                  f"字段语义:\n"
                  f"- affected_files:实施本计划预计要新增/修改/删除的文件列表(只列路径,不要解释)。\n"
                  f"- risk:依据 CLAUDE.md 的「构建检查」「破坏面」「新依赖」综合判断。\n"
                  f"- verification:owner 验收时应该跑的命令,例如 `npm run build` / `npm run typecheck` / `git diff --stat` / 具体的 grep/cat 验证。\n"
                  f"\n"
                  f"最终回复就是计划本身的 Markdown,不要寒暄。"
              )
          else:
              plan = next(
                  (c for c in reversed(d["comments"])
                   if c["body"].startswith("<!-- claude-driver:plan:")),
                  {"body":"(未找到 plan 评论)"})
              m = re.search(r"commit=([a-f0-9]+)", plan["body"])
              plan_commit = m.group(1) if m else "(unknown)"
              current = subprocess.check_output(
                  ["git","rev-parse","origin/main"], text=True).strip()
              role = (
                  f"你正在执行 GitHub issue #{N} 的已批准计划。\n\n"
                  f"## 重要事实\n"
                  f"- plan 评论生成时 main = `{plan_commit}`\n"
                  f"- 当前 main = `{current}`\n"
                  f"如果这两个 SHA 不同,**先检查 plan 中提到的文件是否仍存在或语义未变**。"
                  f"任何关键文件已被改写,**立即 abort 并在回复里说明 plan 已过期,请用户 /replan**。\n\n"
                  f"## 执行约束\n"
                  f"- 只允许 Read / Write / Edit,以及只读 Bash(git status/diff/log,ls,find,cat,grep,python3,node,npm,npx)\n"
                  f"- **禁止** git push / git commit / git checkout / gh 任意命令 — workflow 统一负责\n"
                  f"  - **不要 git commit**:commit 由 build step 统一做(commit message 风格由\n"
                  f"    driver 控制,例如 \"Agent: #N — <title>\")。你只管改文件,保持 dirty 状态\n"
                  f"    即可。build step 会校验 `git log origin/main..HEAD` 只能有 1 个 commit,\n"
                  f"    多个会触发 warn。**不要 git add**,build step 会做 `git add -A`。\n"
                  f"- 完成后回复一段 Markdown 总结:变更摘要 / 涉及文件 / 验证情况(只读类检查:grep/cat/git diff)\n"
                  f"\n"
                  f"执行时最多读取必要文件。不要做开放式探索。\n"
                  f"如果计划足够明确,直接修改文件。\n"
                  f"修改完成后立刻输出总结,不要继续检查无关文件。\n"
                  f"最多使用 60 次工具调用;接近限制时必须停止并输出当前结果。\n"
                  f"\n"
                  f"## 已批准的计划\n\n{plan['body']}"
              )

          if recent:
              comments_block = "\n\n".join(
                  f"### {c['author']['login']} @ {c['createdAt']}\n{c['body']}"
                  for c in recent
              )
          else:
              comments_block = "(无)"

          print(
              f"# 仓库背景(CLAUDE.md 摘要)\n\n"
              f"{claude_md}\n\n"
              f"# Issue 信息\n\n"
              f"标题: {d['title']}\n\n"
              f"## Issue 正文\n\n"
              f"{d['body']}\n\n"
              f"## 最近 {len(recent)} 条评论\n\n"
              f"{comments_block}\n\n"
              f"# 你的任务\n\n"
              f"{role}\n"
          )
          PY

          # 跑 Claude
          # --permission-mode 拆 mode:
          #   - plan:Claude Code 内置只读模式(禁止 Write/Edit/Bash 写类),plan
          #     阶段用这个,工具级别硬阻断改文件
          #   - bypassPermissions:完全信任模式(允许一切),execute 阶段用,
          #     靠 prompt 硬约束('不要 git commit') + driver step 边界
          #     (commit/push 在 build step 统一做)
          COMMON=( -p --output-format json )
          if [ "$MODE" = "plan" ]; then
            EXTRA=(
              --permission-mode plan
              --max-turns 200
              --max-budget-usd 20
            )
          else
            EXTRA=(
              --permission-mode bypassPermissions
              --max-turns 200
              --max-budget-usd 20
            )
          fi

          set +e
          claude "${COMMON[@]}" "${EXTRA[@]}" < /tmp/prompt.md \
            > /tmp/claude.json 2> /tmp/claude.err
          CLAUDE_STATUS=$?
          set -e

          # 诊断:inline 日志 + step summary 都写,任何页面都能看到
          {
            echo "### claude stderr 前 2000 字符"
            echo '```'
            head -c 2000 /tmp/claude.err || true
            echo
            echo '```'
            echo "### claude.json 顶层字段"
            echo '```'
            jq -r 'keys_unsorted | join(", ")' /tmp/claude.json 2>/dev/null || echo "(jq failed)"
            echo
            echo '```'
            echo "### claude.json 摘要 前 1500 字符"
            echo '```'
            head -c 1500 /tmp/claude.json || true
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          jq -r '.result // .message // ""' /tmp/claude.json > /tmp/result.txt

          RESULT_NONEMPTY="$(python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/result.txt").read_text(encoding="utf-8", errors="replace")
          print("yes" if text.strip() else "no")
          PY
          )"

          echo "cost=$(jq -r '.total_cost_usd // 0' /tmp/claude.json)" >> "$GITHUB_OUTPUT"
          echo "turns=$(jq -r '.num_turns // 0' /tmp/claude.json)" >> "$GITHUB_OUTPUT"
          echo "result_len=$(wc -c < /tmp/result.txt)" >> "$GITHUB_OUTPUT"

          if [ "$CLAUDE_STATUS" -ne 0 ] || [ "$RESULT_NONEMPTY" != "yes" ]; then
            echo "::group::Claude diagnostics"
            echo "claude_status=$CLAUDE_STATUS"
            jq -r '{
              type,
              subtype,
              is_error,
              total_cost_usd,
              num_turns,
              result_len: ((.result // .message // "") | length)
            }' /tmp/claude.json 2>/dev/null || true
            echo "--- stderr ---"
            head -c 4000 /tmp/claude.err || true
            echo
            echo "--- json head ---"
            head -c 4000 /tmp/claude.json || true
            echo
            echo "::endgroup::"
            {
              echo "## Claude 执行失败"
              echo
              echo "- status: $CLAUDE_STATUS"
              echo "- subtype: $(jq -r '.subtype // "unknown"' /tmp/claude.json)"
              echo "- terminal_reason: $(jq -r '.terminal_reason // "unknown"' /tmp/claude.json)"
              echo "- stop_reason: $(jq -r '.stop_reason // "unknown"' /tmp/claude.json)"
              echo "- turns: $(jq -r '.num_turns // 0' /tmp/claude.json)"
              echo "- cost: \$$(jq -r '.total_cost_usd // 0' /tmp/claude.json)"
              echo
              echo "请提高 max-turns,或收窄 issue 范围后重新执行。"
            } > /tmp/result.txt
            echo "Claude 无有效输出"
            exit 1
          fi

      # ─────────────────────────────────────
      # 4. 失败时清锁:plan 阶段 claude 失败(execute 阶段由 Post execute result 负责)
      # 不清就会把 issue 永久锁在 claude:planning / claude:executing,后续指令全部被
      # Decide mode 的 `locked` 拦截。覆盖 plan-only 失败 + plan/execute 都失败两种情况。
      # ─────────────────────────────────────
      - name: Cleanup stuck lock on plan failure
        if: steps.claude.outcome == 'failure' && steps.decide.outputs.mode == 'plan'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.decide.outputs.number }}
        run: |
          for s in planning plan-ready executing done paused; do
            gh issue edit "$N" --repo "$REPO" --remove-label "claude:$s" 2>/dev/null || true
          done
          gh issue edit "$N" --repo "$REPO" --add-label claude:failed 2>/dev/null || true

      # ─────────────────────────────────────
      # 4. plan 分支:post + label
      # ─────────────────────────────────────
      - name: Post plan comment
        id: post_plan
        if: steps.decide.outputs.mode == 'plan' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.decide.outputs.number }}
          BASE: ${{ steps.claude.outputs.base_sha }}
          COST: ${{ steps.claude.outputs.cost }}
          TURNS: ${{ steps.claude.outputs.turns }}
        run: |
          # Schema 校验:必须含 ## Plan metadata 段,且三个字段齐全。
          # 缺则视为"plan 不完整"——清锁、标 failed、贴 reject 评论、exit 1。
          # 防止 owner 被敷衍的 plan 误导(issue #187 实测:plan v1/v2 都有"装完整"
          # 但被 owner 打回。schema 至少强制"形式完整",把敷衍挡在门外)。
          python3 - <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("/tmp/result.txt").read_text(encoding="utf-8", errors="replace")
          if "## Plan metadata" not in text:
              print("REJECT reason=missing_metadata_section")
              sys.exit(10)
          m = re.search(r"^## Plan metadata\s*$(.*?)(?=\n##|\Z)", text, re.MULTILINE | re.DOTALL)
          if not m:
              print("REJECT reason=metadata_section_unparseable")
              sys.exit(11)
          body = m.group(1)
          for field in ("affected_files", "risk", "verification"):
              if not re.search(rf"^- {re.escape(field)}:", body, re.MULTILINE):
                  print(f"REJECT reason=missing_field:{field}")
                  sys.exit(12)
          if not re.search(r"^- risk:\s*(Low|Medium|High)\s*$", body, re.MULTILINE):
              print("REJECT reason=risk_value_invalid")
              sys.exit(13)
          if not re.search(r"^- affected_files:\s*\[.+\]\s*$", body, re.MULTILINE):
              print("REJECT reason=affected_files_not_list")
              sys.exit(14)
          if not re.search(r"^- verification:\s*\[.+\]\s*$", body, re.MULTILINE):
              print("REJECT reason=verification_not_list")
              sys.exit(15)
          print("SCHEMA_OK")
          PY
          SCHEMA_STATUS=$?
          if [ "$SCHEMA_STATUS" -ne 0 ]; then
            REJECT_REASON="$(python3 -c "import sys; print('rejected by schema validator (exit=)')" 2>/dev/null || true)"
            echo "::error::plan schema 校验失败,exit=$SCHEMA_STATUS"
            for s in planning plan-ready executing done paused; do
              gh issue edit "$N" --repo "$REPO" --remove-label "claude:$s" 2>/dev/null || true
            done
            gh issue edit "$N" --repo "$REPO" --add-label claude:failed 2>/dev/null || true
            {
              echo "<!-- claude-driver:plan-rejected -->"
              echo
              echo "## plan 被 driver 拒绝"
              echo
              echo "原因:Claude 输出的 plan 缺少 \`## Plan metadata\` 结构化段,无法校验完整性。"
              echo
              echo "请重新发 \`/plan\` 让 Claude 重出。注意末尾必须含:"
              echo
              echo '```'
              echo "## Plan metadata"
              echo "- affected_files: [/abs/path1, /abs/path2]"
              echo "- risk: Low|Medium|High"
              echo "- verification: [\"npm run build\", \"git diff --stat\"]"
              echo '```'
            } > /tmp/reject.md
            gh issue comment "$N" --repo "$REPO" --body-file /tmp/reject.md 2>/dev/null || true
            exit 1
          fi

          {
            echo "<!-- claude-driver:plan:commit=${BASE}:cost=${COST}:turns=${TURNS} -->"
            echo
            echo "## Claude Code 执行计划"
            echo
            cat /tmp/result.txt
            echo
            echo "---"
            echo
            echo "确认请回复 \`/approve\` 独立一行;重出计划 \`/replan\`;终止 \`/reject\`。"
          } | head -c 64000 > /tmp/comment.md
          if [ "$(wc -c < /tmp/comment.md)" -ge 64000 ]; then
            printf '\n\n<!-- 内容过长已截断 -->\n' >> /tmp/comment.md
          fi
          gh issue comment "$N" --repo "$REPO" --body-file /tmp/comment.md

          for s in planning executing done failed; do
            gh issue edit "$N" --repo "$REPO" --remove-label "claude:$s" 2>/dev/null || true
          done
          gh issue edit "$N" --repo "$REPO" --add-label claude:plan-ready

      # ─────────────────────────────────────
      # 5. execute 分支:build → commit → ff-merge main → push main
      # 文本型仓库(owner 唯一、Markdown 单一)不再走 PR 模式:
      #   - 不需要外部 review
      #   - 不需要 CI 矩阵
      #   - PAT 不需要 createPullRequest scope
      #   - 避免 agent/issue-N 分支残留 / runner ephemeral 磁盘丢改动
      # 改为:Claude 直接在 main 上改文件 → build 卡门 → commit → rebase → push main
      # rebase 冲突 = 远端 main 上有冲突更新,driver 不强推,标 failed 等用户处理
      # ─────────────────────────────────────
      - name: Build and push
        id: build
        if: steps.decide.outputs.mode == 'execute' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
          REPO: ${{ github.repository }}
          N: ${{ steps.decide.outputs.number }}
        run: |
          ISSUE_TITLE="$(jq -r '.title' /tmp/issue.json)"
          # build 卡门:SUCCESS 且无 WARNING
          npm run build 2>&1 | tee /tmp/build.log | grep -E "WARNING|SUCCESS|ERROR" || true
          if grep -q '\[WARNING\]' /tmp/build.log || ! grep -q '\[SUCCESS\]' /tmp/build.log; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
            echo "reason=build 失败或有 WARNING,未 push" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # diff 检查:Claude 应该改了东西(对比起点是 claude step 切到的 origin/main)
          if git diff --quiet origin/main; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
            echo "reason=Claude 跑完后无 diff,可能 plan 已过期或被 abort" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # commit(在 main 上直接做,无需切分支 / ff-merge)
          git add -A
          # 截断到 80 字,避免超长 issue 标题撑爆 log 第一行;超长用 … 结尾
          TITLE="$(printf '%s' "${ISSUE_TITLE}" | tr '\n' ' ' | tr -s ' ' | sed -E 's/^ +| +$//g' | cut -c1-80)"
          [ "${#ISSUE_TITLE}" -gt 80 ] && TITLE="${TITLE}…"
          [ -z "${TITLE}" ] && TITLE="(无标题)"
          printf 'Agent: #%s — %s\n' "${N}" "${TITLE}" | git commit -F -
          # 校验:Claude 不应自作 commit。HEAD 距离 origin/main 应只有 1 个 commit
          # (就是 build step 这一笔)。如果 > 1,说明 Claude 跑了 git commit,
          # 把 warn 写进 step summary,留 trace 但不阻塞(已 prompt 约束)。
          COMMIT_COUNT="$(git rev-list --count origin/main..HEAD)"
          if [ "${COMMIT_COUNT}" -gt 1 ]; then
            echo "::warning::Claude 自作 ${COMMIT_COUNT} 个 commit(prompt 要求 Claude 不 commit)"
            {
              echo "### ⚠️ Claude 自作 commit"
              echo
              echo "检测到 \`git log origin/main..HEAD\` 有 ${COMMIT_COUNT} 个 commit(预期 1 个)。"
              echo "可能是 Claude 绕过了 prompt 约束跑了 \`git commit\`。"
              echo
              echo '```'
              git log --oneline origin/main..HEAD
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # rebase:拉远端 main 上来,处理 Claude 改文件期间其他 commit 进 main 的情况
          git fetch origin main
          if ! git pull --rebase origin main; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
            echo "reason=rebase 冲突(Claude 改的文件在远端 main 上有冲突更新),需用户处理" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push origin main; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
            echo "reason=push main 失败" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "state=done" >> "$GITHUB_OUTPUT"
          echo "merge_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post execute result
        if: steps.decide.outputs.mode == 'execute' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.decide.outputs.number }}
          BASE: ${{ steps.claude.outputs.base_sha }}
          COST: ${{ steps.claude.outputs.cost }}
          TURNS: ${{ steps.claude.outputs.turns }}
          STATE: ${{ steps.build.outputs.state }}
          MERGE_COMMIT: ${{ steps.build.outputs.merge_commit }}
          REASON: ${{ steps.build.outputs.reason }}
        run: |
          {
            echo "<!-- claude-driver:result:commit=${BASE}:merge=${MERGE_COMMIT:-none}:cost=${COST}:turns=${TURNS} -->"
            echo
            echo "## Claude Code 执行结果"
            echo
            echo "- 合并到 main: \`${MERGE_COMMIT:-none}\`"
            echo "- 状态: ${STATE}"
            [ -n "${REASON:-}" ] && echo "- 原因: ${REASON}"
            echo "- 成本: \$${COST} / ${TURNS} 轮"
            echo
            cat /tmp/result.txt
          } | head -c 64000 > /tmp/result.md
          if [ "$(wc -c < /tmp/result.md)" -ge 64000 ]; then
            printf '\n\n<!-- 内容过长已截断 -->\n' >> /tmp/result.md
          fi
          gh issue comment "$N" --repo "$REPO" --body-file /tmp/result.md

          for s in planning plan-ready executing done failed; do
            gh issue edit "$N" --repo "$REPO" --remove-label "claude:$s" 2>/dev/null || true
          done
          LABEL="${STATE:-failed}"
          gh issue edit "$N" --repo "$REPO" --add-label "claude:${LABEL}"

      # ─────────────────────────────────────
      # 6. 终态保险:无论前面哪步失败 / cancel,这里都跑一次,
      # 把 issue label 拉回一致状态。覆盖以下漏网场景:
      #   - setup 步骤失败 (Checkout / Setup Node / Cache / Install)
      #   - 无凭证 (creds check → skip=no_credentials)
      #   - claude 步骤 cancelled (timeout 60min / 手动 cancel)
      #   - Post plan comment 中段失败 (gh issue comment exit 后跳过 label 切换)
      #   - 整个 workflow 被 cancel
      # 设计原则:按 mode + 各 step outcome 算出「期望终态」,
      # 已经是期望值时 no-op,避免覆盖正常路径的 label 切换。
      # ─────────────────────────────────────
      - name: Reconcile final label
        if: always() && steps.decide.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ steps.decide.outputs.number }}
          MODE: ${{ steps.decide.outputs.mode }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          POST_PLAN_OUTCOME: ${{ steps.post_plan.outcome }}
          BUILD_STATE: ${{ steps.build.outputs.state }}
        run: |
          # skip 模式不碰 label(reason 可能是「非 owner / 已关闭」,留原状)
          [ "$MODE" = "skip" ] && { echo "mode=skip, 跳过 reconciliation"; exit 0; }

          # 决定期望终态
          DESIRED=""
          case "$MODE" in
            paused)
              DESIRED="paused"
              ;;
            plan)
              if [ "$CLAUDE_OUTCOME" = "success" ] && [ "$POST_PLAN_OUTCOME" = "success" ]; then
                DESIRED="plan-ready"
              else
                DESIRED="failed"
              fi
              ;;
            execute)
              if [ "$BUILD_STATE" = "done" ]; then
                DESIRED="done"
              else
                DESIRED="failed"
              fi
              ;;
            *)
              echo "未知 mode: '$MODE', 跳过"
              exit 0
              ;;
          esac

          # 查现状
          CURRENT_LABELS="$(gh issue view "$N" --repo "$REPO" --json labels --jq -r '.labels[].name' | grep '^claude:' || true)"
          CURRENT_COUNT="$(printf '%s\n' "$CURRENT_LABELS" | grep -c . || true)"
          echo "current claude:* labels: ${CURRENT_LABELS:-<none>}"
          echo "desired: claude:$DESIRED"

          # 已经是期望状态(且只有一个 claude:* label),不动
          if [ "$CURRENT_COUNT" = "1" ] && printf '%s\n' "$CURRENT_LABELS" | grep -qx "claude:$DESIRED"; then
            echo "label 已是 claude:$DESIRED, 无需调整"
            exit 0
          fi

          # 一次性清掉所有 claude:*
          for s in planning plan-ready executing done failed paused; do
            gh issue edit "$N" --repo "$REPO" --remove-label "claude:$s" 2>/dev/null || true
          done

          # 加上期望值
          gh issue edit "$N" --repo "$REPO" --add-label "claude:$DESIRED" 2>/dev/null || true

          # step summary 留 trace,方便排查
          {
            echo "### 🧹 Final label reconciliation"
            echo
            echo "- issue: #${N}"
            echo "- mode: \`${MODE}\`"
            echo "- claude outcome: \`${CLAUDE_OUTCOME:-<n/a>}\`"
            echo "- post_plan outcome: \`${POST_PLAN_OUTCOME:-<n/a>}\`"
            echo "- build state: \`${BUILD_STATE:-<n/a>}\`"
            echo "- previous: \`${CURRENT_LABELS:-<none>}\` → \`claude:${DESIRED}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
