name: Codex 议题驱动
run-name: 'Issue #${{ github.event.issue.number || inputs.issue_number }} · ${{ github.event_name }}'

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 指定要继续的 Issue 会话
        required: true
      dry_run:
        description: 只恢复上下文，不调用模型或发布
        default: 'false'

concurrency:
  group: codex-driver-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  turn:
    if: >-
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      (github.event_name != 'issue_comment' || !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready == 'true' && inputs.dry_run != 'true' }}
      issue: ${{ steps.prepare.outputs.issue }}
      execution_sha: ${{ steps.prepare.outputs.execution_sha }}
      action: ${{ steps.respond.outputs.action }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: 开始任务状态
        continue-on-error: true
        uses: ./.github/actions/workflow-status
        with:
          phase: preparing
      - name: 恢复当前会话
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: python3 scripts/issue_conversation.py prepare
      - uses: actions/setup-node@v4
        if: steps.prepare.outputs.ready == 'true' && inputs.dry_run != 'true'
        with:
          node-version: '22'
      - name: 安装统一执行器
        if: steps.prepare.outputs.ready == 'true' && inputs.dry_run != 'true'
        run: python3 scripts/codex_runner.py install
      - name: 更新阶段：继续当前任务
        if: steps.prepare.outputs.ready == 'true' && inputs.dry_run != 'true'
        continue-on-error: true
        uses: ./.github/actions/workflow-status
        with:
          phase: running
      - name: 继续当前任务
        id: respond
        if: steps.prepare.outputs.ready == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.prepare.outputs.issue }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 scripts/issue_conversation.py respond
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always() && steps.prepare.outputs.ready == 'true' && inputs.dry_run != 'true'
        with:
          name: conversation-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/conversation/*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-executions/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: 完成任务状态
        continue-on-error: true
        if: always()
        uses: ./.github/actions/workflow-status
        with:
          phase: finished
          state: ${{ job.status }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: ignore
          retention-days: 30

  apply:
    needs: turn
    if: needs.turn.outputs.action == 'approve' && needs.turn.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
      actions: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.turn.outputs.execution_sha }}
          path: tooling
          persist-credentials: false
          fetch-depth: 0
      - name: 开始任务状态
        continue-on-error: true
        uses: ./tooling/.github/actions/workflow-status
        with:
          phase: preparing
      - uses: actions/checkout@v6
        with:
          ref: main
          path: site
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.turn.outputs.artifact_id }}
          path: site/output/conversation
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: 安装构建依赖
        working-directory: site
        run: npm ci
      - name: 更新阶段：核验批准并写入
        continue-on-error: true
        uses: ./tooling/.github/actions/workflow-status
        with:
          phase: running
      - name: 核验批准并写入
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.turn.outputs.issue }}
        run: python3 ../tooling/scripts/issue_conversation.py apply --root "$PWD"
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: conversation-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            site/output/conversation/receipt.json
            site/output/conversation/build.log
          if-no-files-found: ignore
          retention-days: 30
      - name: 完成任务状态
        continue-on-error: true
        if: always()
        uses: ./tooling/.github/actions/workflow-status
        with:
          phase: finished
          state: ${{ job.status }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: ignore
          retention-days: 30

  regenerate:
    needs: turn
    if: needs.turn.outputs.action == 'regenerate' && needs.turn.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      actions: write
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.turn.outputs.execution_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 开始任务状态
        continue-on-error: true
        uses: ./.github/actions/workflow-status
        with:
          phase: preparing
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.turn.outputs.artifact_id }}
          path: output/conversation
          merge-multiple: true
      - name: 更新阶段：调度固定壁纸任务
        continue-on-error: true
        uses: ./.github/actions/workflow-status
        with:
          phase: running
      - name: 调度固定壁纸任务
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.turn.outputs.issue }}
        run: python3 scripts/issue_conversation.py regenerate
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: conversation-regenerate-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/conversation/receipt.json
          if-no-files-found: ignore
          retention-days: 30
      - name: 完成任务状态
        continue-on-error: true
        if: always()
        uses: ./.github/actions/workflow-status
        with:
          phase: finished
          state: ${{ job.status }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [turn, apply, regenerate]
    if: always() && needs.turn.outputs.ready == 'true' && needs.turn.outputs.artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.turn.outputs.execution_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 开始任务状态
        continue-on-error: true
        uses: ./.github/actions/workflow-status
        with:
          phase: preparing
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.turn.outputs.artifact_id }}
          path: output/conversation
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.apply.outputs.artifact_id != '' || needs.regenerate.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ needs.apply.outputs.artifact_id || needs.regenerate.outputs.artifact_id }}
          path: output/conversation
          merge-multiple: true
      - name: 更新阶段：发布同一会话的结果
        continue-on-error: true
        uses: ./.github/actions/workflow-status
        with:
          phase: running
      - name: 发布同一会话的结果
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.turn.outputs.issue }}
          TURN_OUTCOME: ${{ needs.turn.result }}
        run: python3 scripts/issue_conversation.py publish
      - name: 更新会话展示状态
        continue-on-error: true
        if: steps.publish.outputs.label != ''
        uses: ./.github/actions/workflow-status
        with:
          phase: finished
          state: ${{ job.status }}
          issue-number: ${{ needs.turn.outputs.issue }}
          label: ${{ steps.publish.outputs.label }}
      - name: 完成任务状态
        continue-on-error: true
        if: always()
        uses: ./.github/actions/workflow-status
        with:
          phase: finished
          state: ${{ job.status }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: ignore
          retention-days: 30
