name: Codex 执行器验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-runner-check
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMATION_PERMISSION_CONFIG: '{extends=":read-only", filesystem={":workspace_roots"={output="write"}}, network={enabled=true}}'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 开始任务状态
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python3 -m pip install PyYAML Pillow
      - name: Install locked Node test dependencies
        run: npm ci --ignore-scripts
      - name: 更新阶段：验证结果
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: verifying
      - name: Verify lifecycle, retries and task compatibility
        run: |
          node --test scripts/test_workflow_status.mjs
          python3 -m unittest discover -s scripts -p test_workflow_status.py
          python3 -m unittest discover -s scripts -p test_codex_runner.py
          python3 -m unittest discover -s scripts -p test_run_automation_task.py
          python3 -m unittest discover -s scripts -p test_codex_actions_diagnosis.py
          python3 -m unittest discover -s scripts -p test_actions_diagnosis_lifecycle.py
          python3 -m unittest discover -s scripts -p test_history_life_journey.py
          python3 -m unittest discover -s scripts -p test_scheduled_issue_review.py
      - name: Install pinned Codex
        run: python3 scripts/codex_runner.py install
      - name: Verify exact filesystem and network permissions
        run: python3 scripts/check_automation_permissions.py
      - name: 更新阶段：执行任务
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: running
      - name: Verify real Codex invocation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 scripts/check_codex_runner.py
      - name: Save execution evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-runner-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codex-executions/*.json
            output/codex-smoke/result.json
          if-no-files-found: ignore
          retention-days: 30
      - name: 完成任务状态
        if: always() && hashFiles('.github/actions/workflow-status/action.yml') != ''
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30
