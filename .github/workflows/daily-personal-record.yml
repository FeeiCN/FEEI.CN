name: 每日个人记录

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-daily-personal-record
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_DAILY_PERSONAL_RECORD == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: daily-personal-record
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/定时任务/每日个人记录任务提示词.md
      delivery: issue
    secrets: inherit
