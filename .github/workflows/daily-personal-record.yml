name: 每日个人记录

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 自动选择、早间创建或晚间刷新
        type: choice
        default: auto
        options: [auto, create, refresh]
      date:
        description: 北京时间日期 YYYY-MM-DD，留空自动选择
        type: string
  schedule:
    - cron: '45 23,0-14 * * *'
    - cron: '15 15 * * *'
    - cron: '45 15 * * *'
    - cron: '15 16 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-daily-personal-record
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ vars.AUTOMATION_DAILY_PERSONAL_RECORD == 'true' && (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.daily.outputs.ready }}
      date: ${{ steps.daily.outputs.date }}
      issue: ${{ steps.daily.outputs.issue }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: 开始任务状态
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify daily creation and refresh rules
        run: python3 -m unittest discover -s scripts -p test_daily_personal_record.py
      - name: 更新阶段：执行任务
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: running
      - name: Create daily inbox or refresh factual snapshot
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONAL_MODE: ${{ inputs.mode || 'auto' }}
          PERSONAL_DATE: ${{ inputs.date }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/daily_personal_record.py prepare
      - name: Save scheduling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-schedule-${{ github.run_id }}
          path: output/daily-schedule.json
          if-no-files-found: ignore
          retention-days: 30
      - name: 完成任务状态
        if: always() && hashFiles('.github/actions/workflow-status/action.yml') != ''
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30

  run:
    needs: prepare
    if: ${{ vars.AUTOMATION_DAILY_PERSONAL_RECORD == 'true' && needs.prepare.outputs.ready == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: daily-personal-record
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/定时任务/每日个人记录任务提示词.md
      delivery: issue
      personal_date: ${{ needs.prepare.outputs.date }}
      personal_issue: ${{ needs.prepare.outputs.issue }}
    secrets: inherit
