name: 每日阅读精选

on:
  workflow_dispatch:
  schedule:
    - cron: "40 23 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-daily-reading-selection
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_DAILY_READING_SELECTION == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: daily-reading-selection
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/SKILL/阅读精选.md
      delivery: issue
    secrets: inherit
