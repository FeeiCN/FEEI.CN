name: Deploy website

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Save daily diary issue', 'Codex issue driver', 'Fetch issue content', 'Sync security engineering', 'Daily data analysis']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'plugins/**'
      - 'scripts/check_docs_quality.mjs'
      - 'scripts/build_search_index.mjs'
      - 'scripts/build_version_history.mjs'
      - 'docusaurus.config.ts'
      - 'config/search.ts'
      - 'sidebars.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  REPO_DIR: /data/wufeifei.com
  SITE_ROOT: /data/wufeifei.com-site
  MEDIA_ROOT: /data/wufeifei-assets/media
  MUSIC_ROOT: /data/wufeifei-assets/music
  DATA_ROOT: /data/wufeifei-assets/data

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "REPO_DIR='${{ env.REPO_DIR }}' SITE_ROOT='${{ env.SITE_ROOT }}' MEDIA_ROOT='${{ env.MEDIA_ROOT }}' MUSIC_ROOT='${{ env.MUSIC_ROOT }}' DATA_ROOT='${{ env.DATA_ROOT }}' DEPLOY_SHA='${{ github.sha }}' DEPLOY_ACTION_URL='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' GITHUB_TOKEN='${{ github.token }}' GITHUB_REPOSITORY='${{ github.repository }}' bash -se" <<'EOF'
          set -euo pipefail

          timer_start=0
          start_timer() { timer_start="$(date +%s)"; }
          format_duration() { local t="$1"; if [ "$t" -ge 60 ]; then echo "$((t/60))分$((t%60))秒"; else echo "${t}秒"; fi; }
          end_timer() { local name="$1"; local duration=$(($(date +%s)-timer_start)); echo "[deploy-timing] ${name}: $(format_duration "$duration")"; }
          group_start() { echo "::group::$1"; start_timer; }
          group_end() { end_timer "$1"; echo "::endgroup::"; }

          repo_dir="$REPO_DIR"
          site_root="$SITE_ROOT"
          media_root="$MEDIA_ROOT"
          music_root="$MUSIC_ROOT"
          data_root="$DATA_ROOT"
          releases_dir="$site_root/releases"
          current_link="$site_root/current"
          next_current_link="$site_root/current.next"
          deploy_lock_file="$site_root/.deploy.lock"
          releases_to_keep=2
          staging_dir=""
          active_build_pid=""
          hidden_data_dir="$repo_dir/static/.data.deploy-hidden"
          version_history_file="$repo_dir/static/version-history.json"
          version_history_backup="$site_root/.version-history.json.before-deploy"
          version_history_existed=false
          version_history_managed=false

          mkdir -p "$site_root"
          exec 9>"$deploy_lock_file"
          flock --wait 1200 9 || { echo "ERROR: another deployment is still running after waiting 20 minutes"; exit 1; }
          echo "Deployment lock acquired: $deploy_lock_file"

          restore_data_source() {
            if [ -d "$hidden_data_dir" ]; then
              if [ ! -e "$repo_dir/static/data" ]; then mv "$hidden_data_dir" "$repo_dir/static/data"; else rm -rf "$hidden_data_dir"; fi
            fi
          }
          restore_version_history() {
            if [ "$version_history_managed" != true ]; then return 0; fi
            if [ "$version_history_existed" = true ]; then
              mv -f "$version_history_backup" "$version_history_file"
            else
              rm -f "$version_history_file"
            fi
            version_history_managed=false
          }
          cleanup_deploy() {
            exit_status=$?
            trap - EXIT HUP INT TERM
            if [ -n "$active_build_pid" ] && kill -0 "$active_build_pid" 2>/dev/null; then
              kill -TERM -- "-$active_build_pid" 2>/dev/null || kill -TERM "$active_build_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$active_build_pid" 2>/dev/null || kill -KILL "$active_build_pid" 2>/dev/null || true
              wait "$active_build_pid" 2>/dev/null || true
            fi
            restore_data_source
            restore_version_history
            rm -f "$version_history_backup"
            if [ -n "$staging_dir" ] && [ -e "$staging_dir" ]; then rm -rf "$staging_dir"; fi
            exit "$exit_status"
          }
          trap cleanup_deploy EXIT
          trap 'exit 143' HUP INT TERM

          group_start "Prepare repository"
          cd "$repo_dir"
          restore_data_source
          old_head="$(git rev-parse HEAD)"
          pull_ok=false
          for pull_attempt in 1 2 3 4 5; do
            echo "git pull attempt $pull_attempt of 5"
            if git pull origin main; then
              pull_ok=true
              break
            fi
            if [ "$pull_attempt" -lt 5 ]; then
              sleep $((pull_attempt * 10))
            fi
          done
          [ "$pull_ok" = true ] || { echo "ERROR: git pull failed after 5 attempts"; exit 1; }
          new_head="$(git rev-parse HEAD)"
          deployed_head=""
          previous_release=""
          if [ -L "$current_link" ]; then
            previous_release="$(readlink -f "$current_link")"
            deployed_head="$(basename "$previous_release")"
          fi
          quality_base="$old_head"
          if [ -n "$deployed_head" ] && git cat-file -e "${deployed_head}^{commit}" 2>/dev/null; then quality_base="$deployed_head"; fi
          echo "old_head=$old_head"
          echo "new_head=$new_head"
          echo "deployed_head=\${deployed_head:-none}"
          deployments_file="$site_root/deployments.json"
          mkdir -p "$site_root"
          # Use the commit actually checked out after pulling main.  For
          # workflow_run events, github.sha can point at the workflow's
          # default-branch context rather than this deployment's new_head.
          export DEPLOY_SHA="$new_head" DEPLOY_ACTION_URL DEPLOY_SUMMARY="$(git log -1 --pretty=%s "$new_head")" DEPLOYMENTS_FILE="$deployments_file"
          # Keep deployment history independent from the repository commit log.
          # Backfill successful deploy.yml runs so older deployments remain visible.
          node <<'NODE'
          const fs = require('fs');
          const file = process.env.DEPLOYMENTS_FILE;
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          let history = [];
          try { history = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          if (!Array.isArray(history)) history = [];
          const current = {sha: process.env.DEPLOY_SHA || process.env.DEPLOY_SUMMARY, deployedAt: new Date().toISOString(), summary: process.env.DEPLOY_SUMMARY || '', actionUrl: process.env.DEPLOY_ACTION_URL || ''};
          const bySha = new Map();
          for (const item of history) if (item && item.sha) bySha.set(item.sha, item);
          bySha.set(current.sha, current);
          async function backfill() {
            if (!token || !repository) return;
            const response = await fetch(`https://api.github.com/repos/${repository}/actions/workflows/deploy.yml/runs?status=success&per_page=30`, {headers: {accept: 'application/vnd.github+json', authorization: `Bearer ${token}`, 'x-github-api-version': '2022-11-28'}});
            if (!response.ok) throw new Error(`GitHub Actions API returned ${response.status}`);
            const data = await response.json();
            for (const run of (data.workflow_runs || [])) {
              if (!run.head_sha || bySha.has(run.head_sha)) continue;
              bySha.set(run.head_sha, {sha: run.head_sha, deployedAt: run.updated_at || run.completed_at || run.created_at, summary: run.display_title || run.name || '', actionUrl: run.html_url || ''});
            }
          }
          backfill().catch((error) => console.warn(`Deployment history backfill skipped: ${error.message}`)).finally(() => {
            const merged = [...bySha.values()].filter((item) => item && item.sha).sort((a, b) => new Date(b.deployedAt).getTime() - new Date(a.deployedAt).getTime()).slice(0, 30);
            fs.writeFileSync(file, JSON.stringify(merged, null, 2) + '\n');
          });
          NODE
          cp "$deployments_file" "$repo_dir/static/deployments.json"
          rm -f "$version_history_backup"
          if [ -f "$version_history_file" ]; then
            cp "$version_history_file" "$version_history_backup"
            version_history_existed=true
          fi
          version_history_managed=true
          node "$repo_dir/scripts/build_version_history.mjs" --head "$new_head" --output "$version_history_file"
          group_end "Prepare repository"

          group_start "Check docs quality"
          npm run check:docs -- --base="$quality_base"
          group_end "Check docs quality"

          group_start "Prepare shared assets"
          rm -rf static/media static/music
          mkdir -p "$data_root"
          rsync -a --delete static/data/ "$data_root/"
          group_end "Prepare shared assets"

          data_only=false
          if [ -n "$deployed_head" ] && git cat-file -e "${deployed_head}^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$deployed_head" "$new_head")"
            if [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -qv '^static/data/'; then data_only=true; fi
          fi
          if [ "$data_only" = true ]; then
            current_release="$(readlink -f "$current_link")"
            rm -rf "$current_release/data"
            ln -s "$data_root" "$current_release/data"
            cp "$repo_dir/static/deployments.json" "$current_release/deployments.json"
            cp "$version_history_file" "$current_release/version-history.json"
            restore_version_history
            rm -f "$version_history_backup"
            echo "Only static/data changed; skipped Docusaurus build."
            exit 0
          fi

          group_start "Install dependencies if needed"
          if ! git diff --quiet "$old_head" "$new_head" -- package.json package-lock.json; then npm ci; else echo "Dependencies unchanged. Skipping npm ci."; fi
          group_end "Install dependencies if needed"

          group_start "Clean build cache and stale releases"
          build_cache="node_modules/.cache"
          if [ -d "$build_cache" ]; then
            cache_size_kb="$(du -sk "$build_cache" | cut -f1)"
            echo "build_cache_size_kb=$cache_size_kb"
            if [ "$cache_size_kb" -gt 2097152 ]; then rm -rf "$build_cache"; fi
          fi
          mkdir -p "$releases_dir"
          find "$releases_dir" -mindepth 1 -maxdepth 1 -type d -name '*.tmp' -exec rm -rf {} +
          ls -1dt "$releases_dir"/* 2>/dev/null | tail -n +$((releases_to_keep + 1)) | xargs -r rm -rf
          group_end "Clean build cache and stale releases"

          group_start "Type check"
          npm run typecheck
          group_end "Type check"

          release_name="$(git rev-parse HEAD)"
          release_dir="$releases_dir/$release_name"
          staging_dir="${release_dir}.tmp"
          rm -rf "$staging_dir"
          mv static/data "$hidden_data_dir"

          group_start "Build Docusaurus"
          build_timeout_seconds=900
          run_build() {
            local build_status
            setsid timeout --signal=TERM --kill-after=30s "$build_timeout_seconds" \
              env DOCUSAURUS_PERF_LOGGER=true /usr/bin/time -v npm run build -- --out-dir "$staging_dir" &
            active_build_pid=$!
            if wait "$active_build_pid"; then build_status=0; else build_status=$?; fi
            active_build_pid=""
            return "$build_status"
          }
          build_ok=false
          for build_attempt in 1 2 3; do
            rm -rf "$staging_dir"
            echo "Build attempt $build_attempt of 3"
            if run_build; then build_ok=true; break; fi
            sleep 5
          done
          [ "$build_ok" = true ] || { echo "Build failed after 3 attempts"; exit 1; }
          restore_version_history
          rm -f "$version_history_backup"
          group_end "Build Docusaurus"
          restore_data_source

          group_start "Publish release"
          mkdir -p "$media_root" "$music_root" "$data_root"
          rm -rf "$staging_dir/media" "$staging_dir/music" "$staging_dir/data"
          ln -s "$media_root" "$staging_dir/media"
          ln -s "$music_root" "$staging_dir/music"
          ln -s "$data_root" "$staging_dir/data"

          # Build the search index before publishing so the new release always
          # contains current document bodies, including Chinese terms.
          group_start "Build search index"
          search_log="$site_root/search-index-${release_name}.log"
          if ! node "$repo_dir/scripts/build_search_index.mjs" "$staging_dir" >"$search_log" 2>&1; then
            cat "$search_log"
            exit 1
          fi
          if [ ! -s "$staging_dir/search-index.json" ]; then
            echo "ERROR: search index was not generated"
            exit 1
          fi
          group_end "Build search index"
          rm -rf "$release_dir"
          mv "$staging_dir" "$release_dir"
          staging_dir=""
          ln -sfn "$release_dir" "$next_current_link"
          mv -Tf "$next_current_link" "$current_link"
          group_end "Publish release"

          group_start "Clean old releases"
          ls -1dt "$releases_dir"/* 2>/dev/null | tail -n +$((releases_to_keep + 1)) | xargs -r rm -rf
          find "$site_root" -maxdepth 1 -type f -name 'search-index-*.log' -mtime +7 -delete || true
          group_end "Clean old releases"
          EOF
