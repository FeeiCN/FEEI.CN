name: 网站部署

on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: 只读检查服务器连接、部署锁和发布版本
        type: boolean
        default: false
      check_run_id:
        description: 严格检查成功运行编号，留空使用当前 main 的最新成功产物
        type: string
  workflow_run:
    workflows: ['网站严格检查']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  REPO_DIR: /data/wufeifei.com
  SITE_ROOT: /data/wufeifei.com-site
  MEDIA_ROOT: /data/wufeifei-assets/media
  MUSIC_ROOT: /data/wufeifei-assets/music
  DATA_ROOT: /data/wufeifei-assets/data

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_only && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    concurrency: deploy-inspection
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 开始任务状态
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: 更新阶段：检查部署状态
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: verifying
      - name: 检查部署状态
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "SITE_ROOT='${{ env.SITE_ROOT }}' REPO_DIR='${{ env.REPO_DIR }}' bash -se" <<'EOF'
          set -euo pipefail
          date -Is
          uptime
          free -h
          df -h "$SITE_ROOT" "$REPO_DIR"
          if [ -L "$SITE_ROOT/current" ]; then
            echo "current_release=$(basename "$(readlink -f "$SITE_ROOT/current")")"
          fi
          lslocks --noheadings --output PID,COMMAND,PATH | awk -v lock="$SITE_ROOT/.deploy.lock" '$3 == lock { print }'
          ps -eo pid,ppid,pgid,stat,etime,pcpu,pmem,comm | awk 'NR == 1 || $8 ~ /^(node|npm|flock|bash|sshd)$/'
          find "$SITE_ROOT/releases" -mindepth 1 -maxdepth 1 -type d -name '*.tmp' -printf 'staging=%f\n'
          EOF
      - name: 完成任务状态
        if: always()
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: ignore
          retention-days: 30


  prepare:
    if: >-
      !inputs.inspect_only &&
      ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      commit: ${{ steps.source.outputs.commit }}
      run_id: ${{ steps.source.outputs.run_id }}
      attempt: ${{ steps.source.outputs.attempt }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve successful main build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.check_run_id }}
        run: python3 scripts/site_artifact.py resolve

  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_COMMIT: ${{ needs.prepare.outputs.commit }}
      SITE_RUN_ID: ${{ needs.prepare.outputs.run_id }}
      SITE_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
    steps:
      - name: Checkout delivery formatter
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 开始任务状态
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - name: Download verified build on Actions runner
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
          path: output/site
          merge-multiple: true
      - name: Verify commit, source attempt, digest and archive paths
        run: python3 scripts/site_artifact.py verify
      - name: Setup SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: 更新阶段：上传并发布
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: running
      - name: Upload with SCP and publish on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$SERVER_PORT")
          remote_dir="$(ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SITE_ROOT/incoming'; mktemp -d '$SITE_ROOT/incoming/site-$GITHUB_RUN_ID-XXXXXX'")"
          [[ "$remote_dir" == "$SITE_ROOT"/incoming/site-* && "${remote_dir##*/}" =~ ^site-[0-9]+-[a-zA-Z0-9]+$ ]] || { echo 'Invalid upload directory'; exit 1; }
          cleanup_upload() {
            ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true
          }
          trap cleanup_upload EXIT
          scp -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
            output/site/site.tar.gz output/site/manifest.json scripts/site_artifact.py scripts/publish_site_artifact.sh \
            "$SERVER_USER@$SERVER_HOST:$remote_dir/"
          ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" \
            "REPO_DIR='$REPO_DIR' SITE_ROOT='$SITE_ROOT' MEDIA_ROOT='$MEDIA_ROOT' MUSIC_ROOT='$MUSIC_ROOT' DATA_ROOT='$DATA_ROOT' GITHUB_REPOSITORY='$GITHUB_REPOSITORY' SITE_COMMIT='$SITE_COMMIT' SITE_RUN_ID='$SITE_RUN_ID' SITE_ATTEMPT='$SITE_ATTEMPT' bash '$remote_dir/publish_site_artifact.sh' '$remote_dir' '$SITE_COMMIT'"
      - name: 记录部署结果
        if: always() && hashFiles('scripts/workflow_delivery.py') != ''
        env:
          RESULT: ${{ job.status }}
        run: |
          python3 scripts/workflow_delivery.py --operation deploy --state "$RESULT" \
            --title '网站部署步骤已完成。' --link https://feei.cn \
            --output /tmp/deploy-delivery.md
      - name: 完成任务状态
        if: always() && hashFiles('.github/actions/workflow-status/action.yml') != ''
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30
