name: 日记提示词同步检查

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-diary-prompt-sync
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_DIARY_PROMPT_SYNC == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: diary-prompt-sync
    secrets: inherit
