name: Fetch issue content

# 新 issue 标题是单个 URL 时,抓取该 URL 内容并:
# 1. 把抓到的页面标题更新到 issue 标题
# 2. 把 Markdown 内容(含来源/抓取时间元信息)作为评论追加
#
# 新 issue 标题包含"天气"时,把 issue body 中的 JSON 保存到:
# static/data/weather/YYYY/MM/DD.json
#
# 新 issue 标题包含"上车"或"下车"时,把 issue body 中的地址保存到:
# static/data/drive/YYYY/MM/DD.json
#
# 为防止外部贡献者刷 runner 资源,仅处理仓库 owner 创建的 issue。
# fetch_url_content.py 只用 Python 标准库,无需额外依赖。

on:
  issues:
    types: [opened]

concurrency:
  group: fetch-issue-url-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'http://') ||
       startsWith(github.event.issue.title, 'https://') ||
       contains(github.event.issue.title, '天气') ||
       contains(github.event.issue.title, '上车') ||
       contains(github.event.issue.title, '下车'))

    steps:
      - name: Classify issue
        id: classify
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          title="$(printf '%s' "$ISSUE_TITLE" | awk '{$1=$1;print}')"
          if [[ "$title" =~ ^https?://[^[:space:]]+$ ]]; then
            {
              echo "url<<EOF"
              echo "$title"
              echo "EOF"
              echo "mode=url"
            } >> "$GITHUB_OUTPUT"
            echo "命中 URL: $title"
          elif [[ "$title" == *天气* ]]; then
            echo "mode=weather" >> "$GITHUB_OUTPUT"
            echo "命中天气: $title"
          elif [[ "$title" == *上车* || "$title" == *下车* ]]; then
            echo "mode=drive" >> "$GITHUB_OUTPUT"
            echo "命中行车: $title"
          else
            echo "标题既不是单个 URL,也不包含天气/上车/下车,跳过: $ISSUE_TITLE"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.classify.outputs.mode != 'skip'
        uses: actions/checkout@v6

      - name: Setup Python
        if: steps.classify.outputs.mode != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync main before writing data
        if: steps.classify.outputs.mode == 'weather' || steps.classify.outputs.mode == 'drive'
        run: |
          git pull --rebase origin main

      - name: Save weather JSON
        id: weather
        if: steps.classify.outputs.mode == 'weather'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import sys

          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          issue_number = os.environ.get("ISSUE_NUMBER", "")

          match = re.search(r"(?<!\d)(\d{4})-(\d{2})-(\d{2})(?!\d)", title)
          if not match:
              print(f"::error::天气 issue 标题缺少 YYYY-MM-DD 日期: {title}")
              sys.exit(1)

          year, month, day = match.groups()
          try:
              datetime.date(int(year), int(month), int(day))
          except ValueError as exc:
              print(f"::error::天气 issue 标题日期无效: {match.group(0)} ({exc})")
              sys.exit(1)

          try:
              data = json.loads(body)
          except json.JSONDecodeError as exc:
              print(f"::error::天气 issue body 不是合法 JSON: {exc}")
              sys.exit(1)

          data_dir = pathlib.Path("static/data/weather") / year / month
          data_dir.mkdir(parents=True, exist_ok=True)
          data_file = data_dir / f"{day}.json"
          data_file.write_text(
              json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
              fp.write(f"path={data_file.as_posix()}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fp:
              fp.write("### weather JSON saved\n\n")
              fp.write(f"- issue: #{issue_number}\n")
              fp.write(f"- title: {title}\n")
              fp.write(f"- path: `{data_file.as_posix()}`\n")
          PY

      - name: Commit weather JSON
        id: commit_weather
        if: steps.classify.outputs.mode == 'weather'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          WEATHER_PATH: ${{ steps.weather.outputs.path }}
        run: |
          if [ -z "$(git status --porcelain -- "$WEATHER_PATH")" ]; then
            echo "天气 JSON 无变化: $WEATHER_PATH"
            echo "committed=no" >> "$GITHUB_OUTPUT"
            echo "processed=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$WEATHER_PATH"
          git commit -m "保存天气数据 (#${ISSUE_NUMBER})"
          git push origin main
          echo "committed=yes" >> "$GITHUB_OUTPUT"
          echo "processed=yes" >> "$GITHUB_OUTPUT"

      - name: Close weather issue
        if: steps.classify.outputs.mode == 'weather' && steps.commit_weather.outputs.processed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          WEATHER_PATH: ${{ steps.weather.outputs.path }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "已保存天气数据到 \`$WEATHER_PATH\`。"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "天气数据已处理完成。"

      - name: Save drive JSON
        id: drive
        if: steps.classify.outputs.mode == 'drive'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import sys

          title = os.environ.get("ISSUE_TITLE", "")
          address = os.environ.get("ISSUE_BODY", "").strip()
          issue_number = os.environ.get("ISSUE_NUMBER", "")

          match = re.search(
              r"(?<!\d)(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2}:\d{2}).*?(上车|下车)",
              title,
          )
          if not match:
              print(f"::error::行车 issue 标题缺少 YYYY-MM-DD HH:MM:SS + 上车/下车: {title}")
              sys.exit(1)

          year, month, day, time_key, action = match.groups()
          try:
              datetime.datetime.strptime(f"{year}-{month}-{day} {time_key}", "%Y-%m-%d %H:%M:%S")
          except ValueError as exc:
              print(f"::error::行车 issue 标题时间无效: {match.group(0)} ({exc})")
              sys.exit(1)

          data_dir = pathlib.Path("static/data/drive") / year / month
          data_dir.mkdir(parents=True, exist_ok=True)
          data_file = data_dir / f"{day}.json"

          if data_file.exists():
              try:
                  data = json.loads(data_file.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  print(f"::error::现有行车 JSON 无法解析: {data_file} ({exc})")
                  sys.exit(1)
              if not isinstance(data, dict):
                  print(f"::error::现有行车 JSON 顶层必须是对象: {data_file}")
                  sys.exit(1)
          else:
              data = {}

          data[time_key] = {
              "action": action,
              "address": address,
          }
          data_file.write_text(
              json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
              fp.write(f"path={data_file.as_posix()}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fp:
              fp.write("### drive JSON saved\n\n")
              fp.write(f"- issue: #{issue_number}\n")
              fp.write(f"- title: {title}\n")
              fp.write(f"- action: {action}\n")
              fp.write(f"- address: {address}\n")
              fp.write(f"- path: `{data_file.as_posix()}`\n")
          PY

      - name: Commit drive JSON
        id: commit_drive
        if: steps.classify.outputs.mode == 'drive'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DRIVE_PATH: ${{ steps.drive.outputs.path }}
        run: |
          if [ -z "$(git status --porcelain -- "$DRIVE_PATH")" ]; then
            echo "行车 JSON 无变化: $DRIVE_PATH"
            echo "committed=no" >> "$GITHUB_OUTPUT"
            echo "processed=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DRIVE_PATH"
          git commit -m "保存行车数据 (#${ISSUE_NUMBER})"
          git push origin main
          echo "committed=yes" >> "$GITHUB_OUTPUT"
          echo "processed=yes" >> "$GITHUB_OUTPUT"

      - name: Close drive issue
        if: steps.classify.outputs.mode == 'drive' && steps.commit_drive.outputs.processed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          DRIVE_PATH: ${{ steps.drive.outputs.path }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "已保存行车数据到 \`$DRIVE_PATH\`。"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "行车数据已处理完成。"

      # fetch_url_content.py 默认会调 translate_text.py → Codex CLI 做翻译。
      # 凭证缺失时让 fetch 以 --no-translate 模式跑,只抓原文不发翻译请求。
      - name: Check OpenAI credentials
        id: creds
        if: steps.classify.outputs.mode == 'url'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "translate_flag=--no-translate" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY 未配置,fetch_url_content.py 将以 --no-translate 模式运行"
          else
            echo "translate_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.classify.outputs.mode == 'url' && steps.creds.outputs.translate_flag == ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Cache global npm modules
        if: steps.classify.outputs.mode == 'url' && steps.creds.outputs.translate_flag == ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            $(npm root -g)
          key: codex-cli-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            codex-cli-${{ hashFiles('package-lock.json') }}-
            codex-cli-

      - name: Install Codex
        if: steps.classify.outputs.mode == 'url' && steps.creds.outputs.translate_flag == ''
        run: |
          npm install -g @openai/codex
          which codex
          codex --version

      - name: Fetch URL content
        id: fetch
        if: steps.classify.outputs.mode == 'url'
        env:
          URL: ${{ steps.classify.outputs.url }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          python3 scripts/fetch_url_content.py "$URL" ${{ steps.creds.outputs.translate_flag }} > /tmp/result.json || true
          python3 - <<'PY'
          import json, os, sys
          with open("/tmp/result.json", "r", encoding="utf-8") as fp:
              r = json.load(fp)
          print(f"status={r.get('status')} / title={(r.get('title') or '')[:80]}", flush=True)
          print(f"translated={r.get('translated')} / provider={r.get('translate_provider')}", flush=True)
          err = r.get("translate_error")
          if err:
              print(f"translate_error={err}", flush=True)
              sys.stdout.flush()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fp:
              fp.write("### fetch_url_content result\n\n")
              fp.write("```json\n")
              fp.write(json.dumps({k: v for k, v in r.items() if k != "markdown" and k != "pairs"}, ensure_ascii=False, indent=2))
              fp.write("\n```\n")
          PY

      - name: Post comment and update title
        if: steps.classify.outputs.mode == 'url'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.classify.outputs.url }}
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import subprocess

          COMMENT_LIMIT = 64000  # 给元信息留余量,GitHub 评论上限 65536

          with open("/tmp/result.json", "r", encoding="utf-8") as fp:
              data = json.load(fp)

          url = os.environ["URL"]
          issue_number = os.environ["ISSUE_NUMBER"]
          repo = os.environ["REPO"]

          status = data.get("status")
          source_url = data.get("source_url") or url
          fetched_at = datetime.datetime.now(datetime.timezone.utc).astimezone().isoformat(timespec="seconds")

          lines = ["## 来源", "", f"- 原文: {url}"]
          if source_url and source_url != url:
              lines.append(f"- 内容来源: {source_url}")
          lines.append(f"- 抓取时间: {fetched_at}")
          lines.extend(["", "## 内容", ""])

          if status == "error":
              lines.append(f"抓取失败: {data.get('error', '')}")
          else:
              markdown = (data.get("markdown") or "").strip()
              translate_error = data.get("translate_error")
              if translate_error:
                  lines.append(f"> ⚠️ 翻译失败,以下是原文: `{translate_error}`")
                  lines.append("")
              if not markdown:
                  markdown = "内容未获取(页面可能需要 JS 渲染或登录后才能查看)"
              elif source_url.startswith("https://web.archive.org/"):
                  markdown += f"\n\n> 注:原文对自动化访问有限制,内容取自 Wayback Machine 快照 ({source_url})。"
              if len(markdown) > COMMENT_LIMIT:
                  markdown = markdown[:COMMENT_LIMIT].rstrip() + "\n\n<!-- 内容过长,已截断 -->"
              lines.append(markdown)

          body = "\n".join(lines).strip() + "\n"
          with open("/tmp/comment.md", "w", encoding="utf-8") as fp:
              fp.write(body)

          subprocess.run(
              ["gh", "issue", "comment", issue_number, "--repo", repo, "--body-file", "/tmp/comment.md"],
              check=True,
          )

          if status == "success":
              new_title = (data.get("title") or "").strip()
              if new_title and new_title != url:
                  if len(new_title) > 256:
                      new_title = new_title[:255].rstrip() + "…"
                  subprocess.run(
                      ["gh", "issue", "edit", issue_number, "--repo", repo, "--title", new_title],
                      check=True,
                  )
                  print(f"已更新标题: {new_title}")
          PY
