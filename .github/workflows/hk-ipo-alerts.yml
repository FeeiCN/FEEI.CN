name: 港股热门新股提醒

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,4,8,12 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-hk-ipo-alerts
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_HK_IPO_ALERTS == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: hk-ipo-alerts
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/SKILL/港股新股跟踪.md
      delivery: issue
    secrets: inherit
