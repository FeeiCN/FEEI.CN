name: iOS device assets

# 每天北京时间 12:00 在 Mac mini self-hosted runner 上运行。
# GitHub Actions cron 使用 UTC，北京时间 12:00 = UTC 04:00。

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ios-device-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    name: Capture iOS assets
    runs-on: [self-hosted, macnimi]
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      APPIUM_HOST: ${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}
      APPIUM_PORT: ${{ vars.IOS_APPIUM_PORT || '4723' }}
      APPIUM_URL: http://${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}:${{ vars.IOS_APPIUM_PORT || '4723' }}
      IOS_DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID || '00008101-0014494A1A83001E' }}
      XCODE_ORG_ID: ${{ vars.IOS_XCODE_ORG_ID || '29CH3TC643' }}
      UPDATED_WDA_BUNDLE_ID: ${{ vars.IOS_UPDATED_WDA_BUNDLE_ID || 'com.feei.WebDriverAgentRunner' }}
      CAITONG_TRADE_PASSWORD: ${{ secrets.CAITONG_TRADE_PASSWORD }}
      PYTHONUNBUFFERED: '1'
      NO_PROXY: 127.0.0.1,localhost,${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''

    steps:
      - name: Check secrets
        env:
          WORKFLOW_TRIGGER_PAT: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
        run: |
          if [ -z "${WORKFLOW_TRIGGER_PAT:-}" ]; then
            echo "::error::WORKFLOW_TRIGGER_PAT 未配置"
            exit 1
          fi
          if [ -z "${CAITONG_TRADE_PASSWORD:-}" ]; then
            echo "::warning::CAITONG_TRADE_PASSWORD 未配置，本次财通任务会失败，但不影响支付宝和 Health Auto Export"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare runner
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          git config user.name "FeeiCN[bot]"
          git config user.email "feei@feei.cn"
          if git rev-parse --verify "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          fi

      - name: Check local dependencies
        run: |
          command -v python3 >/dev/null
          command -v curl >/dev/null
          command -v appium >/dev/null
          python3 - <<'PY'
          import importlib.util
          import sys

          missing = [
              name
              for name in ("appium",)
              if importlib.util.find_spec(name) is None
          ]
          if missing:
              print(f"::error::缺少 Python 依赖: {', '.join(missing)}")
              sys.exit(1)
          PY

      - name: Ensure Appium server
        run: |
          if curl -fsS "${APPIUM_URL%/}/status" >/dev/null 2>&1; then
            echo "Appium already running at ${APPIUM_URL}"
            exit 0
          fi

          mkdir -p "$HOME/Library/Logs"
          nohup appium --address "$APPIUM_HOST" --port "$APPIUM_PORT" > "$HOME/Library/Logs/FEEI.CN-ios-appium.log" 2>&1 &
          echo "$!" > /tmp/FEEI.CN-ios-appium.pid

          for _ in $(seq 1 30); do
            if curl -fsS "${APPIUM_URL%/}/status" >/dev/null 2>&1; then
              echo "Appium started at ${APPIUM_URL}"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Appium 启动失败，查看 $HOME/Library/Logs/FEEI.CN-ios-appium.log"
          exit 1

      - name: Capture Alipay, Caitong and Health Auto Export
        run: |
          python3 <<'PY'
          import fcntl
          import json
          import os
          import subprocess
          import sys
          import textwrap
          from pathlib import Path

          common_args = [
              "--appium-url", os.environ["APPIUM_URL"],
              "--udid", os.environ["IOS_DEVICE_UDID"],
              "--xcode-org-id", os.environ["XCODE_ORG_ID"],
              "--updated-wda-bundle-id", os.environ["UPDATED_WDA_BUNDLE_ID"],
              "--new-command-timeout", "600",
          ]
          commands = [
              (
                  "alipay",
                  [
                      "python3",
                      "scripts/ios_appium_capture.py",
                      "--alipay-assets",
                      "--no-sync-caitong",
                      "--no-start-health-server",
                      "--max-screens",
                      "20",
                      *common_args,
                  ],
              ),
              (
                  "caitong",
                  [
                      "python3",
                      "scripts/ios_appium_capture.py",
                      "--caitong-assets",
                      "--caitong-max-screens",
                      "12",
                      *common_args,
                  ],
              ),
              (
                  "health-auto-export",
                  [
                      "python3",
                      "-c",
                      textwrap.dedent(
                          """
                          import argparse
                          import scripts.ios_appium_capture as capture

                          args = argparse.Namespace(
                              appium_url='{appium_url}',
                              udid='{udid}',
                              bundle_id=capture.HEALTH_AUTO_EXPORT_BUNDLE_ID,
                              device_name=None,
                              platform_version=None,
                              show_xcode_log=False,
                              xcode_org_id='{xcode_org_id}',
                              xcode_signing_id='iPhone Developer',
                              updated_wda_bundle_id='{updated_wda_bundle_id}',
                              wda_local_port=None,
                              allow_provisioning_updates=False,
                              allow_provisioning_device_registration=False,
                              new_command_timeout=600,
                              step_wait=1.5,
                              nav_timeout=20,
                          )
                          driver = capture.create_driver(args, args.udid)
                          try:
                              print(capture.start_health_auto_export_server(driver, args), flush=True)
                          finally:
                              driver.quit()
                          """
                      ).format(
                          appium_url=os.environ["APPIUM_URL"],
                          udid=os.environ["IOS_DEVICE_UDID"],
                          xcode_org_id=os.environ["XCODE_ORG_ID"],
                          updated_wda_bundle_id=os.environ["UPDATED_WDA_BUNDLE_ID"],
                      ),
                  ],
              ),
          ]

          env = os.environ.copy()
          appium_host = os.environ.get("APPIUM_HOST", "")
          env["NO_PROXY"] = ",".join(
              value for value in ("127.0.0.1", "localhost", appium_host) if value
          )
          for name in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "http_proxy", "https_proxy", "all_proxy"):
              env.pop(name, None)

          log_dir = Path.home() / "Library" / "Logs"
          log_dir.mkdir(parents=True, exist_ok=True)
          log_path = log_dir / "FEEI.CN-ios-device-assets.log"
          status_path = Path("static/data/invest/ios-device-assets-status.json")
          results = []

          with open("/tmp/FEEI.CN-ios-device-assets.lock", "w", encoding="utf-8") as lock:
              print("Waiting for iOS device automation lock...")
              fcntl.flock(lock, fcntl.LOCK_EX)
              print("Acquired iOS device automation lock.")

              with log_path.open("a", encoding="utf-8") as log_file:
                  for task, command in commands:
                      print(f"::group::{task}")
                      print("Running:", " ".join(command))
                      log_file.write(f"\n===== {task} =====\n")
                      process = subprocess.Popen(
                          command,
                          env=env,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True,
                          encoding="utf-8",
                          errors="replace",
                      )
                      assert process.stdout is not None
                      output_lines = []
                      for line in process.stdout:
                          print(line, end="")
                          log_file.write(line)
                          output_lines.append(line.rstrip())
                      status = process.wait()
                      results.append(
                          {
                              "task": task,
                              "status": "success" if status == 0 else "failed",
                              "exitCode": status,
                              "tail": output_lines[-20:],
                          }
                      )
                      print(f"::{ 'notice' if status == 0 else 'error' }::{task} exit code {status}")
                      print("::endgroup::")

          status_path.parent.mkdir(parents=True, exist_ok=True)
          status_path.write_text(
              json.dumps({"results": results}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          if not any(item["status"] == "success" for item in results):
              print("::error::iOS 资产自动化三项任务全部失败")
              sys.exit(1)
          failed = [item["task"] for item in results if item["status"] != "success"]
          if failed:
              print(f"::warning::部分任务失败: {', '.join(failed)}")
          PY

      - name: Commit generated investment data
        run: |
          python3 <<'PY'
          import sys
          from pathlib import Path

          repo_root = Path.cwd()
          sys.path.insert(0, str(repo_root / "scripts"))
          from git_ops import git_commit_and_push_target_repo

          git_commit_and_push_target_repo(
              [Path("static/data/invest")],
              repo_root=repo_root,
              description="同步 iOS 资产数据",
          )
          PY
