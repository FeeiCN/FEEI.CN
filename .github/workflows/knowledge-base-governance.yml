name: FEEI.CN 知识库治理

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 6"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-knowledge-base-governance
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_KNOWLEDGE_BASE_GOVERNANCE == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: knowledge-base-governance
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/定时任务/FEEI.CN 知识库治理任务提示词.md
      delivery: issue
    secrets: inherit
