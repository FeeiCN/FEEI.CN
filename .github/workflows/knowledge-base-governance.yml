name: FEEI.CN 知识库治理

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 6"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-knowledge-base-governance
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_KNOWLEDGE_BASE_GOVERNANCE == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: knowledge-base-governance
    secrets: inherit
