name: Macnimi data sync

# 使用本机 self-hosted runner（label: macnimi）替代原 crontab：
# - 北京时间每天 06:00 更新账户资产数据（UTC 22:00）
# - 北京时间每天 06:10 更新港股打新数据（UTC 22:10）
# - 每小时 30 分同步健康数据

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '10 22 * * *'
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '需要运行的任务'
        required: true
        default: all
        type: choice
        options:
          - all
          - account-assets
          - hk-ipo
          - health

permissions:
  contents: write

jobs:
  sync:
    name: Sync data
    runs-on: [self-hosted, macnimi]
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      APPIUM_HOST: ${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}
      APPIUM_PORT: ${{ vars.IOS_APPIUM_PORT || '4723' }}
      APPIUM_URL: http://${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}:${{ vars.IOS_APPIUM_PORT || '4723' }}
      IOS_DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID || '00008101-0014494A1A83001E' }}
      XCODE_ORG_ID: ${{ vars.IOS_XCODE_ORG_ID || '792GZF4XQ4' }}
      UPDATED_WDA_BUNDLE_ID: ${{ vars.IOS_UPDATED_WDA_BUNDLE_ID || 'com.feei.WebDriverAgentRunner' }}
      NODE_OPTIONS: --max-old-space-size=1024
      NO_PROXY: 127.0.0.1,localhost,${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''

    steps:
      - name: Check push token
        env:
          WORKFLOW_TRIGGER_PAT: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
        run: |
          if [ -z "${WORKFLOW_TRIGGER_PAT:-}" ]; then
            echo "::error::WORKFLOW_TRIGGER_PAT 未配置"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare runner
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          git config user.name "FeeiCN[bot]"
          git config user.email "feei@feei.cn"
          git config --global http.version HTTP/1.1
          if git rev-parse --verify "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          fi

      - name: Resolve tasks
        id: tasks
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ github.event.inputs.task }}
        run: |
          if [ "${EVENT_NAME}" = "schedule" ]; then
            case "${EVENT_SCHEDULE}" in
              "0 22 * * *") tasks="account-assets" ;;
              "10 22 * * *") tasks="hk-ipo" ;;
              "30 * * * *") tasks="health" ;;
              *)
                echo "::error::未知 schedule: ${EVENT_SCHEDULE}"
                exit 1
                ;;
            esac
          else
            case "${INPUT_TASK:-all}" in
              all) tasks="account-assets hk-ipo health" ;;
              account-assets|hk-ipo|health) tasks="${INPUT_TASK}" ;;
              *)
                echo "::error::未知 task: ${INPUT_TASK}"
                exit 1
                ;;
            esac
          fi

          echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
          echo "Resolved tasks: ${tasks}"

      - name: Ensure Health Auto Export server
        if: contains(steps.tasks.outputs.tasks, 'health')
        env:
          HAE_HOST: ${{ vars.HAE_HOST }}
          HAE_PORT: ${{ vars.HAE_PORT }}
        run: |
          python3 scripts/check_ios_automation_device.py --udid "$IOS_DEVICE_UDID"

          if /opt/homebrew/bin/node scripts/health_auto_export_mcp_server.mjs --check; then
            exit 0
          fi
          echo "Health Auto Export 无响应，正在通过 Appium 重启服务器"

          if ! curl -fsS "${APPIUM_URL%/}/status" >/dev/null 2>&1; then
            mkdir -p "$HOME/Library/Logs"
            nohup appium --address "$APPIUM_HOST" --port "$APPIUM_PORT" > "$HOME/Library/Logs/FEEI.CN-ios-appium.log" 2>&1 &
            for _ in $(seq 1 30); do
              if curl -fsS "${APPIUM_URL%/}/status" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
          fi
          curl -fsS "${APPIUM_URL%/}/status" >/dev/null

          python3 scripts/ios_appium_capture.py \
            --health-server-only \
            --appium-url "$APPIUM_URL" \
            --udid "$IOS_DEVICE_UDID" \
            --xcode-org-id "$XCODE_ORG_ID" \
            --updated-wda-bundle-id "$UPDATED_WDA_BUNDLE_ID" \
            --allow-provisioning-updates \
            --restart-health-server \
            --new-command-timeout 600

          /opt/homebrew/bin/node scripts/health_auto_export_mcp_server.mjs --check

      - name: Run selected tasks
        env:
          TASKS: ${{ steps.tasks.outputs.tasks }}
          HAE_HOST: ${{ vars.HAE_HOST }}
          HAE_PORT: ${{ vars.HAE_PORT }}
          HAE_TIMEOUT: ${{ vars.HAE_TIMEOUT }}
        run: |
          /usr/bin/python3 <<'PY'
          import fcntl
          import os
          import subprocess
          import sys
          from pathlib import Path

          commands = {
              "account-assets": (["/usr/bin/python3", "scripts/account_assets.py"], "FEEI.CN-account-assets.log"),
              "hk-ipo": (["/usr/bin/python3", "scripts/hk_ipo.py"], "FEEI.CN-hk-ipo.log"),
              "health": (["/opt/homebrew/bin/node", "scripts/sync_health_data.mjs"], "FEEI.CN-sync-health.log"),
          }
          required_env = {
              "health": ["HAE_HOST", "HAE_PORT"],
          }
          tasks = os.environ["TASKS"].split()
          log_dir = Path.home() / "Library" / "Logs"
          log_dir.mkdir(parents=True, exist_ok=True)

          for task in tasks:
              missing = [name for name in required_env.get(task, []) if not os.environ.get(name)]
              if missing:
                  print(f"::error::{task} 缺少 GitHub Variables: {', '.join(missing)}")
                  sys.exit(1)

          with open("/tmp/FEEI.CN-data-sync.lock", "w", encoding="utf-8") as lock:
              print("Waiting for FEEI.CN data sync lock...")
              fcntl.flock(lock, fcntl.LOCK_EX)
              print("Acquired FEEI.CN data sync lock.")

              for task in tasks:
                  command, log_name = commands[task]
                  log_path = log_dir / log_name
                  print(f"Running {task}: {' '.join(command)}")
                  with log_path.open("a", encoding="utf-8") as log_file:
                      process = subprocess.Popen(
                          command,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True,
                          encoding="utf-8",
                          errors="replace",
                      )
                      assert process.stdout is not None
                      for line in process.stdout:
                          print(line, end="")
                          log_file.write(line)
                      status = process.wait()
                  if status != 0:
                      sys.exit(status)
          PY
