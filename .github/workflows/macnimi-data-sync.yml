name: Mac mini 数据同步

# 使用本机 self-hosted runner（label: macnimi）替代原 crontab：
# - 北京时间每天 06:00 更新账户资产数据（UTC 22:00）
# - 北京时间每天 06:10 更新港股打新数据（UTC 22:10）
# - 每小时 30 分同步健康数据

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '10 22 * * *'
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '需要运行的任务'
        required: true
        default: all
        type: choice
        options:
          - all
          - account-assets
          - hk-ipo
          - health

permissions:
  contents: write

jobs:
  resolve:
    name: 选择同步任务
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
    steps:
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ inputs.task }}
        run: |
          python3 - <<'PYTASKS'
          import json, os
          schedules = {'0 22 * * *': 'account-assets', '10 22 * * *': 'hk-ipo', '30 * * * *': 'health'}
          if os.environ['EVENT_NAME'] == 'schedule':
              task = schedules[os.environ['EVENT_SCHEDULE']]
          else:
              task = os.environ.get('INPUT_TASK') or 'all'
          tasks = ['account-assets', 'hk-ipo', 'health'] if task == 'all' else [task]
          if any(task not in schedules.values() for task in tasks):
              raise SystemExit('未知同步任务')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('tasks=' + json.dumps(tasks) + '\n')
          PYTASKS

  sync:
    name: 同步 ${{ matrix.task }}
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task: ${{ fromJSON(needs.resolve.outputs.tasks) }}
    runs-on: [self-hosted, macnimi]
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      APPIUM_HOST: ${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}
      APPIUM_PORT: ${{ vars.IOS_APPIUM_PORT || '4723' }}
      APPIUM_URL: http://${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}:${{ vars.IOS_APPIUM_PORT || '4723' }}
      IOS_DEVICE_UDID: ${{ vars.IOS_DEVICE_UDID || '00008101-0014494A1A83001E' }}
      XCODE_ORG_ID: ${{ vars.IOS_XCODE_ORG_ID || '792GZF4XQ4' }}
      UPDATED_WDA_BUNDLE_ID: ${{ vars.IOS_UPDATED_WDA_BUNDLE_ID || 'com.feei.WebDriverAgentRunner' }}
      NODE_OPTIONS: --max-old-space-size=1024
      NO_PROXY: 127.0.0.1,localhost,${{ vars.IOS_APPIUM_HOST || '127.0.0.1' }}
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''

    steps:
      - name: Check push token
        env:
          WORKFLOW_TRIGGER_PAT: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
        run: |
          if [ -z "${WORKFLOW_TRIGGER_PAT:-}" ]; then
            echo "::error::WORKFLOW_TRIGGER_PAT 未配置"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare runner
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          git config user.name "FeeiCN[bot]"
          git config user.email "feei@feei.cn"
          git config --global http.version HTTP/1.1
          if git rev-parse --verify "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            git checkout -B main origin/main
          fi

      - name: Ensure Health Auto Export server
        id: health_service
        if: matrix.task == 'health'
        env:
          HAE_HOST: ${{ vars.HAE_HOST }}
          HAE_PORT: ${{ vars.HAE_PORT }}
        run: |
          test -n "$HAE_HOST" && test -n "$HAE_PORT" || { echo "::error::请配置 HAE_HOST 和 HAE_PORT"; exit 1; }
          if /opt/homebrew/bin/node scripts/health_auto_export_mcp_server.mjs --check; then
            exit 0
          fi
          echo "Health Auto Export 无响应，正在检查设备并恢复服务"
          python3 scripts/check_ios_automation_device.py --udid "$IOS_DEVICE_UDID"

          if ! curl -fsS "${APPIUM_URL%/}/status" >/dev/null 2>&1; then
            mkdir -p "$HOME/Library/Logs"
            nohup appium --address "$APPIUM_HOST" --port "$APPIUM_PORT" > "$HOME/Library/Logs/FEEI.CN-ios-appium.log" 2>&1 &
            for _ in $(seq 1 30); do
              if curl -fsS "${APPIUM_URL%/}/status" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
          fi
          curl -fsS "${APPIUM_URL%/}/status" >/dev/null

          python3 scripts/ios_appium_capture.py \
            --health-server-only \
            --appium-url "$APPIUM_URL" \
            --udid "$IOS_DEVICE_UDID" \
            --xcode-org-id "$XCODE_ORG_ID" \
            --updated-wda-bundle-id "$UPDATED_WDA_BUNDLE_ID" \
            --show-xcode-log \
            --allow-provisioning-updates \
            --restart-health-server \
            --new-command-timeout 600

          for _ in $(seq 1 15); do
            if /opt/homebrew/bin/node scripts/health_auto_export_mcp_server.mjs --check; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Health Auto Export 在 30 秒内未就绪"
          exit 1

      - name: 收集健康自动化构建错误
        if: failure() && steps.health_service.outcome == 'failure'
        run: |
          shopt -s nullglob
          logs=("$HOME/Library/Logs/"*appium*.log /tmp/*appium*.log)
          appium_pid="$(lsof -nP -iTCP:"$APPIUM_PORT" -sTCP:LISTEN -t | head -n 1)"
          if [ -n "$appium_pid" ]; then
            while IFS= read -r line; do
              if [[ "$line" == n/* ]] && [ -f "${line#n}" ]; then logs+=("${line#n}"); fi
            done < <(lsof -a -p "$appium_pid" -d 1,2 -Fn)
          fi
          for log in "${logs[@]}"; do
            echo "Xcode/Appium 构建错误：$(basename "$log")"
            tail -n 600 "$log" | grep -Ei 'error:|code 65|provisioning profile|device.*locked|signing.*failed|certificate.*expired' | tail -n 30 || true
          done

      - name: 同步当前任务
        id: task
        env:
          TASKS: ${{ matrix.task }}
          HAE_HOST: ${{ vars.HAE_HOST }}
          HAE_PORT: ${{ vars.HAE_PORT }}
          HAE_TIMEOUT: '180000'
          HEALTH_AUTO_EXPORT_MCP_TIMEOUT: '240000'
        run: |
          /usr/bin/python3 <<'PY'
          import fcntl
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path
          from urllib.request import urlopen

          commands = {
              "account-assets": (["/usr/bin/python3", "scripts/account_assets.py"], "FEEI.CN-account-assets.log"),
              "hk-ipo": (["/usr/bin/python3", "scripts/hk_ipo.py"], "FEEI.CN-hk-ipo.log"),
              "health": (["/opt/homebrew/bin/node", "scripts/sync_health_data.mjs"], "FEEI.CN-sync-health.log"),
          }
          required_env = {
              "health": ["HAE_HOST", "HAE_PORT"],
          }
          tasks = os.environ["TASKS"].split()
          log_dir = Path.home() / "Library" / "Logs"
          log_dir.mkdir(parents=True, exist_ok=True)

          def run_logged(command, log_path):
              print(f"Running: {' '.join(command)}")
              with log_path.open("a", encoding="utf-8") as log_file:
                  process = subprocess.Popen(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                  )
                  assert process.stdout is not None
                  for line in process.stdout:
                      print(line, end="")
                      log_file.write(line)
                  return process.wait()

          for task in tasks:
              missing = [name for name in required_env.get(task, []) if not os.environ.get(name)]
              if missing:
                  print(f"::error::{task} 缺少 GitHub Variables: {', '.join(missing)}")
                  sys.exit(1)

          with open("/tmp/FEEI.CN-data-sync.lock", "w", encoding="utf-8") as lock:
              print("Waiting for FEEI.CN data sync lock...")
              fcntl.flock(lock, fcntl.LOCK_EX)
              print("Acquired FEEI.CN data sync lock.")

              for task in tasks:
                  command, log_name = commands[task]
                  log_path = log_dir / log_name
                  status = run_logged(command, log_path)
                  if status != 0 and task == "health":
                      print("健康同步失败，重启 Health Auto Export 后重试一次")
                      try:
                          urlopen(f"{os.environ['APPIUM_URL'].rstrip('/')}/status", timeout=2).read()
                      except Exception:
                          appium_log = log_dir / "FEEI.CN-ios-appium.log"
                          with appium_log.open("a", encoding="utf-8") as appium_output:
                              subprocess.Popen(
                                  ["appium", "--address", os.environ["APPIUM_HOST"], "--port", os.environ["APPIUM_PORT"]],
                                  stdout=appium_output,
                                  stderr=subprocess.STDOUT,
                              )
                          for _ in range(30):
                              try:
                                  urlopen(f"{os.environ['APPIUM_URL'].rstrip('/')}/status", timeout=2).read()
                                  break
                              except Exception:
                                  time.sleep(2)
                      recovery = [
                          "python3", "scripts/ios_appium_capture.py", "--health-server-only",
                          "--appium-url", os.environ["APPIUM_URL"],
                          "--udid", os.environ["IOS_DEVICE_UDID"],
                          "--xcode-org-id", os.environ["XCODE_ORG_ID"],
                          "--updated-wda-bundle-id", os.environ["UPDATED_WDA_BUNDLE_ID"],
                          "--show-xcode-log",
                          "--allow-provisioning-updates",
                          "--restart-health-server", "--new-command-timeout", "600",
                      ]
                      if run_logged(recovery, log_path) == 0:
                          status = run_logged(command, log_path)
                  if status != 0:
                      sys.exit(status)
          PY

      - name: 记录本任务结果
        if: always()
        env:
          TASK: ${{ matrix.task }}
          RESULT: ${{ steps.task.outcome }}
        run: |
          {
            echo "### $TASK"
            if [ "$RESULT" = "success" ]; then
              echo "同步成功。"
            else
              echo "同步未完成，请查看本任务的设备、服务或导出步骤。其他同步任务独立执行。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
