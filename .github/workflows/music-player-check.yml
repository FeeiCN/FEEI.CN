name: 音乐播放器检查

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/GlobalMusicPlayer/**'
      - 'src/components/MusicLibrary/**'
      - 'src/components/MusicTrackPlayer/**'
      - 'src/theme/Root.tsx'
      - 'src/pages/my-playlist.tsx'
      - 'docs/**/04-音乐/**'
      - 'scripts/*music*.mjs'
      - '.github/workflows/music-player-check.yml'
  pull_request:
    paths:
      - 'src/components/GlobalMusicPlayer/**'
      - 'src/components/MusicLibrary/**'
      - 'src/components/MusicTrackPlayer/**'
      - 'src/theme/Root.tsx'
      - 'src/pages/my-playlist.tsx'
      - 'docs/**/04-音乐/**'
      - 'scripts/*music*.mjs'
      - '.github/workflows/music-player-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-player-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 开始任务状态
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: 更新阶段：验证结果
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: verifying
      - name: Type check
        run: npm run typecheck
      - name: Check docs
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: npm run check:docs -- --base="$DOCS_BASE"
      - name: Build website
        run: DOCUSAURUS_FASTER=true CI_STRICT=true npm run build
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/music-browser" --no-package-lock --ignore-scripts playwright@1.55.1
          "$RUNNER_TEMP/music-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regression
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/music-browser/node_modules/playwright/index.mjs
        run: |
          python3 -m http.server 4173 --directory build >/tmp/music-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node scripts/test_music_player_browser.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-player-screenshots
          path: .music-player-test/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: 完成任务状态
        if: always() && hashFiles('.github/actions/workflow-status/action.yml') != ''
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30
