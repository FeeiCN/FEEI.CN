name: 个人健康趋势研究

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-personal-health-trend-research
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_PERSONAL_HEALTH_TREND_RESEARCH == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: personal-health-trend-research
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/SKILL/个人健康趋势分析.md
      delivery: issue
    secrets: inherit
