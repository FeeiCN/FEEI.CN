name: Refactor PBC4 four layers v2
on:
  push:
    paths: ['.github/workflows/refactor-pbc4-four-layer-v2.yml']
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/01-网络空间安全/01-安全工程/03-安全体系/03-安全合法合规/人民银行网络安全事件报告管理办法.md')
          s=p.read_text()
          ref=s.index('## Reference · 法规原文')
          head,tail=s[:ref],s[ref:]
          head=head.replace('法规要求（含条款）→ 怎么落实 → 交付物与完成标准 → 灵魂拷问 → 验收方式','法规要求（含条款）→ 怎么落实 → 做到什么程度 → 怎么检查')
          head=head.replace('**交付物与完成标准。**','**做到什么程度。**')
          head=head.replace('**灵魂拷问。**','**怎么检查。**')
          # Fold acceptance material into the preceding inspection section without brittle section regexes.
          head=re.sub(r'\n\*\*验收方式。\*\*\s*([^\n]+)', lambda m: '\n- **重点核验：** '+m.group(1).strip(), head)
          head=re.sub(r'(\*\*做到什么程度。\*\*\s*)交付物：',r'\1应形成',head)
          head=head.replace('每项要求的灵魂拷问和验收方式已在前文列出','每项要求的具体检查方法已在前文列出')
          head=head.replace('### 判断验收材料和替代实现 {#evidence-rules}','### 判断检查证据和替代实现 {#evidence-rules}')
          head=head.replace('验收材料应说明来源、对象、发生时间、覆盖期间和关联关系，并结合抽样、反向核对或现场测试支持对应事实。','检查证据应说明来源、对象、发生时间、覆盖期间和关联关系，并结合抽样、反向核对或现场测试支持对应事实。')
          head=head.replace('验收材料引用和独立结论','检查证据引用和独立结论').replace('验收材料位置：','检查证据位置：')
          # Safety assertions: all former five-layer labels must be gone from implementation part.
          for x in ['**交付物与完成标准。**','**灵魂拷问。**','**验收方式。**']:
              if x in head: raise SystemExit('residual label: '+x)
          if head.count('**怎么检查。**') < 10: raise SystemExit('too few inspection sections')
          if not s.startswith('---\n'): raise SystemExit('front matter missing before edit')
          out=head+tail
          if not out.startswith('---\n') or len(out) < 20000: raise SystemExit('output integrity failed')
          p.write_text(out)
          PY
      - name: Commit
        run: |
          git config user.name Feei
          git config user.email feei@feei.cn
          git add 'docs/01-网络空间安全/01-安全工程/03-安全体系/03-安全合法合规/人民银行网络安全事件报告管理办法.md'
          git commit -m 'docs: simplify PBC order 4 guidance structure'
          git push origin HEAD:main