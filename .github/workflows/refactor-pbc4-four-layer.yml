name: Refactor PBC4 four layers
on:
  push:
    paths:
      - '.github/workflows/refactor-pbc4-four-layer.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/01-网络空间安全/01-安全工程/03-安全体系/03-安全合法合规/人民银行网络安全事件报告管理办法.md')
          s=p.read_text()
          ref=s.index('## Reference · 法规原文')
          head, tail=s[:ref], s[ref:]
          head=head.replace('**“法规要求（含条款）→ 怎么落实 → 交付物与完成标准 → 灵魂拷问 → 验收方式”**', '**“法规要求（含条款）→ 怎么落实 → 做到什么程度 → 怎么检查”**')
          head=head.replace('每项要求的灵魂拷问和验收方式已在前文列出', '每项要求的具体检查方法已在前文列出')
          # Merge each pair: 完成标准 + 灵魂拷问 + 验收方式 => 做到什么程度 + 怎么检查
          head=head.replace('**交付物与完成标准。**', '**做到什么程度。**')
          # Remove the redundant label "交付物：" while preserving the concrete deliverables as part of Done.
          head=re.sub(r'(\*\*做到什么程度。\*\* )交付物：', r'\1应形成', head)
          # Merge 灵魂拷问 and 验收方式. The questions remain the main inspection list; acceptance evidence becomes final inspection bullets.
          pattern=re.compile(r'\*\*灵魂拷问。\*\*\n\n(?P<qs>(?:- .*\n)+)\n\*\*验收方式。\*\* (?P<acc>.*?)(?=\n\n(?:#### |### |## ))', re.S)
          def repl(m):
              qs=m.group('qs').rstrip()
              acc=' '.join(m.group('acc').strip().splitlines())
              return '**怎么检查。**\n\n'+qs+'\n- 检查材料与验证：'+acc
          head,n=pattern.subn(repl,head)
          if n < 10:
              raise SystemExit(f'only merged {n} sections')
          # Global wording in assurance section: keep it about inspection, not a fifth conceptual layer.
          head=head.replace('### 判断验收材料和替代实现 {#evidence-rules}', '### 判断检查证据和替代实现 {#evidence-rules}')
          head=head.replace('验收材料应说明来源、对象、发生时间、覆盖期间和关联关系，并结合抽样、反向核对或现场测试支持对应事实。', '检查证据应说明来源、对象、发生时间、覆盖期间和关联关系，并结合抽样、反向核对或现场测试支持对应事实。')
          head=head.replace('验收材料引用和独立结论', '检查证据引用和独立结论')
          head=head.replace('验收材料位置：', '检查证据位置：')
          head=head.replace('证据位置和复核人', '检查材料位置和复核人')
          p.write_text(head+tail)
          PY
      - name: Commit
        run: |
          git config user.name 'Feei'
          git config user.email 'feei@feei.cn'
          git add 'docs/01-网络空间安全/01-安全工程/03-安全体系/03-安全合法合规/人民银行网络安全事件报告管理办法.md'
          git commit -m 'docs: simplify PBC order 4 into four-layer guidance'
          git push origin HEAD:main