name: Refactor PBC4 three layers
on:
  push:
    paths: ['.github/workflows/refactor-pbc4-three-layer.yml']
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor article
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/01-网络空间安全/01-安全工程/03-安全体系/03-安全合法合规/人民银行网络安全事件报告管理办法.md')
          s=p.read_text()
          ref=s.index('## Reference · 法规原文')
          head,tail=s[:ref],s[ref:]
          head=head.replace('法规要求（含条款）→ 怎么落实 → 做到什么程度 → 怎么检查','法规要求（含条款）→ 落实要求 → 怎么检查')
          # Merge implementation method and completion state into one control-design layer.
          head=head.replace('**怎么落实。**','**落实要求。**')
          head=re.sub(r'\n\n\*\*做到什么程度。\*\*\s*', '\n\n', head)
          # Remove the hidden fifth concept left by the previous version: fold evidence into inspection wording.
          head=head.replace('- **重点核验：** ','- 核查')
          # Opening table should use the same mental model rather than reintroducing deliverables as a top-level concept.
          head=head.replace('| 工作主题 | 建议交付成果 | 建议牵头与参与方 |','| 工作主题 | 落实重点 | 建议牵头与参与方 |')
          head=head.replace('这些分工和成果名称可按机构调整。','这些分工和落实方式可按机构调整。')
          # Keep the assurance section aligned with the three-layer model.
          head=head.replace('每项要求只在本节完整说明，后面的检查章节统一规定取样、测试和结论方法，不再复制另一份要求清单。','每项要求只在本节完整说明：先明确法规要求，再给出完整落实要求，最后说明怎么检查。后面的检查章节只统一规定取样、测试和结论方法，不再复制另一份要求清单。')
          for x in ['**怎么落实。**','**做到什么程度。**','**交付物与完成标准。**','**灵魂拷问。**','**验收方式。**','- **重点核验：**']:
              if x in head: raise SystemExit('residual concept: '+x)
          if head.count('**落实要求。**') < 10 or head.count('**怎么检查。**') < 10:
              raise SystemExit('three-layer sections incomplete')
          out=head+tail
          if not out.startswith('---\n') or len(out) < 20000 or '## Reference · 法规原文' not in out:
              raise SystemExit('output integrity failed')
          p.write_text(out)
          PY
      - name: Commit
        run: |
          git config user.name Feei
          git config user.email feei@feei.cn
          git add 'docs/01-网络空间安全/01-安全工程/03-安全体系/03-安全合法合规/人民银行网络安全事件报告管理办法.md'
          git commit -m 'docs: simplify PBC order 4 into requirement control test model'
          git push origin HEAD:main