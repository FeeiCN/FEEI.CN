name: 安全架构与防御创新

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 2"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-security-architecture-defense
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_SECURITY_ARCHITECTURE_DEFENSE == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: security-architecture-defense
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/SKILL/安全架构与防御研究.md
      delivery: issue
    secrets: inherit
