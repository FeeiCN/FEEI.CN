name: 安全事件动态提醒

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-security-event-alerts
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_SECURITY_EVENT_ALERTS == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: security-event-alerts
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/SKILL/安全事件动态提醒.md
      delivery: issue
    secrets: inherit
