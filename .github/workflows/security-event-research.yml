name: 安全事件研究复盘

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: automation-security-event-research
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_SECURITY_EVENT_RESEARCH == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: security-event-research
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/定时任务/安全事件研究复盘任务提示词.md
      delivery: issue
    secrets: inherit
