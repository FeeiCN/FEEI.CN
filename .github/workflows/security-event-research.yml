name: 安全事件研究复盘

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 仅生成研究结果并写入 Issue，不修改仓库
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: security-event-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate designated task
        run: |
          python3 - <<'PY'
          import yaml
          data = yaml.safe_load(open("automation/registry.yml", encoding="utf-8"))
          task = next(x for x in data["tasks"] if x["id"] == "security-event-research")
          assert task["designation"].startswith("explicit_user_confirmation_")
          assert task["execution_mode"] == "read_only_research"
          assert task["writes_repository"] is False
          print("designated read-only task validated")
          PY

      - name: Prepare research prompt
        run: |
          cat > /tmp/prompt.md <<'EOF'
          你正在执行 FEEI.CN 的“安全事件研究复盘”只读 dry-run。

          目标：研究一个公开披露的真实安全事件（优先 Binance、Bybit、TiDB 等高质量案例），形成可发布的中文复盘草稿，重点还原攻击流程、关键证据、根因、检测与防御改进。

          要求：
          1. 每次只选一个公开安全事件，至少使用两类独立来源，区分事实、推断和未知，并给出来源链接和证据质量。
          2. 用一张简单易懂的 Mermaid 流程图还原攻击链路，不使用 SVG。
          3. 去掉 AI 套话，写成适合 feei.cn 的自然中文文章，完整到可供人工审核。
          4. 不提交代码、不修改仓库、不执行交易或生产操作。
          5. 输出标题、摘要、正文、Mermaid 图、证据清单、待核验项，以及是否值得发布的建议。
          6. 结果会写入 GitHub Issue，等待人工修改和批准。
          EOF

      - name: Run read-only research
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}/responses
          prompt-file: /tmp/prompt.md
          output-file: /tmp/result.md
          sandbox: read-only
          model: ${{ secrets.OPENAI_MODEL }}
          effort: high

      - name: Publish dry-run result to Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "<!-- automation-task:security-event-research -->"
            echo "<!-- status:awaiting-review -->"
            echo
            echo "# 安全事件研究复盘 · dry-run"
            echo
            echo "- 任务：security-event-research"
            echo "- 运行时间：$(date -u +%FT%TZ)"
            echo "- 模式：只读研究，不修改仓库"
            echo
            cat /tmp/result.md
          } > /tmp/issue.md
          gh issue create --repo "$REPO"             --title "[自动研究] 安全事件研究复盘 · $(date -u '+%Y-%m-%d %H:%M UTC')"             --body-file /tmp/issue.md
