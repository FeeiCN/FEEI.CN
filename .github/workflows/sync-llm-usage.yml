name: Sync LLM usage

# 每天北京时间 07:00（UTC 23:00）抓取 LLM token 消耗摘要并提交。
# 凭证缺失或脚本失败不阻塞后续步骤，便于 credentials 还在补齐时静默重试。

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: sync-llm-usage
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check credentials
        run: |
          if [ -z "${MINIMAX_COOKIE:-}" ] || [ -z "${MINIMAX_GROUP_ID:-}" ]; then
            echo "MINIMAX_COOKIE / MINIMAX_GROUP_ID 未配置，跳过本次抓取"
            echo "skip=no_credentials" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi
        env:
          MINIMAX_COOKIE: ${{ secrets.MINIMAX_COOKIE }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
        id: creds

      - name: Run sync script
        if: steps.creds.outputs.skip == 'no'
        env:
          MINIMAX_COOKIE: ${{ secrets.MINIMAX_COOKIE }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
        run: |
          python3 scripts/sync_llm_usage.py

      - name: Commit and push
        if: steps.creds.outputs.skip == 'no'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- 'static/llm-usage/' 'docs/05-吴飞飞/01-关于/关于FEEI.CN/FEEI.CN状态.md')" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git add -- 'static/llm-usage/' 'docs/05-吴飞飞/01-关于/关于FEEI.CN/FEEI.CN状态.md'
          timestamp="$(date -u '+%Y-%m-%d %H:%M')"
          git commit -m "更新 LLM token 消耗摘要 (${timestamp})"
          git push
