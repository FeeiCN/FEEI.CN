name: Sync LLM usage

# 每天北京时间 07:00（UTC 23:00）抓取 LLM token 消耗摘要并提交。
# 凭证缺失或脚本失败不阻塞后续步骤，便于 credentials 还在补齐时静默重试。

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: sync-llm-usage
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}

      - name: Check credentials
        run: |
          if [ -z "${MINIMAX_COOKIE:-}" ] \
              && [ -z "${ANTHROPIC_ADMIN_KEY:-}" ] \
              && [ -z "${OPENAI_ADMIN_KEY:-}" ]; then
            echo "所有 vendor 凭证都未配置，跳过本次抓取"
            echo "skip=no_credentials" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi
        env:
          MINIMAX_COOKIE: ${{ secrets.MINIMAX_COOKIE }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        id: creds

      - name: Run sync script
        if: steps.creds.outputs.skip == 'no'
        env:
          MINIMAX_COOKIE: ${{ secrets.MINIMAX_COOKIE }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: |
          python3 scripts/sync_llm_usage.py
