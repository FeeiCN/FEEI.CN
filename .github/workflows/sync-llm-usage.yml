name: 大模型用量同步

# 每天北京时间 07:10、22:45 抓取 LLM token 消耗摘要并提交。
# 未配置的可选来源跳过；已配置来源失败时保留其他成功数据并明确报错。

on:
  schedule:
    - cron: '10 23 * * *'
    - cron: '45 14 * * *'
  workflow_dispatch:

concurrency:
  group: sync-llm-usage
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}
          ref: main

      - name: Run sync script
        env:
          MINIMAX_COOKIE: ${{ secrets.MINIMAX_COOKIE }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: |
          python3 scripts/sync_llm_usage.py

      - name: 保存逐来源同步状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-sync-status-${{ github.run_id }}
          path: ${{ runner.temp }}/llm-sync-status.json
          if-no-files-found: ignore
          retention-days: 30
