name: Sync security engineering

on:
  push:
    branches:
      - main
    paths:
      - 'docs/02-事业有成/01-安全工程/**'
  workflow_dispatch:

concurrency:
  group: sync-security-engineering
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: FeeiCN/security-engineering

    steps:
      - name: Check sync token
        run: |
          if [ -z "${SECURITY_ENGINEERING_SYNC_TOKEN}" ]; then
            echo "SECURITY_ENGINEERING_SYNC_TOKEN is not configured"
            exit 1
          fi
        env:
          SECURITY_ENGINEERING_SYNC_TOKEN: ${{ secrets.SECURITY_ENGINEERING_SYNC_TOKEN }}

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: master
          persist-credentials: false
          path: target

      - name: Sync content
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            "source/docs/02-事业有成/01-安全工程/" \
            "target/"

      - name: Commit and push
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync"
            exit 0
          fi

          git add -A
          git commit -m "同步安全工程内容"
          git push "https://x-access-token:${SECURITY_ENGINEERING_SYNC_TOKEN}@github.com/${TARGET_REPOSITORY}.git" HEAD:master
        env:
          SECURITY_ENGINEERING_SYNC_TOKEN: ${{ secrets.SECURITY_ENGINEERING_SYNC_TOKEN }}
