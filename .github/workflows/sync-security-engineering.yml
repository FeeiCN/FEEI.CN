name: 安全工程内容同步

on:
  push:
    branches:
      - main
    paths:
      - 'docs/01-网络安全/01-网络空间安全/**'
      - 'docs/01-网络安全/02-人工智能安全/**'
  workflow_dispatch:

concurrency:
  group: sync-security-engineering
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: FeeiCN/security-engineering

    steps:
      - name: Check sync token
        run: |
          if [ -z "${SECURITY_ENGINEERING_SYNC_TOKEN}" ]; then
            echo "SECURITY_ENGINEERING_SYNC_TOKEN is not configured"
            exit 1
          fi
        env:
          SECURITY_ENGINEERING_SYNC_TOKEN: ${{ secrets.SECURITY_ENGINEERING_SYNC_TOKEN }}

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: source

      - name: 开始任务状态
        uses: ./source/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: master
          persist-credentials: false
          path: target

      - name: 更新阶段：执行任务
        uses: ./source/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: running
      - name: Sync content
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            "source/docs/01-网络安全/01-网络空间安全/" \
            "target/"
          mkdir -p "target/03-安全体系/AI安全"
          rsync -a --delete \
            "source/docs/01-网络安全/02-人工智能安全/" \
            "target/03-安全体系/AI安全/"

      - name: 更新阶段：交付结果
        uses: ./source/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: delivering
      - name: Commit and push
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync"
            exit 0
          fi

          git add -A
          git commit -m "同步安全工程内容"
          git push "https://x-access-token:${SECURITY_ENGINEERING_SYNC_TOKEN}@github.com/${TARGET_REPOSITORY}.git" HEAD:master
        env:
          SECURITY_ENGINEERING_SYNC_TOKEN: ${{ secrets.SECURITY_ENGINEERING_SYNC_TOKEN }}

      - name: 记录同步结果
        if: always() && hashFiles('source/scripts/workflow_delivery.py') != ''
        env:
          RESULT: ${{ job.status }}
        run: |
          python3 source/scripts/workflow_delivery.py --operation sync --state "$RESULT" \
            --title '安全工程内容同步完成。' \
            --link "https://github.com/${TARGET_REPOSITORY}/tree/master" \
            --output /tmp/security-sync-delivery.md
      - name: 完成任务状态
        if: always() && hashFiles('source/.github/actions/workflow-status/action.yml') != ''
        uses: ./source/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30
