name: 微信读书数据同步

# 每天北京时间 02:17（UTC 18:17）拉取微信读书数据并提交。
# 凭证缺失静默跳过；token 失效（exit 2）显式失败便于看到通知。

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '完整模式：全量 notebooks/shelf + 所有未拉的历史月度 + 348 本逐个 delta 检测'
        required: false
        default: 'false'
      include_snapshots:
        description: '一并刷新 recommend / search 关键词快照（仅在 full=true 时有效）'
        required: false
        default: 'false'

concurrency:
  group: sync-weread-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_TRIGGER_PAT }}

      - name: 开始任务状态
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check credentials
        id: creds
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: |
          if [ -z "${WEREAD_API_KEY:-}" ]; then
            echo "WEREAD_API_KEY 未配置，跳过本次抓取"
            echo "skip=no_credentials" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新阶段：执行任务
        if: steps.creds.outputs.skip == 'no'
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: running
      - name: Run export script
        if: steps.creds.outputs.skip == 'no'
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          FULL: ${{ github.event.inputs.full }}
          INCLUDE_SNAPSHOTS: ${{ github.event.inputs.include_snapshots }}
        run: |
          args=()
          if [ "${FULL:-false}" = "true" ]; then
            args+=(--full)
            if [ "${INCLUDE_SNAPSHOTS:-false}" = "true" ]; then
              args+=(--include-snapshots)
            fi
          fi
          python3 scripts/export_weread_data.py "${args[@]}"
      - name: 完成任务状态
        if: always() && hashFiles('.github/actions/workflow-status/action.yml') != ''
        uses: ./.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30
