name: 更新体重壁纸

on:
  workflow_dispatch:
    inputs:
      review_issue:
        description: 原壁纸 Issue 编号（由议题驱动器传入）
        required: false
        default: ''
        type: string
      review_comment:
        description: 本人重做请求的评论 ID
        required: false
        default: ''
        type: string
      review_request_digest:
        description: 本人请求的校验摘要
        required: false
        default: ''
        type: string
  schedule:
    - cron: "0 1 * * 0"

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: automation-update-weight-wallpaper
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.AUTOMATION_UPDATE_WEIGHT_WALLPAPER == 'true' }}
    uses: ./.github/workflows/automation-task.yml
    with:
      task_id: update-weight-wallpaper
      prompt_source: docs/05-吴飞飞/01-关于/关于FEEI.CN/SKILL/体重壁纸数据整理.md
      delivery: issue
      review_issue: ${{ inputs.review_issue || '' }}
      review_comment: ${{ inputs.review_comment || '' }}
      review_request_digest: ${{ inputs.review_request_digest || '' }}
    secrets: inherit

  publish:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: feei.cn
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      TASK_ID: update-weight-wallpaper
      TASK_PROMPT_SOURCE: ${{ needs.run.outputs.prompt_source }}
      TASK_DELIVERY: issue
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: feei.cn
          ref: main
          persist-credentials: false
      - name: 开始任务状态
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install delivery dependencies
        run: python -m pip install PyYAML Pillow
      - uses: actions/download-artifact@v4
        with:
          name: wallpaper-delivery-${{ github.run_id }}
          path: feei.cn/output
      - name: 保存壁纸下载附件
        id: wallpaper
        if: ${{ hashFiles('feei.cn/output/wallpaper.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: weight-wallpaper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            feei.cn/output/wallpaper.png
            feei.cn/output/wallpaper.svg
          if-no-files-found: error
          retention-days: 30
      - name: 更新阶段：交付结果
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: delivering
      - name: 校验并交付壁纸
        env:
          WALLPAPER_ARTIFACT_ID: ${{ steps.wallpaper.outputs.artifact-id }}
        run: python3 scripts/automation_tasks.py deliver --task "$TASK_ID"

      - name: 保存壁纸交付核验记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-result-${{ github.run_id }}
          path: |
            feei.cn/output/report.md
            feei.cn/output/metadata.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 完成任务状态
        if: always() && hashFiles('feei.cn/.github/actions/workflow-status/action.yml') != ''
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
          result-file: feei.cn/output/metadata.json
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30

  notify-failure:
    needs: [run, publish]
    if: >-
      always() && inputs.review_issue != '' &&
      (needs.run.result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: feei.cn
    steps:
      - uses: actions/checkout@v4
        with:
          path: feei.cn
          ref: main
          persist-credentials: false
      - name: 开始任务状态
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: preparing
          task: ${{ github.job }}
      - name: 更新阶段：交付结果
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: delivering
      - name: 回复壁纸重做未完成
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ISSUE: ${{ inputs.review_issue }}
          REVIEW_COMMENT: ${{ inputs.review_comment }}
          REVIEW_REQUEST_DIGEST: ${{ inputs.review_request_digest }}
        run: |
          python3 - <<'PYFAILURE'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from scheduled_issue_review import wallpaper_request
          repo = os.environ['GITHUB_REPOSITORY']
          try:
              wallpaper_request(repo, os.environ['REVIEW_ISSUE'], os.environ['REVIEW_COMMENT'], os.environ['REVIEW_REQUEST_DIGEST'])
          except ValueError:
              # 请求已变化或已有结果时，不回复过期的失败通知。
              raise SystemExit(0)
          run = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          Path('/tmp/wallpaper-failure.md').write_text(
              '<!-- codex-driver:wallpaper-failed -->\n\n'
              f'本次壁纸重做未完成，请查看[运行记录]({run})。排除原因后，可再次单独评论“重新制作”。\n')
          subprocess.check_call(['gh', 'issue', 'comment', os.environ['REVIEW_ISSUE'], '--repo', repo,
                                 '--body-file', '/tmp/wallpaper-failure.md'])
          PYFAILURE
      - name: 完成任务状态
        if: always() && hashFiles('feei.cn/.github/actions/workflow-status/action.yml') != ''
        uses: ./feei.cn/.github/actions/workflow-status
        continue-on-error: true
        with:
          phase: finished
          state: ${{ job.status }}
          task: ${{ github.job }}
      - name: 保存任务状态
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-status-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/workflow-status/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}-${{ env.WORKFLOW_STATUS_TASK }}.json
          if-no-files-found: ignore
          retention-days: 30
