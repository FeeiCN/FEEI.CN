    - article [ref=f9e266]:
      - generic [ref=f9e267]:
        - heading [level=2] [ref=f9e268]:
          - link "Microsoft’s Patching" [ref=f9e269] [cursor=pointer]:
            - /url: https://www.schneier.com/blog/archives/2026/09/microsofts-patching.html
        - paragraph [ref=f9e270]:
          - text: Once a month, Microsoft pushes a security update to all Windows users. Tomorrow’s is a
          - link "new record" [ref=f9e271] [cursor=pointer]:
            - /url: https://arstechnica.com/security/2026/09/microsoft-patches-a-record-972-vulnerabilities-112-of-them-critical/
          - text: ":"
        - blockquote [ref=f9e272]:
          - paragraph [ref=f9e273]: Microsoft’s patch for September is a doozy, with a record number of roughly 972 vulnerabilities fixed and 112 of them meeting the high critical-severity threshold.
          - paragraph [ref=f9e274]:
            - text: It was only two months ago that Microsoft patched a then-record 570 vulnerabilities. Then, last month, Microsoft patched some 620 of them. Google and other companies have also published record numbers of vulnerabilities in recent months. Two weeks ago, OpenAI, Anthropic, Amazon Web Services, Google, Microsoft, and 100 companies and organizations published an
            - link "open letter" [ref=f9e275] [cursor=pointer]:
              - /url: https://openai.com/collective-cyberdefense
            - text: warning of a narrowing window for patching vulnerabilities ahead of an expected tsunami of AI-enabled attacks that actively exploit them first. The industry is taking the threat seriously by pumping out unprecedented numbers of patches in their software.
        - paragraph [ref=f9e276]: This is the result of AI-powered vulnerability finding, and a good example of AI helping the defenders more than the attackers.
        - paragraph [ref=f9e277]: What will be interesting to watch is how the number of vulnerabilities changes over the next few months. My prediction is that it will continue to increase as the AIs get better at finding software vulnerabilities, and then decrease as they run out of vulnerabilities to find. How high the number gets, how fast the trend reverses, and how quickly it declines after that are all unknown.
        - paragraph [ref=f9e278]: "And Microsoft is right: The window to patch has shrunk to “immediately.” AIs are also good at reverse-engineering exploits from patches, which means that these vulnerabilities will be weaponized as soon as the update is published."
