        - heading [level=2] [ref=f9e233]:
          - link "Using AI for Weapons Development" [ref=f9e234] [cursor=pointer]:
            - /url: https://www.schneier.com/blog/archives/2026/09/using-ai-for-weapons-development.html
        - paragraph [ref=f9e235]:
          - text: Last week, Anthropic released a long and detailed
          - link "document" [ref=f9e236] [cursor=pointer]:
            - /url: https://www-cdn.anthropic.com/e50be2e51e7695dc4b1366a37a245a597377d3b5/Anthropic-Detecting-and-countering-091026.pdf
          - text: "describing current misuses of their Claude models. I’m still reading it, but I wanted to flag this:"
        - blockquote [ref=f9e237]:
          - paragraph [ref=f9e238]: "We identified a cell of threat actors based in northern Yemen running three weapons development programs: a guided rocket that used a commodity phone-class flight computer with final-phase homing guidance; a multi-stage ballistic missile with a stated range goal above 2,000 km; and a multi-variant missile (referred to as the “R2000” set) that included a hypersonic glide vehicle variant."
          - paragraph [ref=f9e239]: "The actors used Claude Code in place of human software engineers to develop the guidance, navigation, and control (GNC) software that steers and stabilizes a flying vehicle. For example, they used Claude to integrate an open-source autopilot onto a phone-class flight computer, writing the control and position estimation software, tuning the control settings, running a firmware build pipeline, and performing a flight simulation. The actors managed several Claude instances at once, assigning each one a role, much as a lead would delegate work on a small engineering team: the actors tasked one instance with writing the code, another with research, and a third with reviewing the code the first instance produced."
          - paragraph [ref=f9e240]: Our safeguards blocked many of their requests, but not all of them. The actors used a variety of tactics to evade our safeguards, including hiding their goals and the products the software was meant for, and they split their work across multiple sessions so no single session revealed their full intent.
          - paragraph [ref=f9e241]: "These actors carried out a sustained effort to develop guided weapons, including using Claude to design guidance software. We do not have evidence the actors succeeded in fielding an operational device; but they did test-fire a guided rocket. This field test appears to have failed: within hours, the actors returned to Claude to work out why it failed."
        - paragraph [ref=f9e242]: Expect more of this. AI systems democratize expertise and capability. Most of the time that’s a good thing, but sometimes it’s not.
