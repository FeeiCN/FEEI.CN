  - generic [ref=f9e43]:
    - paragraph [ref=f9e44]
    - article [ref=f9e45]:
      - generic [ref=f9e46]:
        - heading [level=2] [ref=f9e47]:
          - link "25 Years of Mass Surveillance Is Enough" [ref=f9e48] [cursor=pointer]:
            - /url: https://www.schneier.com/blog/archives/2026/09/25-years-of-mass-surveillance-is-enough.html
        - paragraph [ref=f9e49]:
          - emphasis [ref=f9e50]:
            - text: This essay was written with Cindy Cohn, and originally appeared in
            - link "Lawfare" [ref=f9e51] [cursor=pointer]:
              - /url: https://www.lawfaremedia.org/article/25-years-of-mass-surveillance-is-enough
            - text: .
        - paragraph [ref=f9e52]:
          - text: One of the many legacies of the terrorist attacks of Sept. 11 is the government-wide shift from targeted surveillance—such as individual wiretaps or pen register/trap and trace orders—to mass surveillance techniques—such as tapping into the internet backbone or mass collection of telephone or internet metadata. The legal and technical architecture of modern mass surveillance, initially framed as a necessary defense against terrorist threats, has grown far beyond that justification and national security in general. Mass surveillance is now a routine tool used by law enforcement. ICE uses it in
          - link "immigration actions" [ref=f9e53] [cursor=pointer]:
            - /url: https://www.eff.org/deeplinks/2025/11/rights-organizations-demand-halt-mobile-fortify-ices-handheld-face-recognition
          - text: and against
          - link "people exercising" [ref=f9e54] [cursor=pointer]:
            - /url: https://www.eff.org/deeplinks/2025/11/how-cops-are-using-flock-safetys-alpr-network-surveil-protesters-and-activists
          - text: their First Amendment rights to protest. It’s also increasingly part of private security systems, such as facial recognition at venues such as
          - link "Madison Square Garden" [ref=f9e55] [cursor=pointer]:
            - /url: https://freespeechproject.georgetown.edu/tracker-entries/madison-square-gardens-use-of-facial-recognition-technology-to-bar-certain-lawyers-stirs-protests/
          - text: and networked
          - link "Flock" [ref=f9e56] [cursor=pointer]:
            - /url: https://apnews.com/article/flock-license-plate-cameras-surveillance-deflock-2a93bc075e2f7ffcca9e04a35d75a3fe
          - text: license plate capture systems on roads and in parking lots.
        - paragraph [ref=f9e57]:
          - text: The interrelation between private and governmental mass surveillance is worth examining. Surveillance is the business model of the internet; companies like Google and Facebook constantly
          - link "spy" [ref=f9e58] [cursor=pointer]:
            - /url: https://www.ftc.gov/news-events/news/press-releases/2024/09/ftc-staff-report-finds-large-social-media-video-streaming-companies-have-engaged-vast-surveillance
          - text: on their users’ behavior. From the National Security Agency relying on data collected by telecommunication and internet companies, to local sheriffs and ICE agents relying on cellphone location data and privately managed automatic license plate readers, governments primarily obtain the mass surveillance information through private companies. Increasingly, access doesn’t just come through legal processes, either. FBI Director Kash Patel recently confirmed in congressional
          - link "testimony" [ref=f9e59] [cursor=pointer]:
            - /url: https://fedscoop.com/fbi-data-broker-loophole-purchase-dhs/
          - text: that the agency is purchasing information on Americans from data brokers and intends to continue to do so.
        - paragraph [ref=f9e60]:
          - text: This pipeline from private collection to governmental collection means that as companies collect more information for
          - link "surveillance capitalism" [ref=f9e61] [cursor=pointer]:
            - /url: https://www.hbs.edu/faculty/Pages/item.aspx?num=56791
          - text: purposes, more is available to law enforcement as well. And as the technology for mass surveillance and analysis improves, especially with the increased use of AI technologies, the problems attendant to mass surveillance grow as well.
        - paragraph [ref=f9e62]:
          - text: After 9/11, the idea that the government could surveil the population to safety took hold. In 2001, the fear of terrorism reached a frequency and intensity never before seen. Along with that came the fear that the enemy could be anyone, anywhere. As a result, the government’s response was to watch everyone, everywhere. This line of reasoning underpinned the shift from targeted to mass surveillance. Or, in the words of an internal National Security Agency (NSA)
          - link "presentation" [ref=f9e63] [cursor=pointer]:
            - /url: https://www.justsecurity.org/10396/newly-released-nsa-documents-reveal-omnivorous-appetite-private-data/
          - text: "that was made public as part of Edward Snowden’s 2013 disclosures, a government that can “Collect it All,” “Process it All,” “Exploit it All,” “Partner it All,” and “Sniff it All,” will ultimately, “Know it All.” Similar rationales support the rise of domestic mass surveillance: if law enforcement could see and hear everything, it could more effectively interdict and solve serious crimes."
        - paragraph [ref=f9e64]:
          - text: The national security community has never provided a full analysis of the costs and benefits of these mass surveillance programs, either in terms of taxpayer dollars or diversion of resources from other efforts—or any demonstration that those techniques stopped attacks that otherwise they would not have been able to prevent. While the NSA occasionally presents
          - link "examples" [ref=f9e65] [cursor=pointer]:
            - /url: https://www.pclob.gov/library/215-Report_on_the_Telephone_Records_Program.pdf
          - text: of the successes due to its mass surveillance programs, especially when those techniques are under public pressure, the examples also regularly
          - link "fall apart" [ref=f9e66] [cursor=pointer]:
            - /url: https://www.newamerica.org/insights/do-nsas-bulk-surveillance-programs-stop-terrorists/
          - text: upon serious scrutiny. And even if some utility exists, it must be seriously weighed against the costs.
        - paragraph [ref=f9e67]:
          - text: Similarly, there has never been any comprehensive analysis about whether domestic immigration or law enforcement’s use of these techniques actually makes people safer, or whether other techniques could produce the same results. Instead, both the police and the companies selling these tools
          - link "float anecdotes" [ref=f9e68] [cursor=pointer]:
            - /url: https://www.cbsnews.com/boston/news/brown-university-mit-professor-shooting-flock-cameras-car/
          - text: and
          - link "dubious data" [ref=f9e69] [cursor=pointer]:
            - /url: https://static1.squarespace.com/static/5edeeebc3032af28b09b6644/t/64a46a417c2a6637212e1ce3/1688496710563/2021_11_30_alpr.pdf
          - text: . For example, Flock’s data equates the number of law enforcement hits in their database with actually solving crimes.
        - paragraph [ref=f9e70]: Twenty-five years after 9/11, it seems reasonable to step back and evaluate the costs of this shift to mass surveillance, especially in terms of Americans’ rights and freedoms.
        - heading "The Shift" [level=3] [ref=f9e71]
        - paragraph [ref=f9e72]:
          - text: The easiest place to see a shift to mass surveillance was in the government’s decision immediately after 9/11 to collect Americans’ telephone records. The program started under an
          - link "argument" [ref=f9e73] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/President%27s_Surveillance_Program
          - text: of pure executive power as the “President’s Surveillance Program.” But in 2006, that argument secretly shifted to a
          - link "novel interpretation" [ref=f9e74] [cursor=pointer]:
            - /url: https://www.aclu.org/news/national-security/surveillance-memos-and-suggestion-jack-goldsmith
          - text: of Section 215 of the Patriot. Act which had only previously authorized more targeted access to record. While some media and public interest organizations struggled to force the government to reveal the program as early as late 2005, the government only officially
          - link "confirmed" [ref=f9e75] [cursor=pointer]:
            - /url: https://www.dni.gov/index.php/newsroom/press-releases/press-releases-2013/item/869-dni-statement-on-the-collection-of-telephone-metadata-under-section-215-of-the-usa-patriot-act
          - text: it after the 2013 Snowden disclosures. In 2015, the Second Circuit Court of Appeals
          - link "rejected" [ref=f9e76] [cursor=pointer]:
            - /url: https://www.lawfaremedia.org/article/second-circuit-strikes-down-215-program
          - text: the government’s interpretation of Section 215 as allowing mass collection of telephone records. Later the same year, Congress passed the
          - link "USA Freedom Act" [ref=f9e77] [cursor=pointer]:
            - /url: https://www.govtrack.us/congress/bills/114/hr2048/text
          - text: . While this new law still allows collection of a tremendous amount of domestic telephone records, it ended the indiscriminate mass collection that had occurred for nearly fourteen years.
        - paragraph [ref=f9e78]:
          - text: Other shifts to mass surveillance continue through today. The NSA launched its
          - link "Upstream" [ref=f9e79] [cursor=pointer]:
            - /url: https://documents.pclob.gov/prod/Documents/OversightReport/1c3c0f5a-3e4b-4f3f-9e6b-2c1b7a4e0f7b/702-Report-2.pdf
          - text: program, which involved intercepting both metadata and content from key telecommunications junctures inside the U.S., soon after 9/11. It was also initially conducted under a claim of purely presidential authority. This program was brought under marginal congressional and programmatic (not targeted) Foreign Intelligence Surveillance Act (FISA) court review via
          - link "Section 702" [ref=f9e80] [cursor=pointer]:
            - /url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-2010-title50-section1881a&num=0&edition=2010
          - text: of the 2008 FISA Amendments Act. In 2017, more than15 years after its inception, the NSA
          - link "ended" [ref=f9e81] [cursor=pointer]:
            - /url: https://jsis.washington.edu/news/controversy-comparisons-data-collection-fisas-section-702/#_ftn27
          - text: content searches due to FISA court pressure, but the mass collection continues.
        - paragraph [ref=f9e82]:
          - text: Despite the stated goal of conducting mass spying
          - emphasis [ref=f9e83]: only
          - text: on people outside the U.S.—which itself is problematic given international law’s requirement that surveillance be both
          - link "necessary and proportionate" [ref=f9e84] [cursor=pointer]:
            - /url: https://necessaryandproportionate.org/principles/
          - text: —mass surveillance collects a tremendous amount of U.S. persons’ communications. This can happen because people communicate with people abroad, or because of overcollection—when government agencies gather far more personal data on non-targeted US persons than authorized by law. The concerns about collecting Americans’ data on U.S. soil led Congress to allow the program to officially expire in 2026, although the previously-approved mass surveillance itself continues until at least Spring of 2027.
        - paragraph [ref=f9e85]:
          - text: The shift to mass surveillance would be notable enough even if it remained only a strategy of the intelligence community. It has not. Americans are awash in mass surveillance. Networks of automated license plate readers such as those offered by Flock and Vigilant Solutions
          - link "blanket" [ref=f9e86] [cursor=pointer]:
            - /url: https://maps.deflock.org/?lat=39.8283&lng=-98.5795&zoom=4.00
          - text: both public and private roadways and parking lots. These networks often allow searches by law enforcement, including across jurisdictions. They are, for example, being used to track people seeking abortions
          - link "across" [ref=f9e87] [cursor=pointer]:
            - /url: https://www.eff.org/deeplinks/2025/05/she-got-abortion-so-texas-cop-used-83000-cameras-track-her-down
          - text: state lines. Facial recognition tools, once the province of only the more elite parts of federal law enforcement, are increasingly used by
          - link "Immigration and Customs Enforcement" [ref=f9e88] [cursor=pointer]:
            - /url: https://www.theguardian.com/technology/2026/jan/27/ice-facial-recognition-minnesota
          - text: agents on immigrants and protesters, in airports by the
          - link "Transportation Security Administration" [ref=f9e89] [cursor=pointer]:
            - /url: https://www.msn.com/en-us/travel/news/how-tsa-facial-recognition-actually-works-and-what-travelers-should-know/ar-AA27UDf4
          - text: ", as well as by"
          - link "private entities" [ref=f9e90] [cursor=pointer]:
            - /url: https://www.nytimes.com/2022/12/22/nyregion/madison-square-garden-facial-recognition.html
          - text: . And, of course, modern phones track users’ locations constantly—and that information is readily available to law enforcement, often with only minimal process protections.
        - heading "Constitutional Costs" [level=3] [ref=f9e91]
        - paragraph [ref=f9e92]: Regardless of the murkiness of its actual usefulness, the shift from targeted to mass surveillance has profound implications for Americans’rights. It has created risks that have become increasingly evident, especially under the Trump administration.
        - paragraph [ref=f9e93]:
          - text: At a basic level, the Fourth Amendment guarantees that citizens can be secure in their “persons, houses, papers and effects” from unreasonable searches. Warrants breaching that security should be supported by probable cause and particular descriptions of the place to be searched and items to be seized. Mass surveillance turns that promise on its head, allowing access to our “papers and effects” by the government without individualized suspicion or a particularized description of what data is being seized, much less probable cause. This protection was in response to colonial British misuse of
          - link "writs of assistance" [ref=f9e94] [cursor=pointer]:
            - /url: https://www.eff.org/files/filenode/att/generalwarrantsmemo.pdf
          - text: ", which authorized indiscriminate searches rather than targeted ones."
        - paragraph [ref=f9e95]:
          - text: The justifications for exempting mass surveillance from constitutional protection vary. For Section 702, the government has taken the
          - link "position" [ref=f9e96] [cursor=pointer]:
            - /url: https://www.brennancenter.org/our-work/research-reports/section-702-foreign-intelligence-surveillance-act
          - text: that U.S. persons’ communications caught up in the dragnet, either due to overcollection or because they were communicating with someone outside the United States, do not require a warrant prior to initial collection or secondary access by the FBI and several other agencies. The argument is that if the initial collection was not aimed at Americans, the information is free from constitutional protection for any later uses, even for reasons far afield from the initial rationale for collection.
        - paragraph [ref=f9e97]:
          - text: Other arguments rest on the claim that metadata is outside the Fourth Amendment, despite its demonstrated
          - link "ability" [ref=f9e98] [cursor=pointer]:
            - /url: https://news.stanford.edu/stories/2016/05/stanford-computer-scientists-show-telephone-metadata-can-reveal-surprisingly-sensitive-personal-information
          - text: to reveal intimate details of all of our lives. Still others rest on the Supreme Court-created
          - link "Third Party Doctrine" [ref=f9e99] [cursor=pointer]:
            - /url: https://supreme.justia.com/cases/federal/us/442/735/
          - text: ", which holds that the Fourth Amendment does not apply to data shared with companies that provide us with services. Some turn on whether analysis by machine"
          - link "counts" [ref=f9e100] [cursor=pointer]:
            - /url: https://www.fisc.uscourts.gov/sites/default/files/BR%2013-158%20Primary%20Order.pdf
          - text: ", claiming that only “human eyes” matter—a particularly troubling argument with the rise of artificial intelligence. What’s more, the government has used doctrines like standing to"
          - link "limit" [ref=f9e101] [cursor=pointer]:
            - /url: https://www.eff.org/deeplinks/2015/02/jewel-v-nsa-making-sense-disappointing-decision-over-mass-surveillance
          - text: "the ability of those subjected to mass surveillance to seek constitutional protection. No matter the argument, the goal is the same: to place the mechanisms and fruits of mass surveillance outside the protections of the Fourth Amendment."
        - paragraph [ref=f9e102]:
          - text: The overarching truth is that, due to the concerted efforts by the government since 9/11, and the rise of technologies in recent years, the slice of Americans’ lives and data that are actually protected by the Fourth Amendment has shrunk significantly in the past 25 years. Together, with the technical capabilities of mass surveillance and the increased
          - link "ability" [ref=f9e103] [cursor=pointer]:
            - /url: https://slate.com/technology/2023/12/ai-mass-spying-internet-surveillance.html
          - text: for that data to be analyzed using AI tools, the “security in our papers and effects” that the constitution promises seems increasingly illusory.
        - paragraph [ref=f9e104]:
          - text: In addition to the Fourth Amendment, mass surveillance creates tensions with the First Amendment. The Constitution has long recognized that the right to freedom of speech requires a zone of privacy against governmental surveillance. The right to anonymous speech as well as the right of association both recognize the
          - link "chilling effect" [ref=f9e105] [cursor=pointer]:
            - /url: https://www.cambridge.org/core/books/chilling-effects/22383D541B3BC45C9145E85DA4824E10
          - text: that surveillance creates for people saying unpopular things or attempting to organize for political or other societal change. Mass surveillance grants the authorities the ability to track those people, both in real time and historically, that is inconsistent with actual techniques of freedom of speech and assembly.
        - paragraph [ref=f9e106]:
          - text: That is why the recently released
          - link "2026 U.S. Counterterrorism Strategy" [ref=f9e107] [cursor=pointer]:
            - /url: https://www.whitehouse.gov/wp-content/uploads/2026/05/2026-USCT-Strategy-1.pdf
          - text: is so troubling. On page seven, the White House expressly states that it intends to target domestic activists with its heretofore foreign-targeted powers. It says that the government “will prioritize the rapid identification and neutralization of violent secular political groups whose ideology is anti-American, radically pro-transgender and anarchist” and “will use all the tools constitutionally available to us to map them at home, identify their membership, map their ties to international organizations like Antifa.” While framed as targeting “violent” groups, it’s clear that the government intends to use its national security tools, presumably including the tools of mass surveillance, against Americans in ways that will create profound tensions with the First Amendment rights of people to organize and communicate privately.
        - heading "Costs Due to Mistakes and Abuse" [level=3] [ref=f9e108]
        - paragraph [ref=f9e109]:
          - text: Even assuming some utility from mass surveillance—a fact we do not dispute, even if the public record is shaky and conclusory—the history of both the national security and domestic uses of mass surveillance confirms that these tools are inevitably
          - link "misused" [ref=f9e110] [cursor=pointer]:
            - /url: https://www.nytimes.com/2026/09/10/opinion/911-patriot-act-trump-politics.html
          - text: ", and that mistakes have impacted huge numbers of Americans. The past twenty-five years have demonstrated that it is not possible to surveil the entire US population while staying within the bounds of even a very generous legal framework like Section 702."
        - paragraph [ref=f9e111]:
          - text: As Rep. Zoe Lofgren (D-Calif.) recently stated in discussion of Section 702 in an
          - link "interview" [ref=f9e112] [cursor=pointer]:
            - /url: https://www.techpolicy.press/rep-zoe-lofgren-on-fisa-surveillance-and-the-fourth-amendment/
          - text: with
          - emphasis [ref=f9e113]: Tech Policy Press
          - text: ": “backdoor searches have been used improperly for protestors, 19,000 campaign donors, members of Congress, journalists, government officials, a state court judge who had complained to the FBI about police misconduct. It has been abused substantially in the past.” The NSA experienced so much"
          - link "abuse" [ref=f9e114] [cursor=pointer]:
            - /url: https://arstechnica.com/tech-policy/2013/09/loveint-on-his-first-day-of-work-nsa-employee-spied-on-ex-girlfriend/
          - text: "of its mass surveillance tools by actual or aspiring romantic partners and ex-spouses that an internal name emerged for it: “"
          - link "LOVEINT" [ref=f9e115] [cursor=pointer]:
            - /url: https://arstechnica.com/tech-policy/2013/09/loveint-on-his-first-day-of-work-nsa-employee-spied-on-ex-girlfriend/
          - text: ",” or Love Intelligence."
        - paragraph [ref=f9e116]:
          - text: That same pattern of abuse is now emerging at the domestic law enforcement level. A Texas police officer
          - link "misused" [ref=f9e117] [cursor=pointer]:
            - /url: https://www.eff.org/deeplinks/2025/05/she-got-abortion-so-texas-cop-used-83000-cameras-track-her-down
          - text: ", and then lied about, using license plate readers to track a woman suspected of seeking an abortion. Multiple law enforcement officials have been"
          - link "accused" [ref=f9e118] [cursor=pointer]:
            - /url: https://ij.org/the-ij-database-of-alpr-abuse/
          - text: of tracking people they either wished to have a relationship with or who were their exes. And mass surveillance technologies have been used to track both
          - link "immigration targets" [ref=f9e119] [cursor=pointer]:
            - /url: https://www.washingtonpost.com/technology/interactive/2026/ice-surveillance-immigrants-protesters/
          - text: and citizens
          - link "engaging" [ref=f9e120] [cursor=pointer]:
            - /url: https://www.democracynow.org/2026/1/29/ice_cbp_facial_recognition_technology_app
          - text: in their First Amendment-protected right to track and record the police.
        - paragraph [ref=f9e121]:
          - text: Mistakes are inevitable with collections of data of this size and scope. The history of the FISA court’s reviews of Section 702 is littered with examples of the NSA not being able to
          - link "follow" [ref=f9e122] [cursor=pointer]:
            - /url: https://www.justsecurity.org/66595/the-fisa-courts-702-opinions-part-i-a-history-of-non-compliance-repeats-itself/
          - text: its own rules limiting the scope of what it collects and analyzes, even after having been given multiple chances by the court. On the local level, the technical protections that Flock, for example, put in place have repeatedly been insufficient to stop
          - link "“accidental” sharing" [ref=f9e123] [cursor=pointer]:
            - /url: https://lookout.co/city-of-santa-cruz-pauses-statewide-license-plate-data-sharing-citing-flock-safetys-violation-of-california-law/story
          - text: its data with out-of-state law enforcement. These mistakes have fueled growing efforts by local communities across the country to remove license plate readers. Those efforts should be the first step in a broader reconsideration of mass surveillance.
        - paragraph [ref=f9e124]:
          - text: More generally, ubiquitous surveillance carries a real societal cost. The chilling effects are real and
          - link "pervasive" [ref=f9e125] [cursor=pointer]:
            - /url: https://www.theguardian.com/commentisfree/2026/jul/06/ai-surveillance-policy
          - text: ", and they tend to fall hardest on the most marginalized members of society. Moreover, social progress"
          - link "requires" [ref=f9e126] [cursor=pointer]:
            - /url: https://www.schneier.com/essays/archives/2018/11/surveillance_kills_f.html
          - text: the ability to experiment in secret. It’s hard to imagine a society progressing morally to the point of accepting and legalizing things like marijuana use or gay marriage if the earliest signs of that shift are snuffed out because of overzealous surveillance.
        - heading "Reversing Course" [level=3] [ref=f9e127]
        - paragraph [ref=f9e128]: While a cost-benefit analysis is not the best frame for deciding constitutional rights, it is a place to start to evaluate government policies. If the costs are too high and the benefits too small, what should the public do? While the policy and legal frameworks can be individually complex, mass surveillance is a problem in all of its applications. So too should solutions be comprehensive rather than piecemeal.
        - paragraph [ref=f9e129]: One comprehensive strategy is to reset the promise of the Fourth Amendment and recognize that a warrant is required prior to collection, access or use of information gathered through mass surveillance. This would apply to collections that include U.S. persons, whether done for national security or domestic purposes. This protection would apply regardless of whether the information is in the form of metadata. It would apply regardless of whether the information is held in homes or by services people rely on, such as telephones, internet or social network providers, or by private entities utilizing mass surveillance for their own purposes. By passing this legislation, Congress could ensure this rejection of mass surveillance, and include real enforcement such as a private right of action and an automatic exclusionary remedy in criminal prosecutions. The courts could also recognize this protection of “papers and effects” directly as a plain language interpretation of the Fourth Amendment.
        - paragraph [ref=f9e130]:
          - text: There are already a number of efforts that take on pieces of mass surveillance. Section 702 has expired and should remain so. This was due largely to efforts to block the
          - link "“back door” access" [ref=f9e131] [cursor=pointer]:
            - /url: https://www.brennancenter.org/our-work/research-reports/congress-must-close-backdoor-search-loophole-requiring-warrantfisa-0
          - text: to Section 702-collected data without warrants. The bipartisan “
          - link "Fourth Amendment is Not for Sale Act" [ref=f9e132] [cursor=pointer]:
            - /url: https://www.wyden.senate.gov/news/press-releases/wyden-applauds-bipartisan-passage-of-his-fourth-amendment-is-not-for-sale-act-in-the-house-judiciary-committee
          - text: ” would prevent the government from purchasing data that it would otherwise need a warrant to obtain. The Supreme Court itself has already been chipping away at the Third Party Doctrine, with a recent step in the rejection of mass geofence warrants—warrants seeking the identities of individuals based upon their proximity to a crime—in
          - link [ref=f9e133] [cursor=pointer]:
            - /url: https://www.supremecourt.gov/opinions/25pdf/25-112_0am4.pdf
            - emphasis [ref=f9e134]: Chatrie v. United States
          - text: . Now, such warrants fall, at least initially, under the Fourth Amendment.
        - paragraph [ref=f9e135]:
          - text: A more comprehensive approach would also address mass surveillance carried out by private companies, and to ensure that Americans have the right to encrypt and secure their data. There are many reasons the United States would benefit from a
          - link "comprehensive privacy law" [ref=f9e136] [cursor=pointer]:
            - /url: https://www.eff.org/deeplinks/2025/04/eff-congress-heres-what-strong-privacy-law-looks
          - text: —and curbing mass surveillance is one of them. Addressing mass surveillance is certainly one of them. Ideas such as the banning of secondary uses of data—with roots in the
          - link "Fair Information Practice Principles" [ref=f9e137] [cursor=pointer]:
            - /url: https://iapp.org/news/a/50-years-and-still-kicking-an-examination-of-fipps-in-modern-regulation
          - text: from the 1970s—are worth pushing forward. So are moves such as creating
          - link "fiduciary duties" [ref=f9e138] [cursor=pointer]:
            - /url: https://wustllawreview.org/wp-content/uploads/2022/02/Richards-Hartzog-A-Duty-of-Loyalty-for-Privacy.pdf
          - text: for mass data collectors. There are many more ways to curtail private companies’ mass surveillance while staying within constitutional boundaries. But addressing the costs of mass surveillance by both companies and governments is even more important in a world where AI agents are making decisions both about the public and on their behalf based on their data and observed behavior.
        - paragraph [ref=f9e139]: "Twenty-five years after the U.S. government embraced mass surveillance, it’s time to evaluate it as a whole, and consider responses that address the problem as a whole. Americans must ask: Is it consistent with a self-governing democracy to have systems that watch everyone everywhere? Is the public comfortable with governments—federal, state, local—that seek to “know it all” about its citizens? Is the public comfortable with private mass surveillance in its own right and as it’s being increasingly used to fuel government surveillance? These questions have long needed serious consideration. But as it becomes increasingly evident that the Trump administration is using mass surveillance to keep itself in power, stifle dissent, and undermine political opponents, these questions are now more urgent than ever."
