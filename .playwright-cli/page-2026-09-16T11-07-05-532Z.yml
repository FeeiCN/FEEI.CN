    - article [ref=f9e405]:
      - generic [ref=f9e406]:
        - heading [level=2] [ref=f9e407]:
          - link "AIs Compress Exploit Timeline" [ref=f9e408] [cursor=pointer]:
            - /url: https://www.schneier.com/blog/archives/2026/09/ais-compress-exploit-timeline.html
        - paragraph [ref=f9e409]:
          - text: Give an AI agent a mere
          - link "rumor" [ref=f9e410] [cursor=pointer]:
            - /url: https://anil.recoil.org/notes/rumour-is-the-exploit
          - text: of an exploit, and it’s enough for them to find it.
        - blockquote [ref=f9e411]:
          - paragraph [ref=f9e412]: What’s worse, I found I could use my own agents to find the exploit just by knowing roughly what it was about and so could have been exploiting it well before the public patch was available! Given that just the rumour of a security issue seems enough to give attackers enough info to find new exploits, we’re going to need to change the way we deal with security responses in open source.
        - paragraph [ref=f9e413]:
          - text: Simon Willison
          - link "comments" [ref=f9e414] [cursor=pointer]:
            - /url: https://simonwillison.net/2026/Aug/28/just-a-rumour-of-a-bug/
          - text: ":"
        - blockquote [ref=f9e415]:
          - paragraph [ref=f9e416]: Anil points out that this rate of discovery appears incompatible with existing open source embargo practices for new issues. If an issue can become an exploit this fast, we need to figure out new processes for keeping our communities safe.
