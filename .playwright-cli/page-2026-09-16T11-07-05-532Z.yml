          - text: ":"
        - blockquote [ref=f9e310]:
          - paragraph [ref=f9e311]: But an estimated 30 to 50 tons of dead squid remain inside the boat’s catch tank, where they have been decomposing for days. “That is nasty. I wouldn’t want to do that,” said commercial fisherman Dick Ogg of the Bodega Bay Fishermen’s Marketing Association.
          - paragraph [ref=f9e312]: Ogg said anyone familiar with the fishing industry understands what happens when a large catch sits for an extended period.
          - paragraph [ref=f9e313]: “If you think about what happens after four or five days, it’s a gooey mess,” he said.
          - paragraph [ref=f9e314]: The odor has become a defining feature of the operation, and the beach remains closed to the public while crews work on a removal plan.
          - paragraph [ref=f9e315]: According to salvage expert Ernie English of Parker Diving Service, the squid has deteriorated into a thick mass that will be difficult to remove.
          - paragraph [ref=f9e316]: “It’s like concrete,” English said when asked about its consistency.
