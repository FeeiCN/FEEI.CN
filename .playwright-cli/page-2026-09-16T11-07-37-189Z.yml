          - link "What blog posts influenced your thinking the most?" [ref=f11e111] [cursor=pointer]:
            - /url: https://lobste.rs/s/lbavmm/what_blog_posts_influenced_your_thinking
          - text: — Lobste.rs
        - paragraph [ref=f11e112]:
          - text: An early Joel Spolsky one for me was
          - link "The Law of Leaky Abstractions" [ref=f11e113] [cursor=pointer]:
            - /url: https://www.joelonsoftware.com/2002/11/11/the-law-of-leaky-abstractions/
          - text: . I read that near the start of my career and it's encouraged me to
          - emphasis [ref=f11e114]: always
          - text: be looking for improved understanding of the layers under where I'm working, just in case one of those abstractions leaks.
        - paragraph [ref=f11e115]:
          - text: A more recent one, from 2018, is
          - 'link "Migrations: the sole scalable fix to tech debt" [ref=f11e116] [cursor=pointer]':
            - /url: https://lethain.com/migrations/
          - text: by Will Larson. I absolutely love his idea that migrations (e.g. replacing one service with a new one, or switching database engines, or whatever) are part and parcel of software engineering and are a skill that you should invest in and get good at, not avoid or treat as special one-offs.
        - paragraph [ref=f11e117]:
          - link "The Engineer/Manager Pendulum" [ref=f11e118] [cursor=pointer]:
            - /url: https://charity.wtf/p/the-engineer-manager-pendulum
          - text: by Charity Majors was hugely influential for me. I was stuck in engineering management and worried that if I switched back to being an "Individual Contributor" (ugh I hate that term) I'd damage my career. Charity gave me permission to make the switch by pointing out that many of the most successful software developers pendulum from one track to the other multiple times over their career, and doing so makes you better at both sides.
        - paragraph [ref=f11e119]:
          - link "#" [ref=f11e120] [cursor=pointer]:
            - /url: /2026/Sep/14/influences/
          - link "8:21 pm" [ref=f11e121] [cursor=pointer]:
