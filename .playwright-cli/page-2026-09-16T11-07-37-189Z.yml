          - text: and I ran an extensive audit of Datasette using Claude Fable 5.1, GPT-5.6, and GPT-6 Astra. We then spent almost a week collaborating on and reviewing the fixes.
        - paragraph [ref=f11e441]:
          - text: They helped find some
          - emphasis [ref=f11e442]: very
          - text: subtle bugs. We'll be incorporating security audits by frontier models into all of our development work going forward.
        - paragraph [ref=f11e443]: "Alex came up with a way of splitting the work which I found extremely productive:"
