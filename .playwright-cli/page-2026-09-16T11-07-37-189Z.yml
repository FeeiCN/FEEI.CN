          - text: ) One of OpenRouter's selling points is that it "handles fallbacks automatically and picks the most cost-effective option for each request", so you can call a single API endpoint for a model and get routed to the best available backend provider.
        - paragraph [ref=f11e285]: Mohamed Moustafa points out a whole set of ways that this can cause you problems. Different providers run different serving software with different optimizations and settings, which means that the same OpenRouter endpoint can serve model requests that behave in different ways.
        - paragraph [ref=f11e286]: Some providers even lack vision capability for vision models, and the way the reasoning effort option is processed can differ as well.
        - paragraph [ref=f11e287]:
