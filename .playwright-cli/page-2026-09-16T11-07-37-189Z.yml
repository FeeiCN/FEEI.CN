          - text: — Hacker News
        - paragraph [ref=f11e320]: I'm not sure how useful it is to say this, but I think a lot of people (myself included, a few years ago now) have been through this moment of existential crisis and come out the other side.
        - paragraph [ref=f11e321]:
          - text: The initial reaction, when some coding agent does a piece of work that would have taken you a week in an hour and does it
          - emphasis [ref=f11e322]: well
          - text: ", is to be very disheartened by it."
        - paragraph [ref=f11e323]:
          - text: Once you come to terms with the idea that translating an exact specification into decent code isn't a unique skill any more, you can start looking at the larger set of problems that you face as a software engineer and realize that there is
          - emphasis [ref=f11e324]: so much left
          - text: ", and your existing skill and experience mean you can master these new tools, provide value, and execute at a level far greater than anyone who is just getting started building software using agents without any of your depth."
        - paragraph [ref=f11e325]: If you don't want your profession to change at all then you're going to have a tough time with this - but that's surely been true for the history of software engineering? Has there ever been any stability to the tools and language we use beyond about a five year time horizon?
        - paragraph [ref=f11e326]: These changes are happening a bit faster, but if you chose software development as a passion you've opted into pretty frequent radical change from the start.
