      - generic [ref=f11e83]:
        - paragraph [ref=f11e84]:
          - strong [ref=f11e85]:
            - link "The contagion of fear" [ref=f11e86] [cursor=pointer]:
              - /url: https://bcantrill.dtrace.org/2026/09/13/the-contagion-of-fear/
          - text: (
          - link "via" [ref=f11e87] [cursor=pointer]:
            - /url: https://lobste.rs/s/1ifr5f/contagion_fear
          - text: ) Bryan Cantrill responds to the
          - link "tweet by former Anthropic employee Jacob Coxon" [ref=f11e88] [cursor=pointer]:
            - /url: https://x.com/hilbertspaess/status/2097476203863224394
          - text: confirming that many Anthropic researchers believe AI "could kill us all by the end of the decade".
        - paragraph [ref=f11e89]: "Bryan shares a story of his own youthful mistakes causing unjustified panic among less technical peers, and warns against doing the same:"
        - blockquote [ref=f11e90]:
          - paragraph [ref=f11e91]:
            - text: "These ghoulish claims strike brazenly at the hearth, and given the obvious importance of AI, it is unsurprising that they have leapt into the mainstream, with people asking the natural question:"
            - link "how would that happen?" [ref=f11e92] [cursor=pointer]:
              - /url: https://www.youtube.com/watch?v=kwPxjBJamVs
            - text: The answers always rely on hand-wavy extrapolation into the future; for example, Jacob Coxon cites "hacking critical infrastructure" and "extinction-level bioweapons" without further elaboration. But Coxon is not an expert on critical infrastructure, nor on bioweapons — nor, for that matter, on extinction. [...]
          - paragraph [ref=f11e93]: That said, we should not expect the public to understand LLMs, critical infrastructure, bioweapons, extinction biology, etc. — that burden must lie with those making the claim. The lesson that I learned (shamefully) decades ago is that domain experts, by way of their expertise, implicitly hold the public’s trust — and we must not abuse it. It is incumbent upon us to be circumspect in our claims — and maximally so when raising the alarm.
        - paragraph [ref=f11e94]:
          - text: Bryan talked about his doubts about the bioweapons concerns in the recent episode of Oxide and Friends that I joined. You can hear more of his thoughts on that
          - link "starting at 51m44s" [ref=f11e95] [cursor=pointer]:
            - /url: https://oxide-and-friends.transistor.fm/episodes/the-open-weight-revolution-with-simon-willison/transcript#t=51m44s
          - text: in that episode. Here's
          - link "57m04s" [ref=f11e96] [cursor=pointer]:
            - /url: https://oxide-and-friends.transistor.fm/episodes/the-open-weight-revolution-with-simon-willison/transcript#t=57m4s
          - text: ":"
        - blockquote [ref=f11e97]:
          - paragraph [ref=f11e98]:
            - text: I really think we need to be careful because it's
            - emphasis [ref=f11e99]: so easy
            - text: to be overcome with fear when we kind of make up these... it can give you biological weapons. Like, how? I mean, can we please have a biologist weigh in on this? Or can we have like someone who's got experience with bioweapons? [...] The bioweapon thing just gets under my fingernails because it leaves so much to the imagination that we insert with fear.
        - paragraph
        - paragraph [ref=f11e100]:
          - link "#" [ref=f11e101] [cursor=pointer]:
