        - button "本页总览" [ref=f17e37] [cursor=pointer]
        - generic [ref=f17e38]:
          - generic [ref=f17e41]:
            - button "复制 Markdown 原文" [ref=f17e42] [cursor=pointer]
            - button "更多操作" [ref=f17e45] [cursor=pointer]
          - heading "人生系统" [level=1] [ref=f17e49]
          - paragraph [ref=f17e52]: 我以前很依赖意志力。想减肥，就告诉自己少吃一点；想读书，就逼自己每天看；想提升能力，就多花时间学习；想存钱，就提醒自己少消费。
          - paragraph [ref=f17e53]: 这种方式不是没用，只是不稳定。忙一点，计划就乱；累一点，习惯就停；状态差的时候，连“为什么要做”都会忘。
          - paragraph [ref=f17e54]: 后来我越来越确定一件事：
          - paragraph [ref=f17e55]:
            - strong [ref=f17e56]: 真正可靠的改变，不能只靠某一阶段特别想改变。
          - paragraph [ref=f17e57]: 于是我开始搭自己的 Life OS。它不是一个软件，也不是一套固定模板，更像一套让重要事情尽量持续运转的个人系统。我现在把它拆成六个部分：
          - paragraph [ref=f17e58]:
            - strong [ref=f17e59]: 目标、数据、记录、复盘、工具、Agent。
          - paragraph [ref=f17e60]:
            - text: 这套系统建立在两个底层判断上：
            - link "在不确定世界里持续创造确定性" [ref=f17e61] [cursor=pointer]:
              - /url: /life-certainty
            - text: ，并把健康、能力、财富、关系和生活理解为一场需要长期维护的
            - link "逆熵过程" [ref=f17e62] [cursor=pointer]:
              - /url: /life-entropy
            - text: 。系统最终管理四个长期方向：
            - link "健康幸福" [ref=f17e63] [cursor=pointer]:
              - /url: /health
            - text: 、
            - link "事业有成" [ref=f17e64] [cursor=pointer]:
              - /url: /capability
            - text: 、
            - link "财务自由" [ref=f17e65] [cursor=pointer]:
              - /url: /wealth
            - text: 和
            - link "人生丰富" [ref=f17e66] [cursor=pointer]:
              - /url: /experience
            - text: 。
          - heading [level=2] [ref=f17e67]:
            - text: 系统如何运行
            - link "系统如何运行的直接链接" [ref=f17e68] [cursor=pointer]:
              - /url: "#系统如何运行"
              - text: "#"
          - heading [level=3] [ref=f17e69]:
            - text: 目标：决定什么值得进入系统
            - link "目标：决定什么值得进入系统的直接链接" [ref=f17e70] [cursor=pointer]:
              - /url: "#目标决定什么值得进入系统"
              - text: "#"
          - paragraph [ref=f17e71]: 系统的第一步不是数据，而是目标。没有目标，记录得越多，噪音越多。
          - paragraph [ref=f17e72]: 我最后只保留四个长期方向：健康幸福、事业有成、财务自由、人生丰富。它们不是 KPI，更像四个坐标。
          - paragraph [ref=f17e73]: 运动，不只是为了减几斤，而是健康；学习 AI，不只是追热点，而是职业能力；投资，不只是赚快钱，而是未来的选择权；旅行，也不是完成打卡，而是提醒自己人生不能只剩工作。
          - paragraph [ref=f17e74]: 目标真正有用的地方，是让我知道什么值得长期投入，而不是把生活里所有东西都变成任务。
          - heading [level=3] [ref=f17e75]:
            - text: 数据：让模糊的感觉变得可见
            - link "数据：让模糊的感觉变得可见的直接链接" [ref=f17e76] [cursor=pointer]:
              - /url: "#数据让模糊的感觉变得可见"
              - text: "#"
          - paragraph [ref=f17e77]: 很多问题之所以长期存在，不是因为不知道，而是不知道到底有多严重。“最近胖了一点”和连续几个月体重曲线向上，是两种感觉；“最近有点累”和过去一周睡眠明显下降，也不是一回事。
          - paragraph [ref=f17e78]: 所以我会记录一些真正会影响判断的数据：体重、睡眠、运动、阅读、资产、AI 使用、旅行足迹。它们不是为了制造控制感，也不是为了每天追求更漂亮的数字，而是为了让模糊的感觉变成可以观察的事实。
          - paragraph [ref=f17e79]:
            - strong [ref=f17e80]: 数据是仪表盘，不是方向盘。
          - paragraph [ref=f17e81]: 它告诉我车现在是什么状态，往哪里开仍然要自己决定。
          - heading [level=3] [ref=f17e82]:
            - text: 记录：保存数字看不到的东西
            - link "记录：保存数字看不到的东西的直接链接" [ref=f17e83] [cursor=pointer]:
              - /url: "#记录保存数字看不到的东西"
              - text: "#"
          - paragraph [ref=f17e84]: 数据只能记录一部分人生。宝宝看到我要出门，伸手想让我抱；和同事坐车去机场，一路聊安全里的责权利；旅行途中偶然吃到一顿特别满意的饭；一次谈话改变了我的判断——这些东西如果当天不记，过一段时间就会消失。
          - paragraph [ref=f17e85]: 所以我后来越来越重视日记，但也慢慢放弃了“什么都记”。真正值得留下的，不是一天发生了多少事，而是多年以后还值得知道：
          - paragraph [ref=f17e86]:
            - strong [ref=f17e87]: 那一天，我在想什么，做了什么决定，什么东西开始发生变化。
          - paragraph [ref=f17e88]: 数据解决“发生了多少”，记录解决“发生了什么”。
          - heading [level=3] [ref=f17e89]:
            - text: 复盘：让经历产生反馈
            - link "复盘：让经历产生反馈的直接链接" [ref=f17e90] [cursor=pointer]:
              - /url: "#复盘让经历产生反馈"
              - text: "#"
          - paragraph [ref=f17e91]: 如果只是记录，不复盘，系统最后很容易变成一个巨大的仓库。东西越来越多，判断却没有变强。
          - paragraph [ref=f17e92]: 所以我会用不同时间尺度回看：每天，只看最重要的一两件事；一周，看有没有明显偏离；一个月，看哪些事情真的发生了变化；一年，再看哪些目标推进了，哪些只是看起来很忙。
          - paragraph [ref=f17e93]: 不同时间尺度，看到的是不同问题。单日体重上涨没什么意义，七天平均值可能有意义；某一天工作很忙也不代表什么，如果连续一个月只有响应、没有创造，就值得警惕。
          - paragraph [ref=f17e94]: 复盘的价值，不是不断批评自己，而是减少下一次重复犯错的成本。
          - heading [level=3] [ref=f17e95]:
            - text: 工具：降低正确行为的摩擦
            - link "工具：降低正确行为的摩擦的直接链接" [ref=f17e96] [cursor=pointer]:
              - /url: "#工具降低正确行为的摩擦"
              - text: "#"
          - paragraph [ref=f17e97]: 工具对我的意义，不是让一天塞进更多事情，而是让正确的事更容易发生。
          - paragraph [ref=f17e98]: 想多运动，家里就放着划船机和跑步机；想长期记录健康数据，如果每天都要手工整理，很快就会放弃，所以尽量自动同步；想持续写东西，就把博客、知识库、GitHub 和自动部署连起来。
          - paragraph [ref=f17e99]: 一个系统能不能长期跑，不取决于设计得多漂亮，而取决于状态很差的时候还能不能运转。如果一个流程每天都需要靠意志力启动，它迟早会停。
          - heading [level=3] [ref=f17e100]:
            - text: Agent：让反馈循环开始自动运行
            - link "Agent：让反馈循环开始自动运行的直接链接" [ref=f17e101] [cursor=pointer]:
              - /url: "#agent让反馈循环开始自动运行"
              - text: "#"
          - paragraph [ref=f17e102]: AI 出现以后，Life OS 发生了一个很大的变化。过去很多系统都是被动的：人记录、人整理、人分析、人复盘；现在 Agent 可以承担越来越多中间工作。
          - paragraph [ref=f17e103]: 它可以自动汇总健康数据，从日记里提炼长期问题，分析最近一周是否出现异常，把阅读、工作和财务记录重新组织起来，甚至在写作之前，把过去相关经历找回来。
          - paragraph [ref=f17e104]: 对我来说，价值不只是“节省时间”。更重要的是，以前很多因为维护成本太高、很难长期运行的个人系统，现在开始变得可行。持续反馈第一次变得足够便宜。
          - heading [level=2] [ref=f17e105]:
            - text: 这六个部分怎么连起来
            - link "这六个部分怎么连起来的直接链接" [ref=f17e106] [cursor=pointer]:
              - /url: "#这六个部分怎么连起来"
              - text: "#"
          - paragraph [ref=f17e107]: 我现在理解的 Life OS，大概是这样：
          - code [ref=f17e111]:
            - generic [ref=f17e112]: 目标
            - generic [ref=f17e113]: ↓
            - generic [ref=f17e114]: 行动
            - generic [ref=f17e115]: ↓
            - generic [ref=f17e116]: 数据 + 记录
            - generic [ref=f17e117]: ↓
            - generic [ref=f17e118]: 复盘
            - generic [ref=f17e119]: ↓
            - generic [ref=f17e120]: 判断
            - generic [ref=f17e121]: ↓
            - generic [ref=f17e122]: 调整
            - generic [ref=f17e123]: ↓
            - generic [ref=f17e124]: 继续行动
          - paragraph [ref=f17e125]: 工具降低每一步的摩擦，Agent 加快整个反馈循环。
          - paragraph [ref=f17e126]: 所以 Life OS 的目标，不是让我每天完成更多任务，而是减少那些原本需要一直记在脑子里的东西：不用每天重新想目标，不用每天手工整理数据，不用靠记忆保存所有经历，也尽量不要反复犯已经总结过的问题。
          - paragraph [ref=f17e127]: 把这些事情交给系统以后，人可以把注意力留给机器最难替代的部分：判断、选择、关系、创造和体验。
          - heading [level=2] [ref=f17e128]:
            - text: 我理解的“人的 Scaling Law”
            - link "我理解的“人的 Scaling Law”的直接链接" [ref=f17e129] [cursor=pointer]:
              - /url: "#我理解的人的-scaling-law"
              - text: "#"
          - paragraph [ref=f17e130]: 我以前写过一个很工程化的公式：
          - paragraph [ref=f17e131]:
            - strong [ref=f17e132]: 目标 × 数据 × 复盘 × 工具 × Agent × 组织
          - paragraph [ref=f17e133]: 它当然不是什么真正的定律，只是一个类比。我想表达的是：人与人之间的差距，不只来自投入时长。
          - paragraph [ref=f17e134]: 同样一天工作八小时，有人所有事情靠脑子记；有人有稳定的数据；有人会复盘；有人把重复工作自动化；有人开始使用 Agent；还有人能够进一步把个人能力变成团队可以复用的能力。随着这些杠杆叠加，同样的一小时，可能产生完全不同的长期价值。
          - paragraph [ref=f17e135]: 所以我现在更愿意问的，不是“我还能再多投入几个小时？”，而是：
          - paragraph [ref=f17e136]:
            - strong [ref=f17e137]: “有没有办法让这一小时以后还能继续产生价值？”
          - paragraph [ref=f17e138]: 写一篇文章，是一次产出；形成一套方法，可以重复使用；把方法变成工具，可以规模化复用；把一部分流程交给 Agent，可以自动运行；如果还能让团队复用，就进一步变成组织能力。
          - paragraph [ref=f17e139]: 这就是我理解的长期放大。
          - heading [level=2] [ref=f17e140]:
            - text: Life OS 不是为了把人生变成机器
            - link "Life OS 不是为了把人生变成机器的直接链接" [ref=f17e141] [cursor=pointer]:
              - /url: "#life-os-不是为了把人生变成机器"
              - text: "#"
          - paragraph [ref=f17e142]: 这套系统有一个很大的风险：越做越复杂。记录越来越多，指标越来越多，自动化越来越多，最后开始为了维护系统而维护系统。更糟的是，所有事情都想量化，所有生活都想优化。
          - paragraph [ref=f17e143]: 所以我现在越来越强调一条边界：
          - paragraph [ref=f17e144]:
            - strong [ref=f17e145]: Life OS 是为了服务生活，不是为了接管生活。
          - paragraph [ref=f17e146]: 不是每件事都值得记录，不是每个指标都值得优化，也不是每一天都需要进步。有时候今天很好，就不需要纠偏；有时候什么都没完成，但和家人待了一天，也没有问题；旅行的时候，不该因为没有完成阅读目标而焦虑；和朋友吃饭，也没必要追问这顿饭对人生目标有什么贡献。
          - paragraph [ref=f17e147]: 真正好的系统，应该让人更自由，而不是更紧绷。
          - heading [level=2] [ref=f17e148]:
            - text: 最后
            - link "最后的直接链接" [ref=f17e149] [cursor=pointer]:
              - /url: "#最后"
              - text: "#"
          - paragraph [ref=f17e150]: 我的 Life OS 还在持续变化，我也不希望它有一天彻底“完成”。人生阶段会变，目标会变，身体会变，技术会变，家庭和工作都会变，系统也应该跟着变。
          - paragraph [ref=f17e151]: 我真正需要它长期帮我回答的，只有几个问题：现在最重要的是什么？我真实的状态是什么？过去一段时间发生了什么？我是不是还在往自己想去的地方走？下一步要不要调整？
          - paragraph [ref=f17e152]: 如果一个系统能够持续帮我把这些问题看清楚，就已经足够有价值。
          - paragraph [ref=f17e153]: Life OS 的意义，不是让人生变得完全可控，而是让我在一个无法完全控制的世界里，拥有更多清晰和选择。
