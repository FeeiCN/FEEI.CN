              - paragraph [ref=e1038]: 实践中，O/V/T 三者往往存在级联依赖。存在两种典型的链路信息承载方式：
              - list [ref=e1039]:
                - listitem [ref=e1040]:
                  - strong [ref=e1041]: O/V 显式传播模式
                  - text: ：O 和 V 作为访问上下文显式跟随每一跳传播。每一跳直接持有完整 O 和 V 信息，T 断裂不会导致 O 和 V 丢失。代价是每一跳都需承载和转发完整的访问上下文，对链路资源有较高要求。
                - listitem [ref=e1042]:
                  - strong [ref=e1043]: SessionID 间接查询模式
                  - text: ：链路上不直接携带 O 和 V，而是传播 SessionID（或 TraceID），各跳通过 SessionID 查询后端服务来获取。资源开销低，是当前微服务架构的主流实践（如基于 OpenTelemetry 的分布式追踪）。但 SessionID 在跨网络域时极易因关联丢失而断裂（
                  - generic [ref=e1044]:
