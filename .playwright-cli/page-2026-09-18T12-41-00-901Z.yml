                      - generic [ref=e1496]: e
                      - generic [ref=e1497]: .
                      - generic [ref=e1498]: r
                  - generic [ref=e1500]: e.r
                - text: （被访问资源）之间的归属关系：
              - paragraph [ref=e1501]:
                - generic [ref=e1502]:
                  - math [ref=e1504]:
