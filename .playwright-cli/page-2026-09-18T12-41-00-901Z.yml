                          - text: I
                          - generic [ref=e1060]: T
                        - text: (k) =
                      - generic [ref=e1068]: "0"
                  - text: ），O 和 V 信息也随之无法查询，三者同时归零。
              - paragraph [ref=e1069]: SessionID 模式远比 O/V 显式传播模式普遍，T 的脆弱性被严重低估。OVTP 范式要求系统性地排查链路中 O、V、T 信息的一切缺失环节，无论是 SessionID 跨域丢失导致的级联归零、中间服务替换身份导致的 O 断裂，还是工单上下文被剥离导致的 V 丢失，都必须识别为重要的隐性安全风险。
