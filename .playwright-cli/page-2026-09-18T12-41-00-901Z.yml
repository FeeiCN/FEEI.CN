                      - generic [ref=e1399]: ≡
                      - generic [ref=e1400]: "0"
                  - generic [aria-hidden] [ref=e1401]:
                    - generic [ref=e1402]:
                      - generic [ref=e1403]:
                        - text: I
                        - generic [ref=e1404]: V
                      - text: ≡
                    - generic [ref=e1412]: "0"
                - text: ；T 维度——从云平台审计日志出发，无法追溯到企业内部哪条业务链路触发了这次调用，
                - generic [ref=e1413]:
                  - math [ref=e1415]:
                    - generic [ref=e1417]:
                      - generic [ref=e1418]:
                        - generic [ref=e1419]: I
                        - generic [ref=e1420]: T
                      - generic [ref=e1421]: ≈
                      - generic [ref=e1422]: "0"
                  - generic [aria-hidden] [ref=e1423]:
                    - generic [ref=e1424]:
                      - generic [ref=e1425]:
                        - text: I
                        - generic [ref=e1426]: T
                      - text: ≈
                    - generic [ref=e1434]: "0"
                - text: 。共享 AK 在 OVT 三个维度上全面归零——是 NbSP 视角下"最脆弱的安全边界"，更是 OVTP 视角下"最不透明的访问通道"。攻击者使用泄露的 AK 访问云服务时，其行为在 OVT 维度上与合法业务访问完全无法区分。
              - paragraph [ref=e1435]: OVTP 范式对凭据治理的指导是：即使在 NbSP 维度上无法完全杜绝凭据泄露（零日漏洞始终存在），也应通过 OVTP 化改造使凭据的使用具备可追溯性——按服务粒度签发独立凭据（恢复 O 的可区分性），将凭据与工单凭证机制绑定（注入 V 维度），对凭据使用建立完整的调用链路追踪（保障 T 维度）。
              - heading [level=2] [ref=e1436]:
                - text: 六、OVTP 与 NbSP 的协同
                - link "六、OVTP 与 NbSP 的协同的直接链接" [ref=e1437] [cursor=pointer]:
                  - /url: "#六ovtp-与-nbsp-的协同"
                  - text: "#"
              - paragraph [ref=e1438]: OVTP 是 NbSP 的延伸。NbSP 确保"门不可绕"，OVTP 确保"过门者必须出示完整的身份和工单凭证，并留下可追溯的记录"。二者合一，构成完整的防御纵深。
              - paragraph [ref=e1439]: 回到 NbSP 范式中的攻击分类：
              - list [ref=e1440]:
                - listitem [ref=e1441]:
                  - strong [ref=e1442]: B3 型攻击
                  - text: （完全绕过型）：NbSP 的核心防御对象。若 B3 型攻击得逞，OVTP 的审计追溯能力也会被一并摧毁——攻击者获得底层执行权限，可篡改或清除日志。城墙失守，盘查制度形同虚设。
                - listitem [ref=e1443]:
                  - strong [ref=e1444]: B2− 型攻击
                  - text: （部分绕过·可感知型）：攻击者突破部分边界但暴露在独立的感知审计体系下（
                  - generic [ref=e1445]:
                    - math [ref=e1447]:
                      - generic [ref=e1449]:
                        - generic [ref=e1450]: A
                        - generic [ref=e1451]: (
                        - generic [ref=e1452]: g
                        - generic [ref=e1453]: )
                        - generic [ref=e1454]: =
                        - generic [ref=e1455]: "0"
                    - generic [aria-hidden] [ref=e1456]:
                      - generic [ref=e1457]: A(g) =
                      - generic [ref=e1458]: "0"
                  - text: ）。在设计完善的 OVTP 体系下，B2− 型攻击难以隐形——异常的操作模式（不持有合法工单凭证、使用了非预期的访问路径）会在审计链路中留下可识别的痕迹。
                - listitem [ref=e1459]:
                  - strong [ref=e1460]: B1 型攻击
                  - text: （滥用服务型）：身份滥用和权限滥用。这是 OVTP 的核心防御对象。B1 型攻击不破坏 NbSP 边界，而是利用合法的访问接口从事非法操作。完善的 OVTP 体系通过 Operator 真实身份追溯、Voucher 工单凭证的任务级约束、Traceable 全链路审计，使 B1 型攻击无所遁形。
              - paragraph [ref=e1461]: 军事类比：NbSP 是城墙和护城河——确保敌人不能翻墙而入；OVTP 是城门的盘查制度——每一个经过城门的人都必须出示身份文书和任务工单、留下进出记录。城墙阻挡翻墙的敌军（B3/B2+），盘查拦截混入的间谍（B2−/B1）。没有城墙，盘查形同虚设；没有盘查，城墙只能挡住最粗暴的进攻。
              - heading [level=2] [ref=e1462]:
                - text: 七、水平越权：OVTP 范式的实战解析
                - link "七、水平越权：OVTP 范式的实战解析的直接链接" [ref=e1463] [cursor=pointer]:
                  - /url: "#七水平越权ovtp-范式的实战解析"
                  - text: "#"
              - paragraph [ref=e1464]:
                - text: 水平越权（Horizontal Privilege Escalation）是 Web 安全和 API 安全领域最常见、影响最广泛的漏洞类型之一，典型技术成因是
                - strong [ref=e1465]: IDOR
                - text: （Insecure Direct Object Reference）——接口未校验请求者与资源的归属关系，导致攻击者仅通过修改资源标识即可访问他人数据。它也是 OVTP 范式最直接的实战检验场：一个典型的 B1 型攻击——角色检查通过，权限验证通过，但操作者访问的是同权限级别下其他用户的数据。
              - heading [level=3] [ref=e1466]:
                - text: 7.1 水平越权的攻击本质
                - link "7.1 水平越权的攻击本质的直接链接" [ref=e1467] [cursor=pointer]:
                  - /url: "#71-水平越权的攻击本质"
                  - text: "#"
              - paragraph [ref=e1468]:
                - text: 某三甲医院护理信息系统中，护士可在线查看所负责患者的检验报告、护理记录和医嘱信息。内科病房护士张某登录系统后，查看自己负责的患者王某的血液检验报告，页面地址为
                - code [ref=e1469]: /api/reports/R2024051234
                - text: 。张某将 URL 中的报告编号改为
                - code [ref=e1470]: R2024051235
                - text: ，页面刷新——显示的是外科病房一位术后患者的完整检验报告。
              - paragraph [ref=e1471]: 该医院工作人员之所以能看到非自己职责范围内的患者病历，不是因为他"黑"进了系统，而是系统在角色检查通过后根本没有进一步校验数据归属。在 RBAC 模型下，内科护士张某和外科护士李某拥有相同的角色（护士），对"查看检验报告"操作拥有相同的权限——RBAC 的判定函数对两次请求给出完全相同的"允许"判定。
              - paragraph [ref=e1472]: 水平越权之所以如此普遍、难以根治，正是因为它暴露了 RBAC 模型的结构性盲区——RBAC 只校验"角色是否匹配操作类型"，不校验"操作者与资源的归属关系"。这是模型在设计层面就没有为"资源归属"预留表达空间。
              - heading [level=3] [ref=e1473]:
                - text: 7.2 OVT 三维解析水平越权
                - link "7.2 OVT 三维解析水平越权的直接链接" [ref=e1474] [cursor=pointer]:
                  - /url: "#72-ovt-三维解析水平越权"
                  - text: "#"
              - paragraph [ref=e1475]:
                - strong [ref=e1476]: O 维度：凭据合法，但操作者访问了非自己职责范围的资源
                - text: 。
              - paragraph [ref=e1477]:
                - text: 传统系统在认证后将"操作者身份"与"资源归属"脱钩。张某的登录 Token 证明了"这是内科护士张某"，但在访问
                - code [ref=e1478]: /api/reports/R2024051235
                - text: 时，系统没有将"张某的身份及其负责的患者列表"与"报告
                - code [ref=e1479]: R2024051235
                - text: 的所属患者"进行比对。
              - paragraph [ref=e1480]:
                - text: OVTP 范式要求 O 信息贯穿到资源访问的授权判定中：每一次数据访问都必须校验
