                      - generic [ref=e1566]: scope
                - text: ，发现该报告所属患者不在张某的负责列表中，访问被拒绝。需要跨科查阅？走会诊工单流程，签发有明确时间窗口和数据范围的临时工单凭证。
              - paragraph [ref=e1567]:
                - strong [ref=e1568]: T 维度：跨链路聚合检测批量越权
                - text: 。
              - paragraph [ref=e1569]:
                - text: 单独看每一次请求——护士张某查询报告
                - code [ref=e1570]: R2024051235
                - text: ——在缺乏 O 维度归属校验的系统中，这一请求"看起来"和正常请求无异。但当 T 维度的聚合分析能力介入：
              - list [ref=e1571]:
                - listitem [ref=e1572]: 单链路追溯：某护士账号在 10 分钟内连续请求 500 份不同编号的检验报告，且编号呈顺序递增——明显的遍历行为。
                - listitem [ref=e1573]: 跨链路聚合：即使攻击者使用多个账号、分散在不同时间段、从不同终端发起请求，T 维度的关联分析仍可通过行为模式（请求频率、编号分布、访问资源的科室分布异常）识别协同攻击。
                - listitem [ref=e1574]: 异常模式检测：正常护士只访问自己负责的十几位患者的报告，攻击者访问了跨科室的大量患者报告——T 维度的聚合统计可轻松发现偏离基线的异常。
              - paragraph [ref=e1575]: 三维协同形成纵深防御：O 维度在请求级别阻断越权，V 维度从架构层面消除无范围约束的静态权限，T 维度在聚合层面检测已经绕过前两道防线的批量攻击。
              - heading [level=3] [ref=e1576]:
                - text: 7.3 OVTP 视角下的真实案件
                - link "7.3 OVTP 视角下的真实案件的直接链接" [ref=e1577] [cursor=pointer]:
                  - /url: "#73-ovtp-视角下的真实案件"
                  - text: "#"
              - paragraph [ref=e1578]: 2023 年 12 月某知名艺人去世后，其就诊电子病历截图被迅速传播至社交平台。调查发现，一名医院工作人员为炫耀将患者病历拍照发至微信群，信息随即失控扩散。同类事件在医疗系统中屡禁不止：某医院产科某护师向外部保健机构出售产妇信息数百条，每条售价数十元，信息包括姓名、住址、电话、分娩方式等完整的健康生理信息。
              - paragraph [ref=e1579]:
                - text: 这些案件的技术特征相同：操作者的角色检查全部通过了。RBAC 治不了水平越权，因为 RBAC 的
                - generic [ref=e1580]:
                  - math [ref=e1582]:
                    - generic [ref=e1585]:
                      - generic [ref=e1586]: I
                      - generic [ref=e1587]: O
                  - generic [ref=e1590]:
                    - text: I
                    - generic [ref=e1591]: O
                - text: 止步于"角色确认"，不延伸到"职责归属校验"；
                - generic [ref=e1599]:
                  - math [ref=e1601]:
                    - generic [ref=e1603]:
                      - generic [ref=e1604]:
                        - generic [ref=e1605]: I
                        - generic [ref=e1606]: V
                      - generic [ref=e1607]: ≡
                      - generic [ref=e1608]: "0"
                  - generic [aria-hidden] [ref=e1609]:
                    - generic [ref=e1610]:
                      - generic [ref=e1611]:
                        - text: I
                        - generic [ref=e1612]: V
                      - text: ≡
                    - generic [ref=e1620]: "0"
                - text: ，无工单凭证；
                - generic [ref=e1621]:
                  - math [ref=e1623]:
                    - generic [ref=e1625]:
                      - generic [ref=e1626]:
                        - generic [ref=e1627]: I
                        - generic [ref=e1628]: T
                      - generic [ref=e1629]: ≡
                      - generic [ref=e1630]: "0"
                  - generic [aria-hidden] [ref=e1631]:
                    - generic [ref=e1632]:
                      - generic [ref=e1633]:
                        - text: I
                        - generic [ref=e1634]: T
                      - text: ≡
                    - generic [ref=e1642]: "0"
                - text: ，无链路追溯。这不是实现层面的疏忽，而是模型在设计层面就缺乏防御水平越权所需的信息维度。
              - paragraph [ref=e1643]: OVTP 范式提供的是架构级的系统性解决方案：在框架层面强制要求 O 维度的职责归属校验、V 维度的范围约束绑定、T 维度的聚合异常检测——将水平越权的防御从"开发者的个人自觉"提升为"架构的强制保障"。
              - heading [level=2] [ref=e1644]:
                - text: 八、OVTP 视角下的智能体安全
                - link "八、OVTP 视角下的智能体安全的直接链接" [ref=e1645] [cursor=pointer]:
                  - /url: "#八ovtp-视角下的智能体安全"
                  - text: "#"
              - paragraph [ref=e1646]: AI 智能体（Agent）的快速兴起正在从根本上改变网络访问的模式——访问的发起者不再仅仅是人类用户，而是代表人类行事的自主 AI 系统。这对 OVTP 范式提出了全新的挑战，同时也使 OVTP 范式变得更加不可或缺。
              - heading [level=3] [ref=e1647]:
                - text: 8.1 智能体带来的 OVTP 挑战
                - link "8.1 智能体带来的 OVTP 挑战的直接链接" [ref=e1648] [cursor=pointer]:
                  - /url: "#81-智能体带来的-ovtp-挑战"
                  - text: "#"
              - paragraph [ref=e1649]:
                - strong [ref=e1650]: Operator 维度的模糊化
                - text: 。当 AI 智能体代替用户执行任务时，"实际操作者"的概念变得模糊——是下达指令的用户、是执行操作的智能体、还是智能体背后的大模型服务提供方？传统人类操作场景中"谁在操作"至少是明确的自然人；智能体场景中，一次数据库查询可能是由用户口头指令触发、经 AI 理解和规划后、通过工具调用接口自动执行的——操作链路中涉及多个不同性质的主体。
              - paragraph [ref=e1651]:
                - strong [ref=e1652]: Voucher 维度的权限放大与目的失控
                - text: 。智能体天然具有"权限放大器"的特性——用户将一项任务委托给智能体时，智能体需要调用各种工具和接口完成任务。若智能体继承了用户的全部权限而非持有一张范围受限的工单凭证，那它实际上拥有了比用户本人更大的攻击面：用户可能只会手动查询几条数据，智能体可能在数秒内自动遍历整个数据库。
              - paragraph [ref=e1653]: 更棘手的是任务目的的不确定性。AI 智能体的行为可能是大模型在复杂推理链路中"自主决定"的。用户要求"帮我分析竞品情况"，智能体可能自主决定去查询公司内部的客户数据库——这个操作是用户原始指令的合理推演，还是智能体的越界行为？没有工单凭证界定任务边界，这个问题无法回答。
              - paragraph [ref=e1654]:
                - strong [ref=e1655]: Traceable 维度的复杂化
                - text: 。智能体的决策链路往往是非确定性的——同一个指令在不同上下文中可能触发完全不同的操作序列。传统的"操作日志"不足以追溯智能体行为的完整因果链路，还需要记录智能体的推理过程、决策依据和工具调用上下文。
              - heading [level=3] [ref=e1656]:
                - text: 8.2 OVTP 范式对智能体安全的指导
                - link "8.2 OVTP 范式对智能体安全的指导的直接链接" [ref=e1657] [cursor=pointer]:
                  - /url: "#82-ovtp-范式对智能体安全的指导"
                  - text: "#"
              - paragraph [ref=e1658]: 正因为这些挑战，OVTP 范式在智能体时代反而变得更加关键。
              - paragraph [ref=e1659]:
                - strong [ref=e1660]: O 维度要求：多层身份绑定
                - text: 。智能体的每一次访问必须携带完整的身份链：底层用户身份 → 智能体实例身份 → 大模型服务身份。三层身份缺一不可——用于确定"谁发起的"（用户）、"谁执行的"（智能体实例）、"谁提供的智能"（模型服务方）。
              - paragraph [ref=e1661]: 大模型服务身份的标识尤为关键：大模型在推理过程中会接收用户数据作为上下文输入，这些数据可能在模型服务端产生遗留——包括推理日志、上下文缓存、甚至因微调或 RLHF 而被间接吸收进模型参数。若模型服务方身份未被纳入 O 维度的身份链，用户数据在模型端的流动轨迹就成为审计盲区。标记大模型服务身份，正是为了保障这一段数据流动的可溯性。
              - paragraph [ref=e1662]:
                - strong [ref=e1663]: V 维度要求：任务级工单凭证
                - text: 。智能体获得的是面向具体任务的工单凭证，而非用户的全部权限。用户将任务委托给智能体时，应签发一张范围受限的工单凭证——"允许在 30 分钟内查询 A 数据库中与竞品分析相关的非涉密表，限 100 次查询"。工单凭证同时明确任务目的和授权边界：智能体的每一步操作都应与工单凭证声明的任务保持可验证的对齐关系——若智能体执行的操作超出工单范围，应触发告警或中断执行，请求用户确认。
              - paragraph [ref=e1664]:
                - strong [ref=e1665]: T 维度要求：决策链路的完整审计
                - text: 。不仅记录智能体做了什么，还要记录智能体为什么这么做。智能体的推理链路、工具调用序列、中间结果都应纳入审计范围，使事后可以完整还原"用户指令 → 智能体理解 → 规划决策 → 工具调用 → 数据访问"的全链路。
              - paragraph [ref=e1666]: 智能体安全是 OVTP 范式最前沿的应用场景。随着智能体在企业、政务、金融等领域的快速渗透，缺乏 OVTP 保障的智能体系统将成为攻击者滥用的温床——攻击者可以通过注入恶意指令、劫持智能体的决策链路，以智能体的合法身份执行非法操作。
              - heading [level=2] [ref=e1667]:
                - text: 九、OVTP 完备性评估：从理论到实操
                - link "九、OVTP 完备性评估：从理论到实操的直接链接" [ref=e1668] [cursor=pointer]:
                  - /url: "#九ovtp-完备性评估从理论到实操"
                  - text: "#"
              - paragraph [ref=e1669]: 前文建立 OVTP 范式的形式化框架（定义 1—5、性质 1）并审视传统模型的缺陷，§7 和 §8 分别从水平越权和智能体安全两个场景展示 OVTP 范式的实战意义。一个自然的问题是：给定企业或机构的真实网络环境，如何系统性地评估其 OVTP 完备性？
              - heading [level=3] [ref=e1670]:
                - text: 9.1 评估流程
                - link "9.1 评估流程的直接链接" [ref=e1671] [cursor=pointer]:
                  - /url: "#91-评估流程"
                  - text: "#"
              - paragraph [ref=e1672]: OVTP 完备性评估分为四个步骤：
              - paragraph [ref=e1673]:
                - strong [ref=e1674]: 第一步：枚举关键访问链路
                - text: 。梳理企业网络中所有涉及敏感资源（核心数据库、客户信息、财务系统、运维管控面等）的访问链路。每条链路从终端用户（或智能体）发起，到最终资源被访问，标记沿途经过的所有节点（终端、网关、认证服务、微服务、中间件、数据库等）。重点关注跨部门、跨系统、涉及第三方的链路——这些链路通常最长、域边界最多、OVT 信息衰减风险最高。
              - paragraph [ref=e1675]:
                - strong [ref=e1676]: 第二步：识别域边界
                - text: 。在每条链路上标记所有域边界——跨网络域（内网 → 云、云 → 云）、跨信任域（本组织 → 外包方、本组织 → SaaS 平台）、跨技术形态（传统系统 → 智能体调用链）。OVT 信息在域内通常呈二值特征（要么全程转发、要么全程缺失），真正的断裂风险集中在域边界。
              - paragraph [ref=e1677]:
                - strong [ref=e1678]: 第三步：逐边界评估 OVT 信息交接状态
                - text: 。在每个域边界处，分别评估三个维度：
