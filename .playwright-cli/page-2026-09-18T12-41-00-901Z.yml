              - paragraph [ref=e1545]: 即：要么被访问资源在操作者的职责范围内，要么操作者持有明确的委托授权（通过工单凭证 V 声明——例如科室间会诊工单授权外科护士查阅内科患者的特定检验结果）。这条规则在 RBAC 中不存在。
              - paragraph [ref=e1546]:
                - strong [ref=e1547]: V 维度：无工单凭证约束访问范围
                - text: 。
              - paragraph [ref=e1548]:
                - text: 没有工单凭证机制时，护士对"查看检验报告"的权限是无范围约束的静态权限——只要角色匹配，任何报告编号都可以查。如果引入工单凭证机制：每一次数据访问都隐式关联着一张范围为
                - code [ref=e1549]: "scope = {reports where patient ∈ assigned_patients(张某)}"
                - text: 的工单凭证。当张某试图访问报告
                - code [ref=e1550]: R2024051235
                - text: 时，系统校验
                - generic [ref=e1551]:
                  - math [ref=e1553]:
                    - generic [ref=e1555]:
                      - generic [ref=e1556]: e
                      - generic [ref=e1557]: .
                      - generic [ref=e1558]: r
