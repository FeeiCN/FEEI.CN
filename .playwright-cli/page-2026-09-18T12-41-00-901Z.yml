                - text: ，可直观看到哪些链路的 OVT 信息存活概率最低、哪些域边界是系统性的断裂高发点。治理优先级依据两个维度排序：一是链路的业务敏感度（涉及核心资产的链路优先），二是 OVT 断裂的严重程度（三维同时归零的边界优先于单维缺失的边界）。
