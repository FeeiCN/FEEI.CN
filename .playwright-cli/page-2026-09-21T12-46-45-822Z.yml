                    - generic [ref=f1e245]: 本文件迭代 1 版，最后更新于 2026年9月16日
                - heading "创造确定性人生" [level=1] [ref=f1e85]
                - paragraph [ref=f1e93]: 有一天，我站在镜子前，看了自己很久。肚子越来越大，脸有些浮肿，眼神总是疲惫。体检报告上的异常指标也越来越多。
                - paragraph [ref=f1e94]: 可我每天依然很忙。工作不错，收入不错，生活也没出什么大问题。
                - paragraph [ref=f1e95]: 我最常用来安慰自己的三个字是：
                - paragraph [ref=f1e96]:
                  - strong [ref=f1e97]: “还行吧。”
                - paragraph [ref=f1e98]:
                  - text: 后来我才发现，
                  - strong [ref=f1e99]: “还行”可能不是一种安全的状态，而是一种很难被察觉的停滞。
                - paragraph [ref=f1e100]:
                  - generic [ref=f1e101]:
                    - img "镜子前疲惫的自己" [ref=f1e102]
                    - text: 图片加载失败
                - paragraph [ref=f1e103]: 朋友被裁后，一直没有找到合适的工作。房贷还了很久，本金却没少多少。那辆当初买来爬山、过河的吉普车，也已经很久没有离开城市。
                - paragraph [ref=f1e104]: 还有一件更难承认的事：自己的能力还在增长，但速度明显比以前慢了。工作、会议、消息，把一天塞得很满。可身体、能力、财富、家人，还有一直想去看看的世界，没有一件因为忙碌自动变好。
                - heading [level=2] [ref=f1e105]:
                  - text: 如果一直这样下去呢？
                  - link "如果一直这样下去呢？的直接链接" [ref=f1e106] [cursor=pointer]:
                    - /url: "#如果一直这样下去呢"
                    - text: "#"
                - paragraph [ref=f1e107]: 我开始问自己一些以前不太愿意认真回答的问题：如果再这样过五年，我的身体会是什么样？如果有一天失去现在的工作，我还有多少重新选择的能力？房贷什么时候才能真正变成一个不需要考虑的问题？还有多少地方，我一直说“以后去”，最后却从来没有出发？如果能力增长越来越慢，我会不会在某一天突然发现，自己已经很久没有真正变强？
                - paragraph [ref=f1e108]: 还有家人。我们总觉得以后还有很多时间，可父母会老，孩子会长大，很多今天习以为常的相处，过几年就再也不会以同样的方式出现。
                - paragraph [ref=f1e109]: 这些问题没有让我突然找到答案，却逼着我重新问了一遍：
                - paragraph [ref=f1e110]:
                  - strong [ref=f1e111]: 我到底想要怎样的人生？
                - paragraph [ref=f1e112]: 想了很久，其实并不复杂：身体和精神都还不错，有时间陪重要的人；始终有能力做值得做的事；钱不再迫使自己做不想做的选择；工作之外，真正去看过一些地方，也做过一些只是因为有意思而想做的事。
                - paragraph [ref=f1e113]: 最后，我把它们归成四件事：
                - paragraph [ref=f1e114]:
                  - strong [ref=f1e115]:
                    - link "健康幸福" [ref=f1e116] [cursor=pointer]:
                      - /url: /health
                  - text: —— 身体和精神都还不错，重要的人还在身边。
                  - strong [ref=f1e117]:
                    - link "事业有成" [ref=f1e118] [cursor=pointer]:
                      - /url: /capability
                  - text: —— 始终有能力做值得做的事。
                  - strong [ref=f1e119]:
                    - link "财务自由" [ref=f1e120] [cursor=pointer]:
                      - /url: /wealth
                  - text: —— 钱不再迫使我做不想做的选择。
                  - strong [ref=f1e121]:
                    - link "人生丰富" [ref=f1e122] [cursor=pointer]:
                      - /url: /experience
                  - text: —— 真正去看世界，也做一些只是因为有意思的事。
                - paragraph [ref=f1e123]: 这四件事后来成了我判断很多选择的坐标。
                - heading [level=2] [ref=f1e124]:
                  - text: 我想要的“确定性”是什么？
                  - link "我想要的“确定性”是什么？的直接链接" [ref=f1e125] [cursor=pointer]:
                    - /url: "#我想要的确定性是什么"
                    - text: "#"
                - paragraph [ref=f1e126]: 世界当然不会因为定了几个目标就变得确定。疾病可能突然发生，行业可能变化，工作可能消失，市场可能暴跌，计划好的旅行也可能因为一场雨取消。
                - paragraph [ref=f1e127]:
                  - strong [ref=f1e128]: 我们无法创造一个确定的未来。
                - paragraph [ref=f1e129]: 但可以让自己拥有更健康的身体、更强的能力、更多的选择权，以及更丰富的经历。不知道未来会不会生病，但可以让身体比过去更健康一点；不知道职业会发生什么变化，但可以让自己的能力比去年更强一点；不知道市场明天涨还是跌，但可以持续储蓄和投资，让自己拥有更多选择权；不知道人生究竟有多长，但可以在还能出发的时候多去一些地方，在家人还在身边的时候多陪他们一会儿。
                - paragraph [ref=f1e130]: 未来仍然充满偶然。
                - paragraph [ref=f1e131]:
                  - strong [ref=f1e132]: 所谓创造确定性，不是让意外消失，而是让自己越来越能承受意外。
                - paragraph [ref=f1e133]: 这就是我理解的确定性。
                - paragraph [ref=f1e134]:
                  - img "通往远方的路" [ref=f1e136]
                - heading [level=2] [ref=f1e137]:
                  - text: 重要的事情，不会自动变好
                  - link "重要的事情，不会自动变好的直接链接" [ref=f1e138] [cursor=pointer]:
                    - /url: "#重要的事情不会自动变好"
                    - text: "#"
                - paragraph [ref=f1e139]:
                  - text: 后来我发现，很多人生问题有一个共同特点：
                  - strong [ref=f1e140]: 放着不管，通常不会自己变好。
                - paragraph [ref=f1e141]: 身体不会因为工作忙就自动保持健康，能力不会因为工作年限增加就自动增长，钱放在那里不会自动变成自由，关系建立以后也不会自动保持亲密。甚至一个房间，很久没人整理，也会慢慢变乱。
                - paragraph [ref=f1e142]: 一次跑步不会让人健康，读完一本书不会让人突然变聪明，存下一笔钱也不会带来财务自由。真正产生变化的，往往是那些看起来很小、却重复了很多年的选择。
                - paragraph [ref=f1e143]:
                  - text: 后来我把这种现象叫作
                  - link "人生里的“逆熵”" [ref=f1e144] [cursor=pointer]:
                    - /url: /life-entropy
                  - text: ：重要的东西，都需要持续维护。所以我不再特别期待某一天突然出现一个巨大的转机。
                - paragraph [ref=f1e145]: 我更愿意相信：
                - paragraph [ref=f1e146]:
                  - strong [ref=f1e147]: 时间、精力和钱长期流向哪里，人最终就会走向哪里。
                - heading [level=2] [ref=f1e148]:
                  - text: 我说的，和我做的
                  - link "我说的，和我做的的直接链接" [ref=f1e149] [cursor=pointer]:
                    - /url: "#我说的和我做的"
                    - text: "#"
                - paragraph [ref=f1e150]: 这句话真正落到自己身上，其实不太舒服。
                - paragraph [ref=f1e151]: 我说自己重视健康，可有段时间几乎不运动，体检异常却越来越多；我说想去看世界，那辆为了爬山、过河买的吉普车，却很久没有离开城市；我说希望拥有更多选择权，可房贷还了很久，本金依然在那里；我说能力很重要，却也能明显感觉到，自己的成长速度没有以前快了。
                - paragraph [ref=f1e152]: 愿望没有那么诚实。日历、账单、体重秤、手机使用时间，以及一天结束以后自己到底做了什么，反而诚实得多。
                - paragraph [ref=f1e153]: 如果你现在也觉得自己的生活“还行”，不妨问自己三个问题：
                - paragraph [ref=f1e154]:
                  - strong [ref=f1e155]: 过去一年，什么正在悄悄变坏？
                  - strong [ref=f1e156]: 如果继续这样五年，我能接受那个自己吗？
                  - strong [ref=f1e157]: 我的时间、精力和钱，真的流向了我嘴上说重要的地方吗？
                - paragraph [ref=f1e158]:
                  - text: 我也开始反复问自己这些问题。后来，我把目标、数据、日记、复盘、工具和 AI Agent 慢慢连成了一套
                  - link "自己的 Life OS" [ref=f1e159] [cursor=pointer]:
                    - /url: /life-os
                  - text: ，不是为了把生活全部量化，而是为了少一点反复下决心，多一点真正发生的改变。
                - heading [level=2] [ref=f1e160]:
                  - text: 没有哪一天发生了奇迹
                  - link "没有哪一天发生了奇迹的直接链接" [ref=f1e161] [cursor=pointer]:
                    - /url: "#没有哪一天发生了奇迹"
                    - text: "#"
                - paragraph [ref=f1e162]: 想明白这些以后，我并没有突然变成另外一个人。改变还是很慢。
                - paragraph [ref=f1e163]: 镜子里的肚子没有突然消失，但体重从最高八十公斤左右，慢慢回到了七十多公斤。那笔好像永远还不完的房贷，从七十多万一点点还到了三十多万。那辆很久没有离开城市的吉普车，也重新开去了山里，后来又去了西藏、云南、贵州和更多地方。
                - paragraph [ref=f1e164]: 能力还是一件件事情做出来的，去过的地方也只能一个一个增加。有时候依然会吃多，会偷懒，会刷很久手机，会做一些后来觉得毫无意义的事。很多计划也没有按预想发生。
                - paragraph [ref=f1e165]: 没有哪一天发生了奇迹。
                - paragraph [ref=f1e166]:
                  - strong [ref=f1e167]: 只是很多普通的日子，最后站到了同一边。
                - paragraph [ref=f1e168]: 我也慢慢接受：
                - paragraph [ref=f1e169]:
                  - strong [ref=f1e170]: 确定性不是每天都做对，而是长期没有走错方向。
                - paragraph [ref=f1e171]: 今天多走半小时，少吃一点，认真完成一件真正重要的工作，存下一笔钱，读几页书，陪家人吃顿饭，或者只是放下手机，好好看看眼前正在发生什么。
                - paragraph [ref=f1e172]: 单独拿出来，都不足以改变人生。时间足够长以后，它们才慢慢变成身体、能力、财富、关系和经历。
                - heading [level=2] [ref=f1e173]:
                  - text: 再回到那面镜子
                  - link "再回到那面镜子的直接链接" [ref=f1e174] [cursor=pointer]:
                    - /url: "#再回到那面镜子"
                    - text: "#"
                - paragraph [ref=f1e175]: 我不知道五年、十年以后，自己会是什么样，也无法保证四个目标最终都能实现。生活一定还会出现很多计划之外的事情。
                - paragraph [ref=f1e176]: 但我已经不再等待一个突然变好的人生。我只想把有限的时间、精力和钱，慢慢投向真正重要的地方。
                - paragraph [ref=f1e177]: 希望很多年以后，再站到那面镜子前，我看到的不是一个所谓“成功的人”，而是一个身体还不错，有能力选择自己想做的事，不必总为钱焦虑，和重要的人关系很好，也真正去看过这个世界的人。
                - paragraph [ref=f1e178]:
                  - img "窗前望向远方的人" [ref=f1e180]
                - paragraph [ref=f1e181]:
                  - strong [ref=f1e182]: 尽吾志也，而不能至者，可以无悔矣。
